<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><meta http-equiv="Cache-Control" content="no-store"><title>AXIOM Pulse Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101b;--p:#10243a;--p2:#162e47;--l:#30506f;--t:#f6f8fb;--m:#a1b4ca;--b:#4b9af1;--g:#2fd18d;--r:#ef6676;--y:#f2b650}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;background:radial-gradient(circle at 50% 25%,#143455,#081624 44%,#040b13 100%)}.wrap{width:min(980px,100%)}.identity{position:relative;min-height:315px;display:grid;place-items:center;text-align:center;overflow:hidden}.ecg{position:absolute;left:0;right:0;top:35%;height:120px;overflow:hidden}.ecg svg{width:100%;height:100%}.ecg path{fill:none;stroke:#3f98ea;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1250;stroke-dashoffset:1250;animation:draw 2.4s linear infinite,glow 1.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #4da8ff)}@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{50%{opacity:1;filter:drop-shadow(0 0 18px #5db1ff)}}.logo{display:flex;align-items:baseline;justify-content:center;gap:14px;position:relative;z-index:2}.axiom{font-size:71px;font-weight:950;letter-spacing:.105em}.pulse{font-size:62px;font-style:italic;font-weight:850;color:#58a5fb;text-shadow:0 0 20px #3184eeaa}.meaning{position:relative;z-index:2;margin-top:34px;color:#7db0dc;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive}.tag{position:relative;z-index:2;margin-top:9px;color:#cbd6e1;font-size:16px}.card{background:linear-gradient(145deg,#12283f,#0e1c2d);border:1px solid var(--l);border-radius:22px;padding:20px;box-shadow:0 20px 65px #0007;margin:12px 0}.auth{width:min(700px,100%);margin:auto}.muted{color:var(--m)}label{display:block;font-size:12px;color:#a9bad0;margin-top:12px}.input,select,textarea{width:100%;margin-top:6px;padding:13px;background:#081624;color:#fff;border:1px solid #315473;border-radius:13px}.btn{width:100%;margin-top:11px;padding:14px 16px;border:0;border-radius:14px;background:var(--b);color:#06111c;font-weight:900}.btn.s{background:var(--p2);color:#eef5ff;border:1px solid #385b7c}.btn.d{background:#55242e;color:#ffdce1;border:1px solid #7b3643}.small{width:auto;padding:9px 12px;font-size:12px}.msg{min-height:20px;margin-top:9px;color:var(--m);font-size:13px}.app{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101b)}.head{position:sticky;top:0;z-index:10;padding:12px 17px;background:#102238f3;border-bottom:1px solid var(--l)}.headrow{display:flex;align-items:baseline;gap:9px}.headrow b{font-size:25px;letter-spacing:.18em}.headrow i{font-size:23px;font-style:italic;color:#5fa9ff}.meta{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#79aadb;margin-top:5px}.hby{font:italic 14px "Segoe Script","Brush Script MT",cursive}.main{max-width:1120px;margin:auto;padding:18px 15px 96px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--l);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:9px}.list{display:grid;gap:10px}.item{padding:13px 0;border-bottom:1px solid #21384f}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#193e33;color:#93f2c0;font-size:11px}.out{background:#4a2229;color:#ffbec7}.warn{background:#4b3a1d;color:#ffdb90}.req{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #21384f}.check{width:24px;height:24px;border-radius:8px;border:1px solid #416383;display:grid;place-items:center;flex:none}.done{background:#1d7b58;border-color:#36d796}.exc{background:#7b303b;border-color:#ff7c8c}.reqbody{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;height:74px;background:#101f32f5;border-top:1px solid var(--l);display:flex;justify-content:space-around;z-index:20}.nav button{background:none;border:0;color:#92a8c0;font-size:10px}.nav button.active{color:#fff}.nav b{display:block;font-size:20px}.notice{position:fixed;top:12px;left:12px;right:12px;z-index:80;background:#143852;border:1px solid #4e9fff;border-radius:16px;padding:13px;box-shadow:0 18px 50px #0009}.modal{position:fixed;inset:0;background:#000b;z-index:70;display:grid;place-items:end}.sheet{width:min(100%,760px);max-height:92dvh;overflow:auto;background:#10243a;border-radius:25px 25px 0 0;padding:18px 16px}.bar{padding:9px;border-radius:12px;border:1px solid #806b38;background:#3c301b;color:#ffe0a0;text-align:center;font-size:12px;margin-bottom:12px}@media(max-width:560px){.page{padding:8px}.identity{min-height:285px}.axiom{font-size:43px}.pulse{font-size:38px}.ecg{top:34%;height:105px}.meaning{font-size:8px;letter-spacing:.08em}.by{font-size:17px}.tag{font-size:13px}.card{padding:18px}.grid{gap:7px}.stat{padding:10px}.headrow b{font-size:22px}.headrow i{font-size:20px}}

const SUPA='https://xjahoajimgdyuwxdjakw.supabase.co',KEY='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD';const db=supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const R=document.getElementById('root');const S={profile:null,session:null,mode:'master',screen:'home',deliveries:[],templates:[],team:[],notifications:[],rt:null};const realRole=()=>S.profile?.role;const role=()=>S.mode==='master'?realRole():S.mode;const testing=()=>!!S.profile&&S.mode!=='master';const master=()=>realRole()==='master'&&S.mode==='master';const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const msg=(t,b='')=>{document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted">'+esc(b)+'</div>';document.body.append(n);setTimeout(()=>n.remove(),4500)};
function identity(){return '<div class="identity"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}
function showLogin(text=''){R.innerHTML='<main class="page"><section class="wrap">'+identity()+'<section class="auth"><div class="card"><h2>Secure Sign In</h2><p class="muted">Authorized AXIOM PULSE access.</p><div id="am" class="msg">'+esc(text)+'</div><label>Email<input id="le" class="input" type="email" autocomplete="username"></label><label>Password<input id="lp" class="input" type="password" autocomplete="current-password"></label><button id="lb" class="btn" onclick="signIn()">ENTER AXIOM PULSE</button><button class="btn s" onclick="showJoin()">JOIN WITH INVITATION</button></div></section></section></main>'}
async function signIn(){const m=document.getElementById('am'),b=document.getElementById('lb'),email=document.getElementById('le').value.trim(),password=document.getElementById('lp').value;if(!email||!password){m.textContent='Enter your email address and password.';return}b.disabled=true;b.textContent='SIGNING IN…';try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;const{data:p,error:pe}=await db.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(pe||!p)throw new Error('This account is not authorized for AXIOM PULSE.');if(!p.active)throw new Error('This AXIOM PULSE account is inactive.');S.session=data.session;S.profile=p;S.mode='master';await load();subscribe();render()}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='ENTER AXIOM PULSE'}}
function showJoin(){R.innerHTML='<main class="page"><section class="wrap">'+identity()+'<section class="auth"><div class="card"><h2>Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div id="jm" class="msg"></div><label>Full name<input id="jn" class="input"></label><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label><label>Email<input id="je" class="input" type="email"></label><label>Create password<input id="jp" class="input" type="password"></label><button class="btn" onclick="join()">CREATE ACCOUNT</button><button class="btn s" onclick="showLogin()">BACK TO SIGN IN</button></div></section></section></main>'}
async function join(){const m=document.getElementById('jm'),n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6){m.textContent='Complete every field. Password must be at least 6 characters.';return}try{const r=await fetch(SUPA+'/functions/v1/create-invited-user',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({full_name:n,email:e,password:p,invite_code:c})});const j=await r.json();if(!r.ok||j.error)throw new Error(j?.error||'Unable to create account.');const s=await db.auth.signInWithPassword({email:e,password:p});if(s.error)throw s.error;S.session=s.data.session;S.profile=(await db.from('profiles').select('*').eq('id',s.data.user.id).single()).data;await load();subscribe();render()}catch(e){m.textContent=e.message}}
async function load(){if(testing()){demo();return}const q=realRole()==='salesperson'?db.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',S.profile.id).order('delivery_at'):db.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',S.profile.dealership_id).order('delivery_at');const[t,d,n]=await Promise.all([db.from('requirement_templates').select('*').eq('dealership_id',S.profile.dealership_id).order('sort_order'),q,db.from('notification_history').select('*').eq('user_id',S.profile.id).order('sent_at',{ascending:false}).limit(50)]);S.templates=t.data||[];S.deliveries=d.data||[];S.notifications=n.data||[];if(master())S.team=(await db.from('profiles').select('id,full_name,role,active').eq('dealership_id',S.profile.dealership_id).order('created_at',{ascending:false})).data||[]}
function demo(){S.deliveries=[{id:'demo',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and signed trade release form.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false},{id:'r4',label:'$500 due on delivery',kind:'money_collect',amount:500,completed:false}]}];S.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}]}
function appBrand(){return '<header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="meta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button onclick="go(\'home\')">Home</button><button onclick="go(\'deliveries\')">Deliveries</button><button onclick="go(\'notifications\')">Alerts</button>'+(master()?'<button onclick="go(\'team\')">Team</button>':'')+'<button onclick="go(\'account\')">Account</button></nav>'}function render(){R.innerHTML='<div class="app">'+appBrand()+'<main class="main">'+(testing()?'<div class="bar">TEST '+S.mode.toUpperCase()+' MODE · Master session preserved · changes are simulated</div>':'')+screen()+'</main>'+nav()+'</div>'}function screen(){if(S.screen==='deliveries')return deliveries();if(S.screen==='notifications')return notifications();if(S.screen==='team')return team();if(S.screen==='library')return library();if(S.screen==='account')return account();if(S.screen.startsWith('delivery:'))return detail(S.screen.slice(9));return home()}function home(){const a=S.deliveries.filter(d=>d.status!=='delivered'),o=a.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="eyebrow">'+role().toUpperCase()+' ACCESS</div><h1>'+(master()?'Master Control Center':role()==='fsm'?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted">Welcome, '+esc(S.profile.full_name)+'.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>'+a.length+'</b>Active</div><div class="stat"><b>'+a.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b>Today</div><div class="stat"><b>'+o+'</b>Outstanding</div></div><div class="card"><h2>The delivery is the record</h2><p class="muted">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(master()?'<div class="card"><h2>Master Control</h2><p class="muted">Full authority. Test each operational level without changing your real Master role.</p><div class="stack"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn s" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn s" onclick="go(\'team\')">MANAGE USERS</button><button class="btn s" onclick="go(\'library\')">REQUIREMENT LIBRARY</button></div></div>':'')+(testing()?'<div class="card"><button class="btn s" onclick="exitTest()">RETURN TO MASTER</button></div>':'')}function deliveries(){return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div>'+(role()==='fsm'||master()?'<button class="btn small" onclick="createDelivery()">＋ CREATE</button>':'')+'</div><div class="list" style="margin-top:12px">'+S.deliveries.map(d=>'<div class="card" onclick="go(\'delivery:'+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+'</div></div><span class="badge out">'+esc(d.status)+'</span></div><div class="row"><span class="muted">'+new Date(d.delivery_at).toLocaleString()+'</span><span class="muted">'+(d.delivery_requirements||[]).filter(r=>r.completed||r.exception_reason).length+'/'+(d.delivery_requirements||[]).length+' resolved</span></div></div>').join('')||'<div class="card muted">No deliveries yet.</div></div>'}function detail(id){const d=S.deliveries.find(x=>x.id===id);if(!d)return '<div class="card">Delivery not found.</div>';const rs=d.delivery_requirements||[],out=rs.filter(r=>!r.completed&&!r.exception_reason);return '<button class="btn ghost small" onclick="go(\'deliveries\')">← BACK</button><div class="card"><div class="eyebrow">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><div class="muted">'+esc(d.vehicle)+'</div><p class="muted" style="margin-top:10px">'+new Date(d.delivery_at).toLocaleString()+' · '+esc(d.lender_name||'')+'</p>'+(d.fsm_notes?'<div class="panel">'+esc(d.fsm_notes)+'</div>':'')+'</div><div class="row"><h2>Delivery Requirements</h2>'+(role()==='fsm'||master()?'<button class="btn s small" onclick="showAddReq(\''+d.id+'\')">＋ ADD</button>':'')+'</div><div class="card">'+rs.map(r=>'<div class="req"><span class="check '+(r.completed?'done':r.exception_reason?'exc':'')+'">'+(r.completed?'✓':r.exception_reason?'!':'')+'</span><div class="reqbody"><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.kind||'custom')+(r.amount?' · '+money(r.amount):'')+'</div>'+(r.completed?'<span class="badge">COMPLETED</span>':r.exception_reason?'<span class="badge out">EXCEPTION · '+esc(r.exception_reason)+'</span>':'<span class="badge warn">OUTSTANDING</span>')+(role()==='salesperson'&&!r.completed&&!r.exception_reason?'<div class="actions"><button class="btn s small" onclick="completeReq(\''+id+'\',\''+r.id+'\')">COMPLETE</button><button class="btn d small" onclick="exceptionReq(\''+id+'\',\''+r.id+'\')">EXCEPTION</button></div>':'')+'</div></div>').join('')+'</div>'+(role()==='salesperson'?'<div class="card"><h2>Delivery Completion</h2><p class="muted">'+(out.length?'⚠️ '+out.length+' requirement(s) remain outstanding.':'All requirements resolved.')+'</p><button class="btn" '+(out.length?'disabled':'')+' onclick="finishDelivery(\''+id+'\')">COMPLETE DELIVERY</button></div>':'')}function money(n){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n||0))}function completeReq(id,rid){if(testing()){const r=S.deliveries.find(d=>d.id===id).delivery_requirements.find(x=>x.id===rid);r.completed=true;msg('Requirement completed','TEST MODE — simulated live FSM notification.');return render()}db.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:S.profile.id,exception_reason:null}).eq('id',rid).then(async({error})=>{if(error)return msg('Unable to complete',error.message);await load();render()})}function exceptionReq(id,rid){sheet('<h2>Mark as exception</h2><p class="muted">The reason becomes part of the delivery history.</p><textarea id="ex" class="input" placeholder="Example: Customer will provide electronically tomorrow."></textarea><button class="btn d" onclick="saveException(\''+id+'\',\''+rid+'\')">RECORD EXCEPTION</button>')}async function saveException(id,rid){const reason=document.getElementById('ex').value.trim();if(!reason)return msg('Reason required');if(testing()){const r=S.deliveries.find(d=>d.id===id).delivery_requirements.find(x=>x.id===rid);r.exception_reason=reason;r.completed=false;closeSheet();msg('Exception recorded','TEST MODE — simulated live FSM notification.');return render()}const{error}=await db.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.profile.id}).eq('id',rid);if(error)return msg('Unable to record',error.message);closeSheet();await load();render()}async function finishDelivery(id){if(testing()){const d=S.deliveries.find(x=>x.id===id);if((d.delivery_requirements||[]).some(r=>!r.completed&&!r.exception_reason))return msg('Delivery blocked','Outstanding requirements remain.');d.status='delivered';return render()}const{error}=await db.rpc('complete_delivery',{p_delivery_id:id});if(error)return msg('Delivery not completed',error.message);await load();render()}function showAddReq(id){const opts=S.templates.map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join('');sheet('<h2>Add Delivery Requirement</h2><label>Requirement<select id="rq" class="input"><option value="">Custom</option>'+opts+'</select></label><label>Label<input id="rl" class="input"></label><label>Amount<input id="ra" class="input" type="number" step="0.01"></label><button class="btn" onclick="saveAddReq(\''+id+'\')">ADD REQUIREMENT</button>')}async function saveAddReq(id){const t=S.templates.find(x=>x.id===document.getElementById('rq').value),label=(document.getElementById('rl').value.trim()||t?.label||'').trim();if(!label)return msg('Requirement needed');const amount=document.getElementById('ra').value||null;if(testing()){S.deliveries.find(d=>d.id===id).delivery_requirements.push({id:'r'+Date.now(),label,kind:t?.kind||'custom',amount,completed:false});closeSheet();msg('New instruction added','TEST MODE — simulated salesperson update.');return render()}const{error}=await db.from('delivery_requirements').insert({delivery_id:id,kind:t?.kind||'custom',label,amount});if(error)return msg('Unable to add',error.message);closeSheet();await load();render()}function createDelivery(){if(testing())return sheet('<h2>Create Test Delivery</h2><label>Customer<input id="tc" class="input"></label><label>Vehicle<input id="tv" class="input"></label><label>Date<input id="td" class="input" type="date"></label><label>Time<input id="tt" class="input" type="time"></label><button class="btn" onclick="saveTest()">CREATE TEST DELIVERY</button>');const sales=S.team.filter(p=>p.role==='salesperson'&&p.active);sheet('<h2>Create Delivery</h2><label>Customer<input id="dc" class="input"></label><label>Vehicle<input id="dv" class="input"></label><label>Lender / Lessor<input id="dl" class="input"></label><label>Approval<select id="da" class="input"><option value="approved">Approved</option><option value="pending">Pending</option><option value="conditional">Conditional</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="dd" class="input" type="date"></label><label>Time<input id="dt" class="input" type="time"></label></div><label>Salesperson<select id="ds" class="input">'+sales.map(p=>'<option value="'+p.id+'">'+esc(p.full_name)+'</option>').join('')+'</select></label><label>FSM notes<textarea id="dn" class="input"></textarea></label><button class="btn" onclick="saveDelivery()">CREATE DELIVERY</button>')}function saveTest(){S.deliveries.unshift({id:'d'+Date.now(),customer_name:document.getElementById('tc').value||'Test Customer',vehicle:document.getElementById('tv').value||'Test Vehicle',delivery_at:new Date((document.getElementById('td').value||new Date().toISOString().slice(0,10))+'T'+(document.getElementById('tt').value||'15:00')).toISOString(),status:'scheduled',delivery_requirements:[]});closeSheet();go('deliveries')}async function saveDelivery(){const{error}=await db.rpc('create_delivery_with_requirements',{p_customer_name:document.getElementById('dc').value.trim(),p_vehicle:document.getElementById('dv').value.trim(),p_lender_name:document.getElementById('dl').value.trim(),p_approval_status:document.getElementById('da').value,p_delivery_at:new Date(document.getElementById('dd').value+'T'+document.getElementById('dt').value).toISOString(),p_salesperson_id:document.getElementById('ds').value,p_fsm_notes:document.getElementById('dn').value.trim(),p_requirements:[]});if(error)return msg('Unable to create delivery',error.message);closeSheet();await load();go('deliveries')}function team(){return '<div class="row"><div><div class="eyebrow">Master Authority</div><h1>Manage Users</h1></div><button class="btn small" onclick="invite()">＋ INVITE</button></div><div class="card">'+S.team.filter(x=>x.id!==S.profile.id).map(p=>'<div class="item"><div class="row"><div><b>'+esc(p.full_name||'Unnamed user')+'</b><div class="muted">'+esc(p.role)+' · '+(p.active?'Active':'Inactive')+'</div></div><div class="actions"><button class="btn s small" onclick="editUser(\''+p.id+'\')">EDIT</button><button class="btn d small" onclick="removeUser(\''+p.id+'\',\''+esc(p.full_name||p.role)+'\')">REMOVE</button></div></div>'+(p.role==='fsm'?'<div class="row" style="margin-top:8px"><span class="muted">Requirement Library Authority</span><button class="btn s small" onclick="toggleFsm(\''+p.id+'\')">CHANGE</button></div>':'')+'</div>').join('')||'<div class="muted">No team members yet.</div></div>'}function invite(){sheet('<h2>Create Team Invitation</h2><p class="muted">The Finance Manager assigns the role. Users cannot self-elevate.</p><label>Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="iout" class="msg"></div>')}async function createInvite(){const{data,error}=await db.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return msg('Unable to create invitation',error.message);document.getElementById('iout').textContent='Invitation code: '+(typeof data==='string'?data:data?.code||JSON.stringify(data))}function editUser(id){const p=S.team.find(x=>x.id===id);sheet('<h2>Edit User</h2><label>Full name<input id="un" class="input" value="'+esc(p.full_name||'')+'"></label><label>Email<input id="ue" class="input" type="email" placeholder="Leave blank to keep current"></label><label>New password<input id="up" class="input" type="password" placeholder="Leave blank to keep current"></label><label>Role<select id="ur" class="input"><option value="fsm" '+(p.role==='fsm'?'selected':'')+'>FSM</option><option value="salesperson" '+(p.role==='salesperson'?'selected':'')+'>Salesperson</option></select></label><label>Status<select id="ua" class="input"><option value="true" '+(p.active?'selected':'')+'>Active</option><option value="false" '+(!p.active?'selected':'')+'>Inactive</option></select></label><button class="btn" onclick="saveUser(\''+id+'\')">SAVE CHANGES</button>')}async function saveUser(id){const body={op:'update',user_id:id,full_name:document.getElementById('un').value.trim(),role:document.getElementById('ur').value,active:document.getElementById('ua').value==='true'};const e=document.getElementById('ue').value.trim(),p=document.getElementById('up').value;if(e)body.email=e;if(p)body.password=p;const r=await fetch(SUPA+'/functions/v1/manage-team-user-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+S.session.access_token},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||j.error)return msg('Unable to update user',j?.error||'Request failed.');closeSheet();await load();render()}async function removeUser(id,name){if(!confirm('Remove '+name+' from AXIOM PULSE? Delivery history is preserved.'))return;const r=await fetch(SUPA+'/functions/v1/manage-team-user-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+S.session.access_token},body:JSON.stringify({op:'delete',user_id:id})}),j=await r.json();if(!r.ok||j.error)return msg('Unable to remove user',j?.error||'Request failed.');await load();render()}async function toggleFsm(id){const{error}=await db.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:true});if(error)return msg('Unable to update authority',error.message);await load();render()}function library(){const can=master()||(realRole()==='fsm'&&S.profile.can_manage_requirement_library)||testing();return '<button class="btn ghost small" onclick="go(\'home\')">← BACK</button><div class="row"><div><div class="eyebrow">Reusable Requirements</div><h1>Requirement Library</h1></div>'+(can?'<button class="btn small" onclick="newTemplate()">＋ ADD</button>':'')+'</div><div class="card">'+S.templates.map(t=>'<div class="item row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category)+' · '+esc(t.kind)+'</div></div>'+(can?'<button class="btn s small" onclick="editTemplate(\''+t.id+'\')">EDIT</button>':'')+'</div>').join('')+'</div>'}function newTemplate(){sheet('<h2>Add Requirement</h2><label>Name<input id="tn" class="input"></label><label>Category<select id="tcat" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Other</option></select></label><label>Type<select id="tk" class="input"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select></label><button class="btn" onclick="saveTemplate()">SAVE REQUIREMENT</button>')}function editTemplate(id){const t=S.templates.find(x=>x.id===id);sheet('<h2>Edit Requirement</h2><label>Name<input id="tn" class="input" value="'+esc(t.label)+'"></label><label>Category<select id="tcat" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Other</option></select></label><button class="btn" onclick="updateTemplate(\''+id+'\')">SAVE CHANGES</button>')}async function saveTemplate(){const label=document.getElementById('tn').value.trim();if(!label)return msg('Name required');if(testing()){S.templates.push({id:'t'+Date.now(),label,category:document.getElementById('tcat').value,kind:'custom',active:true});closeSheet();return render()}const{error}=await db.from('requirement_templates').insert({dealership_id:S.profile.dealership_id,label,category:document.getElementById('tcat').value,kind:document.getElementById('tk').value,active:true,created_by:S.profile.id});if(error)return msg('Unable to save',error.message);closeSheet();await load();render()}async function updateTemplate(id){const label=document.getElementById('tn').value.trim(),category=document.getElementById('tcat').value;if(testing()){Object.assign(S.templates.find(x=>x.id===id),{label,category});closeSheet();return render()}const{error}=await db.from('requirement_templates').update({label,category,updated_at:new Date().toISOString()}).eq('id',id);if(error)return msg('Unable to update',error.message);closeSheet();await load();render()}function notificationsScreen(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">'+S.notifications.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div><div class="muted">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join('')||'<div class="muted">No notifications yet.</div>'+'</div><button class="btn s" onclick="enableNotifications()">ENABLE DEVICE ALERTS</button>'}function notifications(){return notificationsScreen()}async function enableNotifications(){if(!('Notification'in window))return msg('Not supported');msg('Notification permission',await Notification.requestPermission())}function account(){return '<div class="eyebrow">Account</div><h1>'+esc(S.profile.full_name)+'</h1><div class="card"><h2>'+esc(role())+'</h2><div class="muted">'+(testing()?'Master session preserved · simulated authority':'Authorized AXIOM PULSE account')+'</div></div>'+(testing()?'<button class="btn s" onclick="exitTest()">RETURN TO MASTER</button>':'')+'<button class="btn d" onclick="logout()">SIGN OUT</button>'}function enterTest(r){if(!isMaster())return;S.mode=r;demo();S.screen='home';render()}async function exitTest(){S.mode='master';await load();S.screen='home';render()}function subscribe(){if(testing()||S.realtime)return;S.realtime=db.channel('axiom-'+S.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await load();render()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+S.profile.id},p=>{S.notifications.unshift(p.new);msg(p.new.title,p.new.body);if('Notification'in window&&Notification.permission==='granted')new Notification(p.new.title,{body:p.new.body})}).subscribe()}boot();async function boot(){const{data:{session}}=await db.auth.getSession();if(!session)return showLogin();const{data:p}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(!p||!p.active){await db.auth.signOut();return showLogin()}S.session=session;S.profile=p;await load();subscribe();render()}
</script></body></html>
