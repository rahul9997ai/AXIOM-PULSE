<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>AXIOM Pulse</title><style>html,body{margin:0;width:100%;height:100%;background:#06101b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./proof.html?v=rpcfix1" title="AXIOM Pulse"></iframe><script>
const frame=document.getElementById('app');
function patch(){try{const w=frame.contentWindow;if(!w||!w.raw)return false;const original=w.raw;w.raw=async function(path,opt={}){if(typeof path==='string'&&path.startsWith('/rpc/'))path='/rest/v1'+path;return original(path,opt)};return true}catch(e){return false}}
frame.addEventListener('load',()=>{if(!patch()){let n=0;const t=setInterval(()=>{if(patch()||++n>30)clearInterval(t)},100)} });
</script></body></html>
