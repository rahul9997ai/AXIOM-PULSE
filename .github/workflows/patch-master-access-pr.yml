name: Patch AXIOM PULSE Master Access
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[patched]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply Master access and role-test UX patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('pwa/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const state={profile:null,deliveries:[],templates:[],notifications:[],team:[],active:'home',channel:null,notificationChannel:null};","const state={profile:null,deliveries:[],templates:[],notifications:[],team:[],active:'home',channel:null,notificationChannel:null,testRole:null};")
          s=s.replace("const isMaster=()=>state.profile?.role==='master', isFSM=()=>state.profile?.role==='fsm', isSales=()=>state.profile?.role==='salesperson';","const effectiveRole=()=>state.testRole||state.profile?.role; const isMaster=()=>effectiveRole()==='master', isFSM=()=>effectiveRole()==='fsm', isSales=()=>effectiveRole()==='salesperson';")
          s=s.replace("if(profile.role==='master'){await sb.auth.signOut();document.getElementById('authMessage').textContent='Master administration is protected separately. Operational login is for FSM and Salesperson users.';return;}","")
          # Prevent the authenticated application shell/header from showing behind the login page.
          s=s.replace(".app{min-height:100dvh;", ".app{display:none;min-height:100dvh;", 1)
          s=s.replace(".content{padding:", ".app.ready{display:block}.content{padding:", 1)
          s=s.replace("function render(){if(!state.profile)return;root.innerHTML='<div class=\"app\">'+brand()", "function render(){if(!state.profile)return;root.innerHTML='<div class=\"app ready\">'+brand()")
          # Master can remain Master and choose a simulated role for UI/functionality testing without changing DB authority.
          if 'function enterMasterTestRole' not in s:
            s=s.replace("function homeScreen(){", "function enterMasterTestRole(r){if(state.profile?.role!=='master')return;state.testRole=r;loadDemoData();state.active='home';render();}\nfunction exitMasterTestRole(){state.testRole=null;state.active='home';loadData().then(render);}\nfunction masterRoleTester(){return state.profile?.role==='master'&&!state.testRole?'<div class=\"card\"><div class=\"eyebrow\">MASTER CONTROL CENTER</div><h2>Test operational access</h2><p class=\"muted\" style=\"margin:6px 0 12px\">Your Master account remains fully authorized. Enter either operational workspace for testing without changing the real account role.</p><div style=\"display:grid;gap:9px\"><button class=\"btn\" onclick=\"enterMasterTestRole(\\'fsm\\')\">TEST AS FSM</button><button class=\"btn secondary\" onclick=\"enterMasterTestRole(\\'salesperson\\')\">TEST AS SALESPERSON</button></div></div>':state.testRole?'<div class=\"card\"><div class=\"eyebrow\">TEST MODE</div><h2>'+state.testRole.toUpperCase()+' WORKSPACE</h2><p class=\"muted\">Master session preserved. Changes in test mode are simulated locally.</p><button class=\"btn secondary\" onclick=\"exitMasterTestRole()\">RETURN TO MASTER</button></div>':'';}\nfunction homeScreen(){")
          # Insert tester into Master home output at the end of the existing return string.
          marker="+(profile.role==='master'?'<div class=\"card\"><h2>Requirement Library</h2>"
          # Generic injection before function closes, safe with the known homeScreen single-return implementation.
          start=s.find("function homeScreen(){")
          end=s.find("}\nfunction deliveryList", start)
          if start!=-1 and end!=-1 and 'masterRoleTester()' not in s[start:end]:
            block=s[start:end]
            block=block.replace("+'}</div>';", "+masterRoleTester();}") if "+'}</div>';" in block else block
            if block==s[start:end]:
              # Append to the generated HTML by changing first terminal semicolon before the function's closing brace.
              idx=block.rfind(';')
              if idx!=-1:
                block=block[:idx]+"+masterRoleTester()"+block[idx:]
            s=s[:start]+block+s[end:]
          # Local test behavior for requirement completion/exception/delivery completion.
          s=s.replace("async function completeRequirement(id){const {error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:state.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',id);if(error)return toast('Unable to complete requirement',error.message);await refresh(true)}", "async function completeRequirement(id){if(state.testRole){for(const d of state.deliveries){const r=(d.delivery_requirements||[]).find(x=>x.id===id);if(r){r.completed=true;r.exception_reason=null;break}}toast('Requirement completed','TEST MODE — simulated FSM notification.');render();return;}const {error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:state.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',id);if(error)return toast('Unable to complete requirement',error.message);await refresh(true)}")
          s=s.replace("async function completeDelivery(id){const {error}=await sb.rpc('complete_delivery',{p_delivery_id:id});if(error)return toast('Delivery not completed',error.message);toast('Delivery completed','The delivery record has been finalized.');await refresh();openDelivery(id)}", "async function completeDelivery(id){if(state.testRole){const d=state.deliveries.find(x=>x.id===id);const bad=(d?.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);if(bad.length)return toast('Delivery not completed',bad.length+' requirement(s) remain unresolved.');d.status='delivered';render();return;}const {error}=await sb.rpc('complete_delivery',{p_delivery_id:id});if(error)return toast('Delivery not completed',error.message);toast('Delivery completed','The delivery record has been finalized.');await refresh();openDelivery(id)}")
          s=s.replace("function showException(id){sheet(", "function showException(id){sheet(")
          s=s.replace("async function saveException(id){const reason=document.getElementById('exceptionreason').value.trim();if(!reason)return toast('Reason required','Explain the exception.');const {error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:state.profile.id}).eq('id',id);if(error)return toast('Unable to record exception',error.message);closeSheet();await refresh(true)}", "async function saveException(id){const reason=document.getElementById('exceptionreason').value.trim();if(!reason)return toast('Reason required','Explain the exception.');if(state.testRole){for(const d of state.deliveries){const r=(d.delivery_requirements||[]).find(x=>x.id===id);if(r){r.completed=false;r.exception_reason=reason;break}}closeSheet();toast('Exception recorded','TEST MODE — simulated FSM notification.');render();return;}const {error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:state.profile.id}).eq('id',id);if(error)return toast('Unable to record exception',error.message);closeSheet();await refresh(true)}")
          s=s.replace("function signOut(){showScreen('signin');", "function signOut(){state.testRole=null;showScreen('signin');")
          p.write_text(s,encoding='utf-8')
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore master access and role testing [skip ci]'
          git push
