<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>AXIOM Pulse</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101b}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./proof.html?v=fsmfix1" title="AXIOM Pulse"></iframe><script>const frame=document.getElementById('app');function patch(){try{const w=frame.contentWindow;if(!w||!w.createDelivery||!w.S)return false;w.createDelivery=async function(){let people=[];if(w.master())people=(w.S.team||[]).filter(p=>p.role==='salesperson'&&p.active);else if(w.realRole&&w.realRole()==='fsm'){try{people=await w.rest('/profiles?dealership_id=eq.'+w.enc(w.S.profile.dealership_id)+'&role=eq.salesperson&active=eq.true&select=id,full_name&order=full_name.asc')}catch(e){return w.toast('Unable to load salespeople',e.message)}}if(w.testing&&w.testing())return w.sheet('<h2>Create Test Delivery</h2><label>Customer<input id="tc1" class="input"></label><label>Vehicle<input id="tc2" class="input"></label><label>Date<input id="tc3" class="input" type="date"></label><label>Time<input id="tc4" class="input" type="time"></label><button class="btn" onclick="saveTestDelivery()">CREATE TEST DELIVERY</button>');if(!people.length)return w.toast('No active salesperson','There are currently no active Salesperson accounts in your dealership.');w.sheet('<h2>Create Delivery</h2><p class="muted">FSM instructions begin here and follow the deal to delivery.</p><label>Customer name<input id="dc1" class="input"></label><label>Vehicle<input id="dc2" class="input"></label><label>Lender / Lessor<input id="dc3" class="input"></label><label>Approval<select id="dc4" class="input"><option value="approved">Approved</option><option value="pending">Pending</option><option value="conditional">Conditional</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="dc5" class="input" type="date"></label><label>Time<input id="dc6" class="input" type="time"></label></div><label>Salesperson<select id="dc7" class="input">'+people.map(p=>'<option value="'+p.id+'">'+w.esc(p.full_name)+'</option>').join('')+'</select></label><label>FSM notes<textarea id="dc8" class="input"></textarea></label><button class="btn" onclick="saveDelivery()">CREATE DELIVERY</button>')};return true}catch(e){return false}}frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(patch()||++n>50)clearInterval(t)},100)});</script></body></html>
