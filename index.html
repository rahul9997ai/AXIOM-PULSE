<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><meta http-equiv="Cache-Control" content="no-store"><title>AXIOM Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101b;--panel:#10243a;--panel2:#162e47;--line:#30506f;--text:#f6f8fb;--muted:#a1b4ca;--blue:#4b9af1;--green:#2fd18d;--red:#ef6676;--amber:#f2b650}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;background:radial-gradient(circle at 50% 25%,#143455 0,#081624 44%,#040b13 100%)}.wrap{width:min(980px,100%)}.identity{position:relative;min-height:325px;display:grid;place-items:center;text-align:center;overflow:hidden}.ecg{position:absolute;left:0;right:0;top:35%;height:120px;overflow:hidden}.ecg svg{width:100%;height:100%}.ecg path{fill:none;stroke:#3f98ea;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1250;stroke-dashoffset:1250;animation:draw 2.4s linear infinite,glow 1.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #4da8ff)}@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{50%{opacity:1;filter:drop-shadow(0 0 18px #5db1ff)}}.logo{display:flex;align-items:baseline;justify-content:center;gap:14px;position:relative;z-index:2}.axiom{font-size:71px;font-weight:950;letter-spacing:.105em}.pulse{font-size:62px;font-style:italic;font-weight:850;color:#58a5fb;text-shadow:0 0 20px #3184eeaa}.meaning{position:relative;z-index:2;margin-top:34px;color:#7db0dc;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive}.tag{position:relative;z-index:2;margin-top:9px;color:#cbd6e1;font-size:16px}.card{width:min(700px,100%);margin:0 auto;background:linear-gradient(145deg,#12283f,#0e1c2d);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 65px #0007}.card h1,.card h2,.card h3{margin:0}.card h2{font-size:28px}.muted{color:var(--muted)}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#a9bad0}.input,select,textarea{width:100%;margin-top:6px;padding:13px;background:#081624;color:#fff;border:1px solid #315473;border-radius:13px}.btn{width:100%;margin-top:11px;padding:14px 16px;border:0;border-radius:14px;background:var(--blue);color:#06111c;font-weight:900}.btn.secondary{background:var(--panel2);color:#eef5ff;border:1px solid #385b7c}.btn.danger{background:#55242e;color:#ffdce1;border:1px solid #7b3643}.btn.small{width:auto;margin-top:0;padding:9px 12px;font-size:12px}.msg{min-height:20px;margin-top:9px;color:var(--muted);font-size:13px}.app{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101b)}.head{position:sticky;top:0;z-index:30;padding:12px 17px;background:#102238f3;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:baseline;gap:9px}.headrow b{font-size:25px;letter-spacing:.18em}.headrow i{font-size:23px;color:#5fa9ff;font-style:italic}.hmeta{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#79aadb;margin-top:5px}.hby{font:italic 14px "Segoe Script","Brush Script MT",cursive}.htag{font-size:10px;color:#bdcad7}.main{max-width:1120px;margin:auto;padding:18px 15px 96px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:9px}.list{display:grid;gap:10px}.item{padding:13px 0;border-bottom:1px solid #21384f}.item:last-child{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#193e33;color:#93f2c0;font-size:11px}.out{background:#4a2229;color:#ffbec7}.warn{background:#4b3a1d;color:#ffdb90}.req{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #21384f}.req:last-child{border-bottom:0}.check{width:24px;height:24px;border-radius:8px;border:1px solid #416383;background:#091726;display:grid;place-items:center;flex:0 0 auto}.check.done{background:#1d7b58;border-color:#36d796}.check.exc{background:#7b303b;border-color:#ff7c8c}.reqbody{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.nav{position:fixed;left:0;right:0;bottom:0;height:74px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#92a8c0;font-size:10px;min-width:64px}.nav button.active{color:#fff}.nav b{display:block;font-size:20px;margin-bottom:3px}.notice{position:fixed;left:12px;right:12px;top:12px;z-index:80;background:#143852;border:1px solid #4e9fff;border-radius:16px;padding:13px;box-shadow:0 18px 50px #0009}.modal{position:fixed;inset:0;background:#000b;z-index:70;display:grid;place-items:end}.sheet{width:min(100%,760px);max-height:92dvh;overflow:auto;background:#10243a;border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}@media(max-width:560px){.page{padding:8px}.identity{min-height:290px}.axiom{font-size:43px}.pulse{font-size:38px}.meaning{font-size:8px;letter-spacing:.08em}.by{font-size:17px}.tag{font-size:13px}.ecg{top:34%;height:105px}.card{padding:18px}.grid{gap:7px}.stat{padding:10px}.headrow b{font-size:22px}.headrow i{font-size:20px}}</style></head><body><div id="root"></div><script>
const U='https://xjahoajimgdyuwxdjakw.supabase.co',K='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const root=document.getElementById('root');const S={profile:null,session:null,mode:'master',screen:'home',deliveries:[],templates:[],team:[],notifications:[],realtime:null};const realRole=()=>S.profile?.role;const role=()=>S.mode==='master'?realRole():S.mode;const testMode=()=>realRole()==='master'&&S.mode!=='master';const isMaster=()=>realRole()==='master'&&S.mode==='master';const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function toast(t,b=''){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted">'+esc(b)+'</div>';document.body.append(n);setTimeout(()=>n.remove(),4500)}function identity(){return '<div class="identity"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}function login(msg=''){root.innerHTML='<main class="page"><section class="wrap">'+identity()+'<section class="card"><h2>Secure Sign In</h2><p class="muted">Authorized AXIOM PULSE access.</p><div id="authmsg" class="msg">'+esc(msg)+'</div><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label><label>Password<input id="password" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label><button id="loginBtn" class="btn" onclick="signIn()">ENTER AXIOM PULSE</button><button class="btn secondary" onclick="joinPage()">JOIN WITH INVITATION</button></section></section></main>'}async function signIn(){const m=document.getElementById('authmsg'),b=document.getElementById('loginBtn'),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){m.textContent='Enter your email address and password.';return}b.disabled=true;b.textContent='SIGNING IN…';try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;const{data:prof,error:pe}=await db.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(pe||!prof)throw new Error('This account is not authorized for AXIOM PULSE.');if(!prof.active)throw new Error('This AXIOM PULSE account is inactive.');S.session=data.session;S.profile=prof;S.mode='master';localStorage.setItem('axiom_session','1');await load();subscribe();renderApp()}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='ENTER AXIOM PULSE'}}function joinPage(){root.innerHTML='<main class="page"><section class="wrap">'+identity()+'<section class="card"><h2>Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div id="joinmsg" class="msg"></div><label>Full name<input id="jn" class="input"></label><label>Invitation code<input id="jc" class="input"></label><label>Email<input id="je" class="input" type="email"></label><label>Create password<input id="jp" class="input" type="password"></label><button class="btn" onclick="join()">CREATE ACCOUNT</button><button class="btn secondary" onclick="login()">BACK TO SIGN IN</button></section></section></main>'}async function join(){const m=document.getElementById('joinmsg'),full_name=document.getElementById('jn').value.trim(),invite_code=document.getElementById('jc').value.trim().toUpperCase(),email=document.getElementById('je').value.trim(),password=document.getElementById('jp').value;if(!full_name||!invite_code||!email||password.length<6){m.textContent='Complete every field. Password must be at least 6 characters.';return}try{const r=await fetch(U+'/functions/v1/create-invited-user',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({full_name,email,password,invite_code})});const j=await r.json();if(!r.ok||j.error)throw new Error(j?.error||'Unable to create account.');const s=await db.auth.signInWithPassword({email,password});if(s.error)throw s.error;S.session=s.data.session;S.profile=(await db.from('profiles').select('*').eq('id',s.data.user.id).single()).data;S.mode='master';await load();subscribe();renderApp()}catch(e){m.textContent=e.message}}async function api(path){const r=await fetch(U+path,{headers:{apikey:K,Authorization:'Bearer '+S.session.access_token}});const d=await r.json();if(!r.ok)throw new Error(d?.message||'Request failed.');return d}async function load(){if(testMode()){demo();return}const q=realRole()==='salesperson'?'/rest/v1/deliveries?salesperson_id=eq.'+S.profile.id+'&select=*,delivery_requirements(*)&order=delivery_at.asc':'/rest/v1/deliveries?dealership_id=eq.'+S.profile.dealership_id+'&select=*,delivery_requirements(*)&order=delivery_at.asc';S.deliveries=await api(q);S.templates=await api('/rest/v1/requirement_templates?dealership_id=eq.'+S.profile.dealership_id+'&active=eq.true&order=sort_order.asc,label.asc');S.notifications=await api('/rest/v1/notification_history?user_id=eq.'+S.profile.id+'&order=sent_at.desc&limit=50')||[];if(isMaster())S.team=await api('/rest/v1/profiles?dealership_id=eq.'+S.profile.dealership_id+'&select=id,full_name,role,active&order=created_at.desc')}function demo(){S.deliveries=[{id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and manager-signed trade release form.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false},{id:'r4',label:'$500 due on delivery',kind:'money_collect',amount:500,completed:false}]}];S.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}]}
function appBrand(){return '<header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button onclick="go(\'home\')">Home</button><button onclick="go(\'deliveries\')">Deliveries</button><button onclick="go(\'notifications\')">Alerts</button>'+(isMaster()?'<button onclick="go(\'team\')">Team</button>':'')+'<button onclick="go(\'account\')">Account</button></nav>'}function renderApp(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main">'+screenHtml()+'</main>'+nav()+'</div>'}function screenHtml(){if(S.screen==='deliveries')return deliveriesScreen();if(S.screen==='notifications')return notificationsScreen();if(S.screen==='team')return teamScreen();if(S.screen==='library')return libraryScreen();if(S.screen.startsWith('delivery:'))return deliveryDetail(S.screen.slice(9));if(S.screen==='account')return accountScreen();return homeScreen()}function homeScreen(){const a=S.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled'),o=a.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="eyebrow">'+role().toUpperCase()+' ACCESS</div><h1>'+ (isMaster()?'Master Control Center':role()==='fsm'?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted">Welcome, '+esc(S.profile.full_name)+'.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>'+a.length+'</b>Active</div><div class="stat"><b>'+a.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b>Today</div><div class="stat"><b>'+o+'</b>Outstanding</div></div><div class="card"><h2>The delivery is the record</h2><p class="muted">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(isMaster()?'<div class="card"><h2>Master Control</h2><p class="muted">Your Master authority remains unrestricted. Test operational access without changing your real role.</p><div class="stack"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn secondary" onclick="go(\'team\')">MANAGE USERS</button><button class="btn secondary" onclick="go(\'library\')">REQUIREMENT LIBRARY</button></div></div>':'')+(testMode()?'<div class="card"><button class="btn secondary" onclick="exitTest()">RETURN TO MASTER</button></div>':'')}function deliveriesScreen(){return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div>'+(role()==='fsm'||isMaster()?'<button class="btn small" onclick="createDelivery()">＋ CREATE</button>':'')+'</div><div class="list" style="margin-top:12px">'+S.deliveries.map(d=>'<div class="card" onclick="go(\'delivery:'+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+'</div></div><span class="badge out">'+esc(d.status)+'</span></div><div class="row" style="margin-top:10px"><span class="muted">'+new Date(d.delivery_at).toLocaleString()+'</span><span class="muted">'+(d.delivery_requirements||[]).filter(r=>r.completed||r.exception_reason).length+'/'+(d.delivery_requirements||[]).length+' resolved</span></div></div>').join('')||'<div class="card muted">No deliveries yet.</div></div>'}function deliveryDetail(id){const d=S.deliveries.find(x=>x.id===id);if(!d)return '<div class="card">Delivery not found.</div>';const rs=d.delivery_requirements||[],out=rs.filter(r=>!r.completed&&!r.exception_reason);return '<button class="btn ghost small" onclick="go(\'deliveries\')">← BACK</button><div class="card"><div class="eyebrow">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><div class="muted">'+esc(d.vehicle)+'</div><div class="grid" style="margin-top:13px"><div class="stat"><span class="muted">DATE</span><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleDateString()+'</b></div><div class="stat"><span class="muted">TIME</span><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</b></div><div class="stat"><span class="muted">APPROVAL</span><b style="font-size:15px">'+esc(d.approval_status||'Approved')+'</b></div></div><div class="muted" style="margin-top:11px">Lender / Lessor: '+esc(d.lender_name||'—')+'</div>'+(d.fsm_notes?'<div class="panel"><div class="eyebrow">FSM INSTRUCTION</div>'+esc(d.fsm_notes)+'</div>':'')+'</div><div class="row"><h2>Delivery Requirements</h2>'+(role()==='fsm'||isMaster()?'<button class="btn secondary small" onclick="showAddRequirement(\''+d.id+'\')">＋ ADD</button>':'')+'</div><div class="card">'+rs.map(r=>'<div class="req"><span class="check '+(r.completed?'done':r.exception_reason?'exc':'')+'">'+(r.completed?'✓':r.exception_reason?'!':'')+'</span><div class="reqbody"><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.kind||'custom')+(r.amount?' · '+money(r.amount):'')+'</div>'+(r.completed?'<span class="badge">COMPLETED</span>':r.exception_reason?'<span class="badge out">EXCEPTION · '+esc(r.exception_reason)+'</span>':'<span class="badge warn">OUTSTANDING</span>')+(role()==='salesperson'&&!r.completed&&!r.exception_reason?'<div class="actions" style="margin-top:8px"><button class="btn secondary small" onclick="completeRequirement(\''+d.id+'\',\''+r.id+'\')">COMPLETE</button><button class="btn danger small" onclick="exceptionRequirement(\''+d.id+'\',\''+r.id+'\')">EXCEPTION</button></div>':'')+'</div></div>').join('')||'<div class="muted">No requirements yet.</div></div>'+(role()==='salesperson'?'<div class="card"><h2>Delivery Completion</h2><p class="muted">'+(out.length?'⚠️ '+out.length+' requirement(s) remain outstanding.':'All requirements are resolved.')+'</p><button class="btn" '+(out.length?'disabled':'')+' onclick="completeDelivery(\''+d.id+'\')">COMPLETE DELIVERY</button></div>':'')}function money(x){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(x||0))}function completeRequirement(did,rid){if(testMode()){const r=S.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.completed=true;r.exception_reason=null;toast('Requirement completed','TEST MODE — simulated live FSM notification.');return renderApp()}db.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:S.profile.id,exception_reason:null}).eq('id',rid).then(async({error})=>{if(error)return toast('Unable to complete',error.message);await loadLive();openDelivery(did)})}async function loadLive(){return load()}function exceptionRequirement(did,rid){sheet('<h2>Mark as exception</h2><p class="muted">The reason becomes part of the delivery history.</p><textarea id="ex" class="input" placeholder="Explain why this requirement could not be completed."></textarea><button class="btn danger" onclick="saveException(\''+did+'\',\''+rid+'\')">RECORD EXCEPTION</button>')}async function saveException(did,rid){const reason=document.getElementById('ex').value.trim();if(!reason)return toast('Reason required');if(testMode()){const r=S.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.exception_reason=reason;r.completed=false;closeSheet();toast('Exception recorded','TEST MODE — simulated FSM notification.');return openDelivery(did)}const{error}=await db.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.profile.id}).eq('id',rid);if(error)return toast('Unable to record',error.message);closeSheet();await loadLive();openDelivery(did)}async function completeDelivery(id){if(testMode()){const d=S.deliveries.find(x=>x.id===id);if((d.delivery_requirements||[]).some(r=>!r.completed&&!r.exception_reason))return toast('Delivery blocked','Outstanding requirements remain.');d.status='delivered';return openDelivery(id)}const{error}=await db.rpc('complete_delivery',{p_delivery_id:id});if(error)return toast('Delivery not completed',error.message);await loadLive();openDelivery(id)}function createDelivery(){if(testMode())return sheet('<h2>Create Test Delivery</h2><label>Customer<input id="tc1" class="input"></label><label>Vehicle<input id="tc2" class="input"></label><label>Date<input id="tc3" class="input" type="date"></label><label>Time<input id="tc4" class="input" type="time"></label><button class="btn" onclick="saveTestDelivery()">CREATE TEST DELIVERY</button>');const sales=S.team.filter(p=>p.role==='salesperson'&&p.active);sheet('<h2>Create Delivery</h2><label>Customer name<input id="dc1" class="input"></label><label>Vehicle<input id="dc2" class="input"></label><label>Lender / Lessor<input id="dc3" class="input"></label><label>Approval<select id="dc4" class="input"><option value="approved">Approved</option><option value="pending">Pending</option><option value="conditional">Conditional</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="dc5" class="input" type="date"></label><label>Time<input id="dc6" class="input" type="time"></label></div><label>Assign salesperson<select id="dc7" class="input">'+sales.map(p=>'<option value="'+p.id+'">'+esc(p.full_name)+'</option>').join('')+'</select></label><label>FSM notes<textarea id="dc8" class="input"></textarea></label><button class="btn" onclick="saveDelivery()">CREATE DELIVERY</button>')}async function saveTestDelivery(){S.deliveries.unshift({id:'d'+Date.now(),customer_name:document.getElementById('tc1').value||'Test Customer',vehicle:document.getElementById('tc2').value||'Test Vehicle',delivery_at:new Date((document.getElementById('tc3').value||new Date().toISOString().slice(0,10))+'T'+(document.getElementById('tc4').value||'15:00')).toISOString(),status:'scheduled',delivery_requirements:[]});closeSheet();go('deliveries')}async function saveDelivery(){const row={p_customer_name:document.getElementById('dc1').value.trim(),p_vehicle:document.getElementById('dc2').value.trim(),p_lender_name:document.getElementById('dc3').value.trim(),p_approval_status:document.getElementById('dc4').value,p_delivery_at:new Date(document.getElementById('dc5').value+'T'+document.getElementById('dc6').value).toISOString(),p_salesperson_id:document.getElementById('dc7').value,p_fsm_notes:document.getElementById('dc8').value.trim(),p_requirements:[]};const{error}=await db.rpc('create_delivery_with_requirements',row);if(error)return toast('Unable to create',error.message);closeSheet();await loadLive();go('deliveries')}function showAddRequirement(id){const opts=S.templates.map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join('');sheet('<h2>Add Delivery Requirement</h2><label>Requirement<select id="rq1" class="input"><option value="">Custom requirement</option>'+opts+'</select></label><label>Label<input id="rq2" class="input"></label><label>Amount<input id="rq3" class="input" type="number" step="0.01"></label><button class="btn" onclick="saveAddRequirement(\''+id+'\')">ADD REQUIREMENT</button>')}async function saveAddRequirement(id){const t=S.templates.find(x=>x.id===document.getElementById('rq1').value),label=(document.getElementById('rq2').value.trim()||t?.label||'').trim();if(!label)return toast('Requirement needed');const amount=document.getElementById('rq3').value||null;if(testMode()){S.deliveries.find(d=>d.id===id).delivery_requirements.push({id:'r'+Date.now(),label,kind:t?.kind||'custom',amount,completed:false});closeSheet();toast('New instruction added','TEST MODE — simulated salesperson notification.');return openDelivery(id)}const{error}=await db.from('delivery_requirements').insert({delivery_id:id,kind:t?.kind||'custom',label,amount});if(error)return toast('Unable to add',error.message);closeSheet();await loadLive();openDelivery(id)}function teamScreen(){return '<div class="row"><div><div class="eyebrow">Master Authority</div><h1>Manage Users</h1></div><button class="btn small" onclick="inviteUser()">＋ INVITE</button></div><div class="card">'+S.team.filter(p=>p.id!==S.profile.id).map(p=>'<div class="item"><div class="row"><div><b>'+esc(p.full_name||'Unnamed user')+'</b><div class="muted">'+esc(p.role)+' · '+(p.active?'Active':'Inactive')+'</div></div><div class="actions"><button class="btn secondary small" onclick="editUser(\''+p.id+'\')">EDIT</button><button class="btn danger small" onclick="removeUser(\''+p.id+'\',\''+esc(p.full_name||p.role)+'\')">REMOVE</button></div></div>'+(p.role==='fsm'?'<div class="row" style="margin-top:8px"><span class="muted">Requirement Library Authority</span><button class="btn ghost small" onclick="toggleFsm(\''+p.id+'\')">CHANGE</button></div>':'')+'</div>').join('')||'<div class="muted">No team members yet.</div>'+'</div>'}function inviteUser(){sheet('<h2>Create Team Invitation</h2><p class="muted">The Finance Manager assigns the role. Users cannot self-elevate.</p><label>Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="io" class="msg"></div>')}async function createInvite(){const{data,error}=await db.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return toast('Unable to create invite',error.message);document.getElementById('io').textContent='Invitation code: '+(typeof data==='string'?data:data?.code||JSON.stringify(data))}function editUser(id){const p=S.team.find(x=>x.id===id);sheet('<h2>Edit '+esc(p.full_name||'User')+'</h2><label>Full name<input id="en" class="input" value="'+esc(p.full_name||'')+'"></label><label>Email<input id="ee" class="input" type="email"></label><label>New password<input id="ep" class="input" type="password"></label><label>Role<select id="er" class="input"><option value="fsm" '+(p.role==='fsm'?'selected':'')+'>FSM</option><option value="salesperson" '+(p.role==='salesperson'?'selected':'')+'>Salesperson</option></select></label><label>Status<select id="ea" class="input"><option value="true" '+(p.active?'selected':'')+'>Active</option><option value="false" '+(!p.active?'selected':'')+'>Inactive</option></select></label><button class="btn" onclick="saveUser(\''+id+'\')">SAVE CHANGES</button>')}async function saveUser(id){const b={op:'update',user_id:id,full_name:document.getElementById('en').value.trim(),role:document.getElementById('er').value,active:document.getElementById('ea').value==='true'};const e=document.getElementById('ee').value.trim(),p=document.getElementById('ep').value;if(e)b.email=e;if(p)b.password=p;const r=await fetch(U+'/functions/v1/manage-team-user-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+S.session.access_token},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.error)return toast('Unable to update user',j?.error||'Request failed.');closeSheet();await loadLive();renderApp()}async function removeUser(id,name){if(!confirm('Remove '+name+' from AXIOM PULSE? Delivery history will be preserved.'))return;const r=await fetch(U+'/functions/v1/manage-team-user-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+S.session.access_token},body:JSON.stringify({op:'delete',user_id:id})}),j=await r.json();if(!r.ok||j.error)return toast('Unable to remove user',j?.error||'Request failed.');await loadLive();renderApp()}async function toggleFsm(id){const{data,error}=await db.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:true});if(error)return toast('Unable to update authority',error.message);toast('FSM authority updated','Requirement library edit access granted.');}function notificationsScreen(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">'+S.notifications.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div><div class="muted" style="font-size:11px">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join('')||'<div class="muted">No notifications yet.</div>'+'</div><button class="btn secondary" onclick="enableNotifications()">ENABLE DEVICE ALERTS</button>'}async function enableNotifications(){if(!('Notification'in window))return toast('Not supported','This browser does not support notifications.');toast('Notification permission',await Notification.requestPermission())}function accountScreen(){return '<div class="eyebrow">Account</div><h1>'+esc(S.profile.full_name)+'</h1><div class="card"><h2>'+esc(role())+'</h2><div class="muted">'+(testMode()?'Master session preserved · simulated authority':'Authorized AXIOM PULSE account')+'</div></div>'+(testMode()?'<button class="btn secondary" onclick="exitTest()">RETURN TO MASTER</button>':'')+'<button class="btn danger" onclick="logout()">SIGN OUT</button>'}function enterTest(r){if(!isMaster())return;S.mode=r;demo();S.screen='home';renderApp()}async function exitTest(){S.mode='master';await loadLive();S.screen='home';renderApp()}function go(s){S.screen=s;renderApp()}function sheet(h){document.getElementById('modal')?.remove();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button>'+h+'</section>';document.body.append(m)}function closeSheet(){document.getElementById('modal')?.remove()}function openDelivery(id){S.screen='delivery:'+id;renderApp()}async function loadLiveWrapper(){await loadLive();renderApp()}async function subscribe(){if(testMode()||S.realtime)return;S.realtime=db.channel('axiom-'+S.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await loadLive();renderApp()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await loadLive();renderApp()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+S.profile.id},p=>{S.notifications.unshift(p.new);toast(p.new.title,p.new.body);if('Notification'in window&&Notification.permission==='granted')new Notification(p.new.title,{body:p.new.body,icon:'/pwa/icon.svg'})}).subscribe()}async function logout(){if(S.realtime)db.removeChannel(S.realtime);localStorage.removeItem('axiom_session');await db.auth.signOut();S.profile=null;S.session=null;S.mode='master';login()}boot();
</script></body></html>
