<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>AXIOM Pulse</title>
<style>
:root{--bg:#06101c;--panel:#10263d;--line:#2e4d6d;--text:#f5f7fb;--muted:#a1b6cf;--blue:#4d9df7;--blue2:#6ab4ff;--green:#31d494;--red:#ef6675;--amber:#f2b64b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 24%,#143455 0,#081624 44%,#040b13 100%)}.wrap{width:min(980px,100%)}
.brand{position:relative;min-height:345px;display:grid;place-items:center;text-align:center;overflow:hidden}.ecg{position:absolute;left:0;right:0;top:37%;height:125px;overflow:hidden}.ecg svg{width:100%;height:100%;overflow:visible}.ecg path{fill:none;stroke:#3e97e9;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:ecgDraw 2.5s linear infinite,ecgGlow 1.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #4ca8ff)}@keyframes ecgDraw{0%{stroke-dashoffset:1200}100%{stroke-dashoffset:0}}@keyframes ecgGlow{0%,100%{opacity:.65}50%{opacity:1;filter:drop-shadow(0 0 16px #59acff)}}
.logo{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:center;gap:14px}.axiom{font-size:72px;font-weight:950;letter-spacing:.1em;color:#f5f7fb;text-shadow:0 2px 22px #0008}.pulse{font-size:62px;font-weight:850;font-style:italic;color:#59a6fb;text-shadow:0 0 20px #358af0aa}.meaning{position:relative;z-index:2;margin-top:36px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7db0dd}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive;color:#eef2f7}.tag{position:relative;z-index:2;margin-top:9px;font-size:16px;color:#cdd7e2}
.card{width:min(530px,100%);margin:-8px auto 0;background:linear-gradient(145deg,#12283f,#0e1c2d);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 70px #0008}.card h2{margin:0;font-size:28px}.muted{color:var(--muted)}.field{margin-top:13px}.field label{display:block;font-size:12px;color:#a7b9ce}.input{width:100%;margin-top:6px;background:#081624;color:#fff;border:1px solid #315472;border-radius:13px;padding:14px}.input:focus{outline:2px solid #4d9df744}.btn{width:100%;margin-top:11px;border:0;border-radius:14px;padding:14px 16px;background:var(--blue);color:#06101a;font-weight:900;font-size:15px}.btn.secondary{background:#172e47;color:#eef5ff;border:1px solid #395c7c}.btn.ghost{background:transparent;color:#dce8f5;border:1px solid #395c7c}.msg{min-height:20px;margin-top:9px;color:var(--muted);font-size:13px;line-height:1.4}
.app{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101c)}.head{position:sticky;top:0;z-index:10;padding:13px 17px;background:#102138ef;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:baseline;gap:8px}.headrow b{font-size:24px;letter-spacing:.18em}.headrow i{font-size:22px;font-style:italic;color:var(--blue2)}.hmeta{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#7caede;margin-top:5px}.hby{font:italic 14px "Segoe Script","Brush Script MT",cursive}.htag{font-size:10px;color:#c0ccda}.main{max-width:1120px;margin:auto;padding:18px 15px 92px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.panel{background:linear-gradient(145deg,#12263c,#0d1c2d);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:9px}.bar{padding:9px;border-radius:12px;border:1px solid #806b38;background:#3c301b;color:#ffe0a0;text-align:center;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20}.nav button{background:none;border:0;color:#92a8c0;font-size:10px}.nav b{display:block;font-size:20px;margin-bottom:3px}.hidden{display:none!important}.list{display:grid;gap:10px}.item{padding:13px;border-bottom:1px solid #22394f}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#193d33;color:#93f2bf;font-size:11px}.out{background:#4b232a;color:#ffbdc5}.warn{background:#4c3b1e;color:#ffda8c}.req{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #22394f}.req:last-child{border-bottom:0}.check{width:24px;height:24px;border-radius:8px;border:1px solid #416383;display:grid;place-items:center;flex:0 0 auto}.done{background:#1d7d58;border-color:#36d697}.reqbody{flex:1}.reqactions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:end}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#10243a;border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px}.small{font-size:12px;padding:9px 12px}
@media(max-width:560px){.page{padding:12px}.brand{min-height:292px}.axiom{font-size:43px}.pulse{font-size:39px}.ecg{top:36%;height:105px}.meaning{font-size:8px;letter-spacing:.08em;margin-top:29px}.by{font-size:17px}.tag{font-size:13px}.card{padding:18px}.grid{gap:7px}.stat{padding:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CFG={url:'https://xjahoajimgdyuwxdjakw.supabase.co',key:'sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD'};
const state={access:null,refresh:null,profile:null,mode:'master',screen:'home',deliveries:[],templates:[],team:[]};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const role=()=>state.mode==='master'?state.profile?.role:state.mode;
const isMaster=()=>state.profile?.role==='master'&&state.mode==='master';
const isTest=()=>state.mode!=='master';
function brand(){return '<div class="brand"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}
function login(msg=''){root.innerHTML='<main class="page"><section class="wrap">'+brand()+'<section class="card"><h2>Secure Sign In</h2><p class="muted" style="margin-top:5px">Authorized AXIOM PULSE access.</p><div id="msg" class="msg">'+esc(msg)+'</div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="password" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label></div><button class="btn" id="signinBtn" onclick="signIn()">ENTER AXIOM PULSE</button><button class="btn secondary" onclick="joinPage()">JOIN WITH INVITATION</button></section></section></main>'}
async function signIn(){const msg=document.getElementById('msg'),btn=document.getElementById('signinBtn');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg.textContent='Enter your email address and password.';return}btn.disabled=true;btn.textContent='SIGNING IN…';try{const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Unable to sign in.');state.access=j.access_token;state.refresh=j.refresh_token;localStorage.setItem('axiom_session',JSON.stringify({access:j.access_token,refresh:j.refresh_token}));const p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(j.user.id)+'&select=*');if(!p[0])throw new Error('This account is not authorized for AXIOM PULSE.');if(!p[0].active)throw new Error('This AXIOM PULSE account is inactive.');state.profile=p[0];state.mode='master';await loadData();app();}catch(e){btn.disabled=false;btn.textContent='ENTER AXIOM PULSE';msg.textContent=e.message}}
async function api(path,options={}){const r=await fetch(CFG.url+path,{...options,headers:{'apikey':CFG.key,'Authorization':'Bearer '+state.access,'Content-Type':'application/json',...(options.headers||{})}});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=null}if(!r.ok)throw new Error(data?.message||data?.msg||'Request failed.');return data}
function joinPage(){document.getElementById('root').innerHTML='<main class="page"><section class="wrap">'+brand()+'<section class="card"><h2>Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn" onclick="join()">CREATE ACCOUNT</button><button class="btn secondary" onclick="login()">BACK TO SIGN IN</button><div id="jm" class="msg"></div></section></section></main>'}
async function join(){const msg=document.getElementById('jm');const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6){msg.textContent='Complete every field. Password must be at least 6 characters.';return}try{const r=await fetch(CFG.url+'/functions/v1/create-invited-user',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key},body:JSON.stringify({full_name:n,email:e,password:p,invite_code:c})});const j=await r.json();if(!r.ok||j.error)throw new Error(j?.error||'Unable to create account.');const s=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key},body:JSON.stringify({email:e,password:p})});const sj=await s.json();if(!s.ok)throw new Error('Account created. Sign in with the new credentials.');state.access=sj.access_token;state.refresh=sj.refresh_token;localStorage.setItem('axiom_session',JSON.stringify({access:sj.access_token,refresh:sj.refresh_token}));await authenticate(sj.user.id)}catch(err){msg.textContent=err.message}}
async function authenticate(uid){const p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=*');if(!p[0])throw new Error('Account profile was not activated.');state.profile=p[0];state.mode='master';await loadData();app()}
async function loadData(){if(isTest()){demoData();return}const target=state.profile.role==='salesperson'?'/rest/v1/deliveries?salesperson_id=eq.'+state.profile.id+'&select=*,delivery_requirements(*)':'/rest/v1/deliveries?dealership_id=eq.'+state.profile.dealership_id+'&select=*,delivery_requirements(*)';const [d,t]=await Promise.all([api(target),isMaster()?api('/rest/v1/profiles?dealership_id=eq.'+state.profile.dealership_id+'&select=id,full_name,role,active&order=full_name'):Promise.resolve([])]);state.deliveries=d||[];state.team=t||[];}
function demoData(){state.deliveries=[{id:'demo',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',status:'scheduled',delivery_at:new Date(Date.now()+86400000).toISOString(),fsm_notes:'Collect trade ownership and signed trade release form.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false},{id:'r4',label:'$500 due on delivery',kind:'money_collect',amount:500,completed:false}]}];state.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}]}
function appBrand(){return '<header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header>'}
function nav(){return '<nav class="nav"><button onclick="go(\'home\')"><b>⌂</b>Home</button><button onclick="go(\'deliveries\')"><b>◫</b>Deliveries</button><button onclick="go(\'account\')"><b>◌</b>Account</button></nav>'}
function app(){const active=state.deliveries.filter(x=>x.status!=='delivered'),out=active.flatMap(x=>x.delivery_requirements||[]).filter(x=>!x.completed&&!x.exception_reason).length;let body='<div class="app">'+appBrand()+'<main class="main">'+(isTest()?'<div class="bar">TEST '+state.mode.toUpperCase()+' MODE · Master session preserved · changes are simulated</div>':'')+'<div class="row"><div><div class="muted" style="font-size:11px;letter-spacing:.13em;text-transform:uppercase">'+role().toUpperCase()+' ACCESS</div><h1>'+((isMaster())?'Master Control Center':role()==='fsm'?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted">Welcome, '+esc(state.profile.full_name)+'.</p></div></div><div class="grid"><div class="stat"><b>'+active.length+'</b>Active</div><div class="stat"><b>'+active.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b>Today</div><div class="stat"><b>'+out+'</b>Outstanding</div></div><div class="panel"><h2>The delivery is the record</h2><p class="muted">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(isMaster()?'<div class="panel"><h2>Master Control</h2><p class="muted">Your Master authority remains intact. Test operational access without changing the database role.</p><div class="stack"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button>'+(isTest()?'':'<button class="btn secondary" onclick="go(\'team\')">MANAGE USERS</button>')+'<button class="btn ghost" onclick="go(\'library\')">REQUIREMENT LIBRARY</button></div></div>':'')+(isTest()?'<div class="panel"><button class="btn secondary" onclick="exitTest()">RETURN TO MASTER</button></div>':'')+'</main>'+nav()+'</div>';root.innerHTML=body}
function go(v){state.screen=v;if(v==='deliveries')deliveriesScreen();else if(v==='account')accountScreen();else if(v==='team')teamScreen();else if(v==='library')libraryScreen();else app()}
function deliveriesScreen(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main"><button class="btn secondary small" onclick="go(\'home\')">← BACK</button><div style="margin-top:12px"><div class="muted" style="font-size:11px;letter-spacing:.13em;text-transform:uppercase">Delivery Workflow</div><h1>Deliveries</h1></div><div class="list">'+state.deliveries.map(d=>'<div class="panel" onclick="openDelivery(\''+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+'</div></div><span class="badge out">'+esc(d.status)+'</span></div><div class="muted" style="margin-top:8px">'+new Date(d.delivery_at).toLocaleString()+'</div></div>').join('')+'</div></main>'+nav()+'</div>'}
function openDelivery(id){const d=state.deliveries.find(x=>x.id===id);const rows=(d.delivery_requirements||[]).map(r=>'<div class="req"><span class="check '+(r.completed?'done':'')+'">'+(r.completed?'✓':'')+'</span><div class="reqbody"><b>'+esc(r.label)+'</b><div class="muted">'+(r.completed?'Completed':'Outstanding')+'</div>'+(isTest()&&role()==='salesperson'&&!r.completed?'<button class="btn secondary small" onclick="completeDemo(\''+d.id+'\',\''+r.id+'\')">COMPLETE</button>':'')+'</div></div>').join('');root.innerHTML='<div class="app">'+appBrand()+'<main class="main"><button class="btn secondary small" onclick="go(\'deliveries\')">← BACK</button><div class="panel"><div class="muted">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><div class="muted">'+esc(d.vehicle)+'</div><div class="grid" style="margin-top:12px"><div class="stat"><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleDateString()+'</b><span class="muted">Date</span></div><div class="stat"><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</b><span class="muted">Time</span></div><div class="stat"><b style="font-size:15px">'+esc(d.approval_status||'Approved')+'</b><span class="muted">Approval</span></div></div></div><div class="panel"><h2>Delivery Requirements</h2>'+rows+'</div></main>'+nav()+'</div>'}
function completeDemo(did,rid){const d=state.deliveries.find(x=>x.id===did),r=d.delivery_requirements.find(x=>x.id===rid);r.completed=true;toast('Requirement completed','TEST MODE — simulates the related FSM live notification.');openDelivery(did)}
function teamScreen(){if(!isMaster())return app();const rows=state.team.map(p=>'<div class="item"><div class="row"><div><b>'+esc(p.full_name||'Unnamed user')+'</b><div class="muted">'+esc(p.role)+' · '+(p.active?'Active':'Inactive')+'</div></div><span class="badge">AUTHORIZED</span></div></div>').join('');return '<div class="app">'+appBrand()+'<main class="main"><button class="btn secondary small" onclick="go(\'home\')">← BACK</button><div class="sectionhead"><div><div class="muted">Master Authority</div><h1>Manage Users</h1></div><button class="btn small" onclick="inviteUser()">＋ INVITE</button></div><div class="panel">'+rows+'</div></main>'+nav()+'</div>'}
function inviteUser(){sheet('<h2>Create Team Invitation</h2><p class="muted">The Finance Manager assigns the role. Users cannot self-elevate.</p><label>Role<select id="inviteRole" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="inviteOut" class="msg"></div>')}
async function createInvite(){const r=await api('/rest/v1/rpc/create_team_invite',{method:'POST',body:JSON.stringify({p_role:document.getElementById('inviteRole').value})});document.getElementById('inviteOut').textContent='Invitation code: '+(typeof r==='string'?r:JSON.stringify(r));}
function libraryScreen(){if(!isMaster())return app();return '<div class="app">'+appBrand()+'<main class="main"><button class="btn secondary small" onclick="go(\'home\')">← BACK</button><div class="sectionhead"><div><div class="muted">Reusable Requirements</div><h1>Requirement Library</h1></div><button class="btn small" onclick="addTemplate()">＋ ADD</button></div><div class="panel">'+state.templates.map(t=>'<div class="item row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category)+' · '+esc(t.kind)+'</div></div><span class="badge">ACTIVE</span></div>').join('')+'</div></main>'+nav()+'</div>'}
function addTemplate(){sheet('<h2>Add Requirement</h2><label>Requirement name<input id="tpl" class="input"></label><label>Category<select id="tplc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Other</option></select></label><button class="btn" onclick="saveTemplate()">SAVE REQUIREMENT</button>')}
function saveTemplate(){const n=document.getElementById('tpl').value.trim();if(!n)return toast('Requirement name required');state.templates.push({id:'t'+Date.now(),label:n,category:document.getElementById('tplc').value,kind:'custom',active:true});closeSheet();renderApp()}
function accountScreen(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main"><div class="muted">ACCOUNT</div><h1>'+esc(state.profile.full_name)+'</h1><div class="panel"><b>'+esc(role())+'</b><div class="muted">'+(isTest()?'Master session preserved · simulated authority':'Authorized AXIOM PULSE account')+'</div></div>'+(isTest()?'<button class="btn secondary" onclick="exitTest()">RETURN TO MASTER</button>':'')+'<button class="btn danger" onclick="logout()">SIGN OUT</button></main>'+nav()+'</div>'}
function enterTest(r){if(!state.profile||state.profile.role!=='master'||isTest())return;state.mode=r;demoData();state.screen='home';app()}
async function exitTest(){state.mode='master';await loadData();state.screen='home';app()}
function sheet(html){closeSheet();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button>'+html+'</section>';document.body.appendChild(m)}function closeSheet(){document.getElementById('modal')?.remove()}function toast(t,b=''){const n=document.createElement('div');n.className='bar';n.textContent=t+(b?' · '+b:'');root.prepend(n);setTimeout(()=>n.remove(),4500)}
async function logout(){localStorage.removeItem('axiom_session');state.profile=null;state.access=null;state.refresh=null;await fetch(CFG.url+'/auth/v1/logout',{method:'POST',headers:{'apikey':CFG.key,'Authorization':'Bearer '+(state.access||'')}}).catch(()=>{});login()}
async function boot(){const raw=localStorage.getItem('axiom_session');if(!raw)return login();try{const s=JSON.parse(raw);state.access=s.access;state.refresh=s.refresh;const u=await fetch(CFG.url+'/auth/v1/user',{headers:{'apikey':CFG.key,'Authorization':'Bearer '+state.access}});if(!u.ok)throw new Error('expired');const user=await u.json();const p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(user.id)+'&select=*');if(!p[0]||!p[0].active)throw new Error('invalid');state.profile=p[0];state.mode='master';await loadData();app()}catch{localStorage.removeItem('axiom_session');login()}}
boot();
</script>
</body></html>
