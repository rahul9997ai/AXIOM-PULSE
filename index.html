function saveSession(x){S.session={access_token:x.access_token,refresh_token:x.refresh_token,user_id:x.user?.id||S.session?.user_id,expires_in:x.expires_in,expires_at:Date.now()+(Number(x.expires_in||3600)*1000)};S.a=x.access_token;localStorage.setItem(SESSION_KEY,JSON.stringify(S.session));scheduleRefresh()}
function clearSession(){localStorage.removeItem(SESSION_KEY);S.session=null;S.a=null;if(S.refreshTimer)clearTimeout(S.refreshTimer)}
function scheduleRefresh(){if(S.refreshTimer)clearTimeout(S.refreshTimer);if(!S.session?.refresh_token)return;const ms=Math.max(30000,(S.session.expires_at||Date.now()+3600000)-Date.now()-120000);S.refreshTimer=setTimeout(refreshSession,ms)}
async function refreshSession(){try{if(!S.session?.refresh_token)return;const x=await auth("/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:S.session.refresh_token})});saveSession(x)}catch(e){logout(true)}}
async function q(path,o={}){let r=await fetch(C.url+path,{...o,headers:{apikey:C.key,"Content-Type":"application/json",...(S.a?{Authorization:"Bearer "+S.a}:{}),...(o.headers||{})}}),t=await r.text(),j;try{j=t?JSON.parse(t):null}catch{}if(!r.ok)throw Error(j?.error||j?.message||j?.error_description||"Request failed");return j}

function login(m=""){R.innerHTML='<main class="page">'+identity()+'<section class="card"><h2>Secure Sign In</h2><p class="muted">Authorized AXIOM PULSE access.</p><div id="msg" class="mini">'+esc(m)+'</div><div class="field"><label>Email<input id="em" class="input" type="email" autocomplete="email"></label></div><div class="field"><label>Password<input id="pw" class="input" type="password" autocomplete="current-password"></label></div><button class="btn" onclick="signin()">ENTER AXIOM PULSE</button><button class="btn secondary" onclick="joinUI()">JOIN WITH INVITATION</button></section></main>'}

async function load(uid){const p=await rest("/profiles?id=eq."+E(uid)+"&select=*");S.p=p[0];if(!S.p?.active||S.p?.is_deleted)throw Error("Account inactive");const did=E(S.p.dealership_id),dq=S.p.role==="salesperson"?"/deliveries?salesperson_id=eq."+E(S.p.id):"/deliveries?dealership_id=eq."+did;[S.d,S.team,S.lenders,S.n,S.templates]=await Promise.all([rest(dq+"&select=*,delivery_requirements(*)&order=delivery_at.asc"),rest("/profiles?dealership_id=eq."+did+"&is_deleted=eq.false&select=id,full_name,role,active,created_at,can_manage_requirement_library"),rest("/lenders_lessors?dealership_id=eq."+did+"&select=*&order=name.asc"),rest("/notification_history?user_id=eq."+E(S.p.id)+"&select=*&order=sent_at.desc"),rest("/requirement_templates?dealership_id=eq."+did+"&select=*&order=sort_order.asc,label.asc")])}

function go(x){S.screen=x;const m=document.getElementById("main");if(!m)return;if(x==="home"){if(S.p.role==="master")m.innerHTML='<h1>Master Control</h1><p class="muted">User administration only.</p><section class="card"><h2>Manage Users</h2><p class="muted">Create, edit, activate, deactivate and remove FSM and Salesperson accounts.</p><button class="btn" onclick="go(\'admin\')">MANAGE USERS</button></section><section class="card"><h2>Shared Master Lists</h2><p class="muted">Lender / Lessor Directory and Requirement Library are maintained separately by Master and designated FSM users.</p></section>';else if(S.p.role==="fsm")m.innerHTML='<h1>FSM Workspace</h1><p class="muted">Manage delivery workflow.</p><section class="card"><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></section>'+(canLists()?'<section class="card"><div class="grid"><button class="btn secondary" onclick="go(\'lenders\')">LENDER / LESSOR DIRECTORY</button><button class="btn secondary" onclick="go(\'requirements\')">REQUIREMENT LIBRARY</button></div></section>':'');else m.innerHTML='<h1>Salesperson Workspace</h1><p class="muted">Your assigned deliveries and requirements.</p>'+notificationCard()+'<section class="card">'+list(S.d.slice(0,6))+'</section>';return}if(x==="admin")return admin(m);if(x==="deliveries"){if(S.p.role==="master"){m.innerHTML='<h1>Deliveries</h1><section class="card muted">Master Control is reserved for user administration. Use an FSM account for delivery operations.</section>';return}m.innerHTML='<div class="row"><h1>Deliveries</h1>'+(S.p.role==="fsm"?'<button class="btn small" onclick="newDelivery()">+ CREATE</button>':'')+'</div><section class="card">'+list(S.d)+'</section>';return}if(x==="lenders"){if(!canLists())return restricted(m);return lenderScreen(m)}if(x==="requirements"){if(!canLists())return restricted(m);return requirementScreen(m)}if(x==="alerts"){m.innerHTML='<h1>Alerts</h1><section class="card">'+(S.n.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div><div class="mini">'+toronto(n.sent_at)+'</div></div>').join("")||'<div class="muted">No alerts.</div>')+'</section>';return}if(x==="account")m.innerHTML='<h1>Account</h1><section class="card"><h2>'+esc(S.p.full_name)+'</h2><p class="muted">'+esc(S.p.role.toUpperCase())+' access</p><button class="btn danger" onclick="logout()">SIGN OUT</button></section>'}

function notificationCard(){if(!("Notification" in window))return "";const ok=Notification.permission==="granted";return '<section class="card"><h3>Delivery Notifications</h3><p class="muted">'+(ok?'Browser notification permission is enabled. AXIOM PULSE also keeps a live in-app fallback while open.':'Enable browser notifications for live reminders while AXIOM PULSE is open.')+'</p>'+(ok?'<div class="status ok">Notifications enabled</div>':'<button class="btn" onclick="enableDeliveryNotifications()">ENABLE NOTIFICATIONS</button>')+'</section>'}
async function enableDeliveryNotifications(){try{const p=await Notification.requestPermission();if(p!=="granted")throw Error("Notification permission was not granted");scheduleReminderTimers();go(S.screen);note("Notifications enabled","Browser reminders are enabled while AXIOM PULSE is open.")}catch(e){note("Notifications unavailable",e.message)}}
function clearReminderTimers(){for(const t of S.reminderTimers)clearTimeout(t);S.reminderTimers=[];if(S.reminderPoll)clearInterval(S.reminderPoll);S.reminderPoll=null}
function torontoParts(date){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date),o={};for(const x of p)if(x.type!=="literal")o[x.type]=x.value;return {y:+o.year,m:+o.month,d:+o.day}}
function torontoDate(y,m,d,h,mi){const guess=Date.UTC(y,m-1,d,h,mi),fmt=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}),p=fmt.formatToParts(new Date(guess)),o={};for(const x of p)if(x.type!=="literal")o[x.type]=+x.value;const shown=Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute);return new Date(guess-(shown-guess))}
function reminderMoments(d){const at=new Date(d.delivery_at),p=torontoParts(at),day9=torontoDate(p.y,p.m,p.d,9,0);return [{type:"day_before",at:new Date(at.getTime()-86400000)},{type:"day_of",at:day9},{type:"two_hours_before",at:new Date(at.getTime()-7200000)},{type:"delivery_time",at}]}
function reminderCopy(d,type){const req=(d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).map(r=>r.amount!=null?r.label+" $"+Number(r.amount).toFixed(2):r.label);if(type==="day_before")return {title:"AXIOM PULSE • Delivery Tomorrow",body:d.customer_name+" • "+d.vehicle+"\nYour delivery is tomorrow."};if(type==="day_of")return {title:"AXIOM PULSE • Delivery Today",body:d.customer_name+" • "+d.vehicle+"\nReview your delivery for today."};if(type==="two_hours_before")return {title:"AXIOM PULSE • Delivery in 2 Hours",body:d.customer_name+" • "+d.vehicle+"\nPlease be ready for delivery."};return {title:"AXIOM PULSE • DELIVERY NOW",body:d.customer_name+" • "+d.vehicle+"\n"+(req.length?"Collect / confirm: "+req.join(" • "):"No outstanding requirements.")}}
function fireReminder(d,type){const key="axp_reminder_"+d.id+"_"+type;if(localStorage.getItem(key))return;localStorage.setItem(key,String(Date.now()));const c=reminderCopy(d,type);if("Notification" in window&&Notification.permission==="granted")try{new Notification(c.title,{body:c.body,icon:"/icons/axiom-pulse-icon.svg",tag:key,requireInteraction:type==="delivery_time"})}catch{}note(c.title,c.body)}
function scheduleReminderTimers(){clearReminderTimers();if(!S.p||S.p.role!=="salesperson"||!("Notification" in window)||Notification.permission!=="granted")return;const now=Date.now();for(const d of S.d){if(["cancelled","delivered"].includes(d.status))continue;for(const r of reminderMoments(d)){const delay=r.at-now;if(r.type==="day_of"&&r.at>=new Date(d.delivery_at))continue;if(delay>0&&delay<2147483647)S.reminderTimers.push(setTimeout(()=>fireReminder(d,r.type),delay));if(delay<=0&&delay>-120000)fireReminder(d,r.type)}}S.reminderPoll=setInterval(()=>{for(const d of S.d)for(const r of reminderMoments(d)){const delay=r.at-Date.now();if(r.type==="day_of"&&r.at>=new Date(d.delivery_at))continue;if(delay<=0&&delay>-120000)fireReminder(d,r.type)}},30000)}
function openD(id){const d=S.d.find(x=>x.id===id);if(!d)return;const req=d.delivery_requirements||[];const unresolved=req.filter(r=>!r.completed&&!r.exception_reason);const canComplete=S.p.role==="salesperson"&&d.status!=="delivered"&&unresolved.length===0;modal('<div class="row"><h2>'+esc(d.customer_name)+'</h2><button class="btn small secondary" onclick="close()">CLOSE</button></div><p class="muted">'+esc(d.vehicle)+' • '+esc(d.lender_name||"No lender selected")+'<br>'+toronto(d.delivery_at)+'</p><div class="status '+(d.status==="delivered"?"ok":"warn")+'">Status: '+esc(d.status)+'</div>'+req.map(r=>'<div class="req"><b>'+esc(r.label)+(r.amount!=null?' • $'+Number(r.amount).toFixed(2):'')+'</b>'+(r.completed?'<div class="status ok">Completed</div>':r.exception_reason?'<div class="err mini">Exception: '+esc(r.exception_reason)+'</div>':S.p.role==="salesperson"?'<div><button class="btn small" onclick="completeRequirement(\''+r.id+'\',\''+d.id+'\')">COMPLETE</button> <button class="btn small danger" onclick="exceptionUI(\''+r.id+'\',\''+d.id+'\')">EXCEPTION</button></div>':'<div class="warn mini">Outstanding</div>')+'</div>').join("")+(S.p.role==="salesperson"&&d.status!=="delivered"?'<div class="field">'+(canComplete?'<button class="btn" onclick="completeDelivery(\''+d.id+'\')">COMPLETE DELIVERY</button>':'<button class="btn secondary" disabled>COMPLETE ALL REQUIREMENTS FIRST</button><div class="mini">Requirements may be completed or formally marked as exceptions.</div>')+'</div>':'')}
async function completeRequirement(id,did){try{await rest("/delivery_requirements?id=eq."+E(id),{method:"PATCH",body:JSON.stringify({completed:true,completed_at:new Date().toISOString(),completed_by:S.p.id,exception_reason:null,exception_at:null,exception_by:null})});await load(S.p.id);close();openD(did)}catch(e){note("Unable to complete",e.message)}}

async function sendEx(id,did){const reason=er.value==="Other"?ed.value.trim():(ed.value.trim()?er.value+": "+ed.value.trim():er.value);if(!reason){msg.textContent="Enter a reason";return}try{await rest("/delivery_requirements?id=eq."+E(id),{method:"PATCH",body:JSON.stringify({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.p.id,completed:false})});await load(S.p.id);close();note("Exception sent","The responsible FSM has been notified.");openD(did)}catch(e){msg.textContent=e.message}}
async function completeDelivery(id){try{await rest("/rpc/complete_delivery",{method:"POST",body:JSON.stringify({p_delivery_id:id})});await load(S.p.id);close();note("Delivery completed","The delivery has been marked delivered and future reminders are stopped.")}catch(e){note("Unable to complete delivery",e.message)}}
function admin(m){m.innerHTML='<div class="row"><div><h1>Manage Users</h1><p class="muted">Master Control: FSM and Salesperson accounts only.</p></div><button class="btn small" onclick="invite()">+ INVITE</button></div><section class="card">'+S.team.filter(x=>x.id!==S.p.id).map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.full_name)+'</b><div class="mini">'+esc(x.role)+' • '+(x.active?"Active":"Inactive")+(x.role==="fsm"&&x.can_manage_requirement_library?" • List Manager":"")+'</div></div><button class="btn small secondary" onclick="editUser(\''+x.id+'\')">EDIT</button></div></div>').join("")+'</section>'}
function invite(){modal('<h2>Create Team Invitation</h2><label>Role<select id="ir"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><div id="msg"></div><button class="btn" onclick="makeInvite()">GENERATE SINGLE-USE CODE</button>')}
async function makeInvite(){try{const r=await rest("/dealership_invites?select=*",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({dealership_id:S.p.dealership_id,role:ir.value,created_by:S.p.id})}),x=r[0];msg.innerHTML="<b>CODE: "+esc(x.code)+"</b><br>No email verification required."}catch(e){msg.textContent=e.message}}
async function teamCall(b){const r=await fetch(C.url+"/functions/v1/manage-team-user-v2",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.key,Authorization:"Bearer "+S.a},body:JSON.stringify(b)}),x=await r.json();if(!r.ok||x.error)throw Error(x.error||"Request failed");return x}
function editUser(id){const u=S.team.find(x=>x.id===id);modal('<h2>Edit User</h2><label>Name<input id="un" class="input" value="'+esc(u.full_name||"")+'"></label><label>Role<select id="ur" onchange="toggleFSMAccess()"><option value="fsm" '+(u.role==="fsm"?"selected":"")+'>FSM</option><option value="salesperson" '+(u.role==="salesperson"?"selected":"")+'>Salesperson</option></select></label><label>Status<select id="ua"><option value="true" '+(u.active?"selected":"")+'>Active</option><option value="false" '+(!u.active?"selected":"")+'>Inactive</option></select></label><div id="fsmAccess" '+(u.role==="fsm"?"":"style=display:none")+'><label class="req" style="display:flex;align-items:center;gap:10px;margin-top:14px"><input id="ulp" type="checkbox" '+(u.can_manage_requirement_library?"checked":"")+'> Designated FSM: manage Lender / Lessor and Requirement Library</label></div><label>New password<input id="up" class="input" type="password"></label><div id="msg"></div><button class="btn" onclick="saveUser(\''+id+'\')">SAVE</button><button class="btn danger" onclick="removeUser(\''+id+'\')">REMOVE USER</button>')}
function toggleFSMAccess(){document.getElementById("fsmAccess").style.display=ur.value==="fsm"?"block":"none"}
async function saveUser(id){try{const role=ur.value,permission=role==="fsm"&&!!document.getElementById("ulp")?.checked;await teamCall({op:"update",user_id:id,full_name:un.value.trim(),role,active:ua.value==="true",password:up.value||undefined,can_manage_requirement_library:permission});await load(S.p.id);close();app();note("User updated",permission?"Designated FSM access is active.":"Role and permissions are active.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message;else note("Unable to save user",e.message)}}
async function removeUser(id){if(!confirm("Remove this user? This immediately revokes login access while preserving delivery and notification history."))return;try{await teamCall({op:"delete",user_id:id});await load(S.p.id);close();app();note("User removed","Login access has been revoked. Historical delivery data is preserved.")}catch(e){note("Unable to remove",e.message)}}
function newDelivery(){const sales=S.team.filter(x=>x.role==="salesperson"&&x.active),ls=S.lenders.filter(x=>x.active),ts=S.templates.filter(x=>x.active);window.DR=[];modal('<div class="row"><h2>Create Delivery</h2><button class="btn small secondary" onclick="close()">CLOSE</button></div><div id="msg"></div><div class="field"><label>Customer<input id="dc" class="input"></label></div><div class="field"><label>Vehicle<input id="dv" class="input"></label></div><div class="field"><label>Lender / Lessor<select id="dl"><option value="">Select saved lender / lessor</option>'+ls.map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.city?" • "+esc(x.city):"")+'</option>').join("")+'</select></label></div><div class="grid"><div class="field"><label>Date<input id="dd" class="input" type="date"></label></div><div class="field"><label>Time<input id="dt" class="input" type="time"></label></div></div><div class="field"><label>Salesperson<select id="ds"><option value="">Select active salesperson</option>'+sales.map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+'</option>').join("")+'</select></label></div><div class="field"><label>FSM Notes<textarea id="dn" class="input"></textarea></label></div><div class="field"><label>Requirements</label><div id="reqpick">'+ts.map(x=>'<label class="req" style="display:flex;align-items:center;gap:10px"><input type="checkbox" value="'+x.id+'" onchange="toggleReq(this)"> <span>'+esc(x.label)+(x.kind==="money_collect"?" • amount required at delivery":"")+'</span></label>').join("")+'</div></div><div class="field"><label>Add requirement on the fly<input id="rqcustom" class="input" placeholder="Type a custom requirement"></label><label>Amount (optional)<input id="rqamount" class="input" type="number" min="0" step="0.01"></label><button class="btn small secondary" onclick="addReq()">+ ADD REQUIREMENT</button></div><div id="reqs"></div><button class="btn" onclick="createD()">CREATE DELIVERY</button>')}
function renderReqs(){const el=document.getElementById("reqs");el.innerHTML=window.DR.length?window.DR.map((x,i)=>'<div class="req row"><span>'+esc(x.label)+(x.amount!=null?' • $'+Number(x.amount).toFixed(2):'')+'</span><button class="btn small danger" onclick="removeReq('+i+')">REMOVE</button></div>').join(""):'<div class="mini">No requirements selected yet.</div>'}
function toggleReq(el){const t=S.templates.find(x=>x.id===el.value);if(!t)return;const i=window.DR.findIndex(x=>x.template_id===t.id);if(el.checked&&i<0)window.DR.push({template_id:t.id,kind:t.kind,label:t.label,amount:null});if(!el.checked&&i>=0)window.DR.splice(i,1);renderReqs()}
function addReq(){const label=rqcustom.value.trim(),raw=rqamount.value.trim();if(!label)return;const amount=raw===""?null:Number(raw);if(amount!=null&&(!Number.isFinite(amount)||amount<0))return note("Invalid amount","Enter a valid non-negative amount.");window.DR.push({kind:"custom",label,amount});rqcustom.value="";rqamount.value="";renderReqs()}
function removeReq(i){const removed=window.DR.splice(i,1)[0];if(removed?.template_id){const cb=[...document.querySelectorAll("#reqpick input")].find(x=>x.value===removed.template_id);if(cb)cb.checked=false}renderReqs()}
async function createD(){try{if(!dc.value.trim()||!dv.value.trim()||!ds.value||!dd.value||!dt.value)throw Error("Complete all required delivery fields");const r=await fetch(C.url+"/functions/v1/create-delivery",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.key,Authorization:"Bearer "+S.a},body:JSON.stringify({customer_name:dc.value.trim(),vehicle:dv.value.trim(),salesperson_id:ds.value,lender_id:dl.value||null,delivery_at:new Date(dd.value+"T"+dt.value).toISOString(),fsm_notes:dn.value.trim(),requirements:window.DR})}),x=await r.json();if(!r.ok||x.error)throw Error(x.error||"Unable to create delivery");await load(S.p.id);close();go("deliveries");note("Delivery created","Assigned salesperson has access immediately.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message;else note("Unable to create delivery",e.message)}}
function lenderScreen(m){m.innerHTML='<div class="row"><div><h1>Lender / Lessor Directory</h1><p class="muted">Shared master list maintained by Master and designated FSM users.</p></div><button class="btn small" onclick="editL()">+ ADD</button></div><section class="card">'+(S.lenders.length?S.lenders.map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.name)+'</b><div class="mini">'+esc([x.address_line1,x.city,x.province,x.postal_code].filter(Boolean).join(", "))+' • '+(x.active?"Active":"Inactive")+'</div></div><button class="btn small secondary" onclick="editL(\''+x.id+'\')">EDIT</button></div></div>').join(""):'<div class="muted">No lenders saved.</div>')+'</section>'}
function editL(id){const x=id?S.lenders.find(z=>z.id===id):{},lid=id||"";modal('<h2>'+(lid?"Edit":"Add")+' Lender / Lessor</h2><label>Name<input id="ln" class="input" value="'+esc(x?.name||"")+'"></label><label>Address<input id="la" class="input" value="'+esc(x?.address_line1||"")+'"></label><label>Address line 2<input id="la2" class="input" value="'+esc(x?.address_line2||"")+'"></label><div class="grid"><label>City<input id="lc" class="input" value="'+esc(x?.city||"")+'"></label><label>Province<input id="lp" class="input" value="'+esc(x?.province||"")+'"></label></div><div class="grid"><label>Postal Code<input id="lz" class="input" value="'+esc(x?.postal_code||"")+'"></label><label>Country<input id="lco" class="input" value="'+esc(x?.country||"Canada")+'"></label></div><label>Status<select id="lx"><option value="true" '+(x?.active!==false?"selected":"")+'>Active</option><option value="false" '+(x?.active===false?"selected":"")+'>Inactive</option></select></label><div id="msg"></div><button id="saveLBtn" class="btn" onclick="saveL(\''+lid+'\')">SAVE LENDER / LESSOR</button>'+(lid?'<button class="btn danger" onclick="deleteL(\''+lid+'\')">DELETE LENDER / LESSOR</button>':'') )}
async function saveL(id){const btn=document.getElementById("saveLBtn");try{const name=ln.value.trim();if(!name)throw Error("Name is required");const body={dealership_id:S.p.dealership_id,name,address_line1:la.value.trim()||null,address_line2:la2.value.trim()||null,city:lc.value.trim()||null,province:lp.value.trim()||null,postal_code:lz.value.trim()||null,country:lco.value.trim()||"Canada",active:lx.value==="true",updated_at:new Date().toISOString()};if(!id)body.created_by=S.p.id;if(btn){btn.disabled=true;btn.textContent="SAVING..."}const ep=id?"/lenders_lessors?id=eq."+E(id)+"&dealership_id=eq."+E(S.p.dealership_id)+"&select=*":"/lenders_lessors?select=*";const result=await rest(ep,{method:id?"PATCH":"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});if(!Array.isArray(result)||result.length!==1)throw Error(id?"Lender update was not confirmed.":"Lender creation was not confirmed.");await load(S.p.id);close();go("lenders");note("Directory updated","Lender / Lessor saved successfully.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message;if(btn){btn.disabled=false;btn.textContent="SAVE LENDER / LESSOR"}}}
async function deleteL(id){if(!confirm("Delete this lender / lessor? This cannot be undone."))return;try{const refs=await rest("/deliveries?lender_id=eq."+E(id)+"&select=id&limit=1");if(refs.length)throw Error("This lender is used by historical deliveries. Set it to Inactive instead so delivery history is preserved.");const result=await rest("/lenders_lessors?id=eq."+E(id)+"&dealership_id=eq."+E(S.p.dealership_id)+"&select=id",{method:"DELETE",headers:{Prefer:"return=representation"}});if(!Array.isArray(result)||result.length!==1)throw Error("Lender deletion was not confirmed.");await load(S.p.id);close();go("lenders");note("Lender deleted","The lender / lessor has been removed.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message;else note("Unable to delete lender",e.message)}}
function requirementScreen(m){m.innerHTML='<div class="row"><div><h1>Requirement Library</h1><p class="muted">Shared master list maintained by Master and designated FSM users.</p></div><button class="btn small" onclick="newReq()">+ ADD</button></div><section class="card">'+(S.templates.length?S.templates.map(t=>'<div class="item"><div class="row"><div><b>'+esc(t.label)+'</b><div class="mini">'+esc(t.category||"Other")+' • '+esc(t.kind||"custom")+' • '+(t.active?"Active":"Inactive")+'</div></div><button class="btn small secondary" onclick="editReq(\''+t.id+'\')">EDIT</button></div></div>').join(""):'<div class="muted">No requirements saved.</div>')+'</section>'}
function newReq(){modal('<h2>Add Requirement</h2><label>Name<input id="rn" class="input"></label><label>Category<input id="rc" class="input" value="Other"></label><label>Type<select id="rk"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund</option></select></label><div id="msg"></div><button class="btn" onclick="saveReq()">SAVE REQUIREMENT</button>')}
function editReq(id){const t=S.templates.find(x=>x.id===id);modal('<h2>Edit Requirement</h2><label>Name<input id="rn" class="input" value="'+esc(t.label)+'"></label><label>Category<input id="rc" class="input" value="'+esc(t.category||"Other")+'"></label><label>Status<select id="ra"><option value="true" '+(t.active?"selected":"")+'>Active</option><option value="false" '+(!t.active?"selected":"")+'>Inactive</option></select></label><div id="msg"></div><button class="btn" onclick="saveReq(\''+id+'\')">SAVE CHANGES</button><button class="btn danger" onclick="deleteReq(\''+id+'\')">DELETE REQUIREMENT</button>')}
async function saveReq(id){try{const label=rn.value.trim(),category=rc.value.trim()||"Other";if(!label)throw Error("Requirement name is required");const body=id?{label,category,active:ra.value==="true",updated_at:new Date().toISOString()}:{dealership_id:S.p.dealership_id,label,category,kind:rk.value,active:true,created_by:S.p.id};await rest(id?"/requirement_templates?id=eq."+E(id):"/requirement_templates",{method:id?"PATCH":"POST",body:JSON.stringify(body)});await load(S.p.id);close();go("requirements");note("Requirement saved","The library is updated.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message}}
async function deleteReq(id){if(!confirm("Delete this requirement from the master list?"))return;try{await rest("/requirement_templates?id=eq."+E(id),{method:"DELETE"});await load(S.p.id);close();go("requirements");note("Requirement deleted","Removed from the master list.")}catch(e){const box=document.getElementById("msg");if(box)box.textContent=e.message}}
function startAlertPoll(){if(S.alertPoll)clearInterval(S.alertPoll);S.alertPoll=setInterval(async()=>{if(!S.p)return;const old=S.n[0]?.id;try{const n=await rest("/notification_history?user_id=eq."+E(S.p.id)+"&select=*&order=sent_at.desc");S.n=n||[];if(S.n[0]?.id&&S.n[0].id!==old)note(S.n[0].title,S.n[0].body)}catch{}},8000)}
function logout(silent=false){close();clearReminderTimers();if(S.alertPoll)clearInterval(S.alertPoll);clearSession();S.p=null;S.d=[];S.team=[];S.lenders=[];S.n=[];S.templates=[];S.screen="home";if(!silent)login();else login("Your session expired. Please sign in again.")}
async function boot(){const raw=localStorage.getItem(SESSION_KEY);if(!raw)return login();try{S.session=JSON.parse(raw);S.a=S.session.access_token;if(!S.session?.user_id)throw Error("No session");if(Date.now()>=(S.session.expires_at||0)-60000)await refreshSession();else scheduleRefresh();const u=await auth("/user");await load(u.id);app()}catch{clearSession();login("Please sign in to continue.")}}
boot();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("AXIOM PULSE offline support unavailable",e)))}</script></body></html>
