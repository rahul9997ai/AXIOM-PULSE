;margin-top:9px" onclick="join()">JOIN WITH INVITATION</button></div></section></main>'}async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return document.getElementById('msg').textContent='Enter your email and password.';const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return document.getElementById('msg').textContent=r.error.message;await start(r.data.session)}async function start(session){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(r.error||!r.data)return login(r.error?.message||'This account is not authorized for AXIOM PULSE.');if(!r.data.active)return login('This AXIOM PULSE account is inactive.');S.session=session;S.profile=r.data;S.mode='master';await load();subscribe();render()}function join(){root.innerHTML='<main class="center"><section class="authbox">'+brand()+'<div class="card"><button class="btn ghost small" onclick="login()">← BACK</button><h2 style="margin-top:14px">Join AXIOM PULSE</h2><p class="muted" style="margin-top:5px">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn" style="width:100%;margin-top:14px" onclick="createJoin()">CREATE ACCOUNT</button><div id="jm" class="muted" style="font-size:12px;text-align:center;margin-top:9px"></div></div></section></main>'}async function createJoin(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6)return document.getElementById('jm').textContent='Complete all fields. Password must be at least 6 characters.';localStorage.setItem('axiom_invite',JSON.stringify({n,c}));const r=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(r.error)return document.getElementById('jm').textContent=r.error.message;if(r.data.session){const a=await sb.rpc('accept_team_invite',{p_code:c,p_full_name:n});if(a.error)return document.getElementById('jm').textContent=a.error.message;localStorage.removeItem('axiom_invite');await start(r.data.session)}else login('Check your email, then sign in to finish your authorized onboarding.')}async function load(){if(test()){demo();return}const q=role()==='salesperson'?sb.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',S.profile.id).order('delivery_at'):sb.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',S.profile.dealership_id).order('delivery_at');const [d,t,n,tm]=await Promise.all([q,sb.from('requirement_templates').select('*').eq('dealership_id',S.profile.dealership_id).order('sort_order').order('label'),sb.from('notification_history').select('*').eq('user_id',S.profile.id).order('sent_at',{ascending:false}).limit(50),master()?sb.rpc('get_team_members'):Promise.resolve({data:[]})]);S.deliveries=d.data||[];S.templates=t.data||[];S.notes=n.data||[];S.team=tm.data||[]}function demo(){S.deliveries=[{id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and manager-signed trade release.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false},{id:'r4',label:'$500 due o team')return teamScreen();if(S.screen==='library')return libraryScreen();if(S.screen.startsWith('delivery:'))return detail(S.screen.slice(9));if(S.screen==='account')return account();return home()}function home(){const active=S.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled'),out=active.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="row"><div><div class="eyebrow">'+esc(role().toUpperCase())+' ACCESS</div><h1>Dealership Pulse</h1><p class="muted" style="margin-top:4px">Welcome, '+esc(S.profile?.full_name||'Demo')+'</p></div></div><div class="grid" style="margin-top:16px"><div class="stat"><b>'+active.length+'</b><span class="muted">Active</span></div><div class="stat"><b>'+active.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b><span class="muted">Today</span></div><div class="stat"><b>'+out+'</b><span class="muted">Outstanding</span></div></div><div class="card"><h2>The delivery is the record</h2><p class="muted" style="margin-top:6px">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" style="margin-top:12px" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(master()&&!test()?'<div class="card"><h2>Master Control Center</h2><p class="muted" style="margin:6px 0 12px">Your Master authority remains active. Use these modes to test the other user experiences safely.</p><div class="stack"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn ghost" onclick="go(\'library\')">REQUIREMENT LIBRARY</button></div></div>':'')+(test()?'<div class="card"><button class="btn ghost full" onclick="exitTest()">RETURN TO MASTER</button></div>':'')};function list(){return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div>'+(fsm()||master()?'<button d receive the live update.');return render()}const{error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:S.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',rid);if(error)return toast('Unable to complete',error.message);await load();render()}function exceptionReq(did,rid){sheet('<h2>Mark as exception</h2><p class="muted">Enter the reason. This becomes part of the delivery record.</p><textarea id="ex"></textarea><button class="btn danger full" style="margin-top:12px" onclick="saveException(\''+did+'\',\''+rid+'\')">RECORD EXCEPTION</button>')}async function saveException(did,rid){const reason=document.getElementById('ex').value.trim();if(!reason)return toast('Reason required','Enter the exception reason.');if(test()){const r=S.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.exception_reason=reason;r.completed=false;closeSheet();toast('Exception recorded','TEST MODE — the related FSM would receive the update.');return render()}const{error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.profile.id}).eq('id',rid);if(error)return toast('Unable to record exception',error.message);closeSheet();await load();render()}async function finishDelivery(id){if(test()){const d=S.deliveries.find(x=>x.id===id),bad=(d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);if(bad.length)return toast('Delivery blocked',bad.length+' requirement(s) remain unresolved.');d.status='delivered';return render()}const{error}=await sb.rpc('complete_delivery',{p_delivery_id:id});if(error)return toast('Delivery blocked',error.message);await load();openDelivery(id)}function showCreate(){if(test()){sheet('<h2>Create test delivery</h2><label>Customer<input id="cc" class="input"></label><label>Vehicle<input id="cv" class="input"></label><label>Date<input id="cd" class="input" type="date"></label><label>Time<input id="ct" class="input" type="time"></label><button class="btn full" style="margin-top:14px" onclick="saveDemo()">CREATE TEST DELIVERY</button>');return}sb.from('profiles').select('id,full_name').eq('dealership_id',S.profile.dealership_id).eq('role','salesperson').eq('active',true).order('full_name').then(({data,error})=>{if(error||!data?.length)return toast('No active salesperson','Invite or activate a Salesperson first.');sheet('<h2>Create Delivery</h2><label>Customer<input id="cc" class="input"></label><label>Vehicle<input id="cv" class="input"></label><label>Lender / Lessor<input id="cl" class="input"></label><label>Approval<select id="ca" class="input"><option>Approved</option><option>Pending</option><option>Conditional</option></select></label><div class="fieldrow"><label>Date<input id="cd" class="input" type="date"></label><label>Time<input id="ct" class="input" type="time"></label></div><label>Salesperson<select id="cs" class="input">'+data.map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+'</option>').join('')+'</select></label><label>FSM notes<textarea id="cn"></textarea></label><button class="btn full" style="margin-top:14px" onclick="saveLiveDelivery()">CREATE DELIVERY</button>')})}async function saveLiveDelivery(){const row={p_customer_name:document.getElementById('cc').value.trim(),p_vehicle:document.getElementById('cv').value.trim(),p_lender_name:document.getElementById('cl').value.trim(),p_approval_status:document.getElementById('ca').value,p_delivery_at:new Date(document.getElementById('cd').value+'T'+document.getElementById('ct').value).toISOString(),p_salesperson_id:document.getElementById('cs').value,p_fsm_notes:document.getElementById('cn').value.trim(),p_requirements:[]};if(!row.p_customer_name||!row.p_vehicle||!document.getElementById('cd').value||!document.getElementById('ct').value)return toast('Missing information','Customer, vehicle, date and time are required.');const{error}=await sb.rpc('create_delivery_with_requirements',row);if(error)return toast('Unable to create delivery',error.message);closeSheet();await load();go('deliveries')}function saveDemo(){const d={id:'demo'+Date.now(),customer_name:document.getElementById('cc').value||'Demo Customer',vehicle:document.getElementById('cv').value||'Demo Vehicle',delivery_at:new Date((document.getElementById('cd').value||new Date().toISOString().slice(0,10))+'T'+(document.getElementById('ct').value||'15:00')).toISOString(),status:'scheduled',delivery_requirements:[]};S.deliveries.unshift(d);closeSheet();go('deliveries')}function addReq(id){const opts=S.templates.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.label)+'</option>').join('');sheet('<h2>Add Delivery Requirement</h2><label>Requirement<select id="rt" class="input"><option value="">Custom</option>'+opts+'</select></label><label>Label<input id="rl" class="input"></label><label>Amount<input id="ra" class="input" type="number" step="0.01"></label><button class="btn full" style="margin-top:14px" onclick="saveReq(\''+id+'\')">ADD REQUIREMENT</button>')}async function saveReq(id){const t=S.templates.find(x=>x.id===document.getElementById('rt').value),label=(document.getElementById('rl').value.trim()||t?.label||'').trim();if(!label)return toast('Requirement needed','Choose or enter a requirement.');const amount=document.getElementById('ra').value||null;if(test()){S.deliveries.find(x=>x.id===id).delivery_requirements.push({id:'r'+Date.now(),label,kind:t?.kind||'custom',amount,completed:false});closeSheet();toast('New instruction added','TEST MODE — the assigned Salesperson would be notified.');return render()}const{error}=await sb.from('delivery_requirements').insert({delivery_id:id,kind:t?.kind||'custom',label,amount});if(error)return toast('Unable to add requirement',error.message);closeSheet();await load();openDelivery(id)}function libraryScreen(){const can=master()||state.profile?.can_manage_requirement_library||test();const rows=S.templates.map(t=>'<div class="listitem row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category||'Custom')+' · '+esc(t.kind)+'</div></div>'+(can?'<button class="btn secondary small" onclick="editTemplate(\''+t.id+'\')">EDIT</button>':'')+'</div>').join('');return '<button class="btn ghost small" onclick="go(\'home\')">← BACK</button><div class="sectionhead"><div><div class="eyebrow">Reusable Requirements</div><h1>Requirement Library</h1></div>'+(can?'<button class="btn" onclick="newTemplate()">＋ ADD</button>':'')+'</div><div class="card">'+rows+'</div>'}function newTemplate(){sheet('<h2>Add Requirement</h2><label>Name<input id="tn" class="input"></label><label>Category<select id="tc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Insurance</option><option>Other</option></select></label><label>Type<select id="tk" class="input"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select></label><button class="btn full" style="margin-top:14px" onclick="saveTemplate()">SAVE</button>')}async function saveTemplate(){const label=document.getElementById('tn').value.trim();if(!label)return toast('Name required','Enter a requirement name.');const row={dealership_id:S.profile.dealership_id,label,category:document.getElementById('tc').value,kind:document.getElementById('tk').value,active:true,created_by:S.profile.id};if(test()){S.templates.push({...row,id:'t'+Date.now()});closeSheet();return render()}const{error}=await sb.from('requirement_templates').insert(row);if(error)return toast('Unable to save',error.message);closeSheet();await load();render()}function editTemplate(id){const t=S.templates.find(x=>x.id===id);sheet('<h2>Edit Requirement</h2><label>Name<input id="tn" class="input" value="'+esc(t.label)+'"></label><label>Category<select id="tc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Insurance</option><option>Other</option></select></label><button class="btn full" style="margin-top:14px" onclick="updateTemplate(\''+id+'\')">SAVE CHANGES</button>')}async function updateTemplate(id){const label=document.getElementById('tn').value.trim(),category=document.getElementById('tc').value;if(!label)return toast('Name required','Enter a requirement name.');if(test()){const t=S.templates.find(x=>x.id===id);Object.assign(t,{label,category});closeSheet();return render()}const{error}=await sb.from('requirement_templates').update({label,category,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Unable to update',error.message);closeSheet();await load();render()}function teamScreen(){if(!master()||test())return '<div class="card">Team Management is available only in Master mode.</div>';const rows=S.team.filter(x=>x.id!==S.profile.id).map(x=>'<div class="listitem"><div class="row"><div><b>'+esc(x.full_name||'Unnamed')+'</b><div class="muted">'+esc(x.role)+' · '+(x.active?'Active':'Inactive')+'</div></div><button class="btn secondary small" onclick="toggleActive(\''+x.id+'\','+(!x.active)+')">'+(x.active?'DEACTIVATE':'ACTIVATE')+'</button></div>'+(x.role==='fsm'?'<div class="row" style="margin-top:8px"><span class="muted">Requirement Library Authority</span><button class="btn ghost small" onclick="toggleFsm(\''+x.id+'\')">CHANGE</button></div>':'')+'</div>').join('');return '<div class="row"><div><div class="eyebrow">Master Control</div><h1>Team Management</h1></div><button class="btn" onclick="invite()">＋ INVITE</button></div><div class="card">'+(rows||'<div class="muted">No team members yet.</div>')+'</div>'}async function toggleActive(id,val){const{error}=await sb.rpc('set_team_member_active',{p_user_id:id,p_active:val});if(error)return toast('Unable to update',error.message);await load();render()}async function toggleFsm(id){const{data}=await sb.from('fsm_permissions').select('can_manage_requirement_library').eq('user_id',id).maybeSingle();const{error}=await sb.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:!data?.can_manage_requirement_library});if(error)return toast('Unable to update',error.message);await load();render()}function invite(){sheet('<h2>Create Team Invitation</h2><label>Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn full" style="margin-top:14px" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="inv"></div>')}async function createInvite(){const{data,error}=await sb.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return toast('Unable to create invite',error.message);document.getElementById('inv').innerHTML='<div class="card"><div class="eyebrow">Invitation Code</div><h2 style="letter-spacing:.15em">'+esc(data)+'</h2><div class="muted">Give this code to the intended team member.</div></div>'}function notifications(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">'+(S.notes.map(n=>'<div class="listitem"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div></div>').join('')||'<div class="muted">No notifications yet.</div>')+'</div>'}function account(){return '<div class="eyebrow">Account</div><h1>'+esc(S.profile?.full_name||'Rahul Champaneri')+'</h1><div class="card"><div class="row"><div><h2>'+esc(role())+'</h2><div class="muted">'+(test()?'Master session · simulated authority':'Authorized AXIOM PULSE account')+'</div></div><span class="badge">ACTIVE</span></div></div>'+(test()?'<button class="btn secondary full" onclick="exitTest()">RETURN TO MASTER</button><div style="height:8px"></div>':'')+'<button class="btn danger full" onclick="signOut()">SIGN OUT</button>'}async function signOut(){if(S.channel)sb.removeChannel(S.channel);await sb.auth.signOut();location.reload()}function go(x){S.screen=x;render()}function sheet(h){closeSheet();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button><div style="height:10px"></div>'+h+'</section>';document.body.appendChild(m)}function closeSheet(){document.getElementById('modal')?.remove()}function subscribe(){if(test()||S.channel)return;S.channel=sb.channel('axiom-live-'+S.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await load();render()}).subscribe();sb.channel('axiom-notes-'+S.profile.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+S.profile.id},p=>{S.notes.unshift(p.new);notify(p.new.title,p.new.body)}).subscribe()}function notify(t,b){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted">'+esc(b)+'</div>';document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}boot();</script></body></html>
