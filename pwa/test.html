<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c"><title>AXIOM Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--panel:#10243a;--line:#2f4d6d;--text:#f5f7fb;--muted:#9fb4cc;--blue:#4d9df7;--green:#35d392;--red:#ef6978}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#12304f 0,#081624 45%,#040a12 100%);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.page{min-height:100dvh;max-width:980px;margin:auto;padding:18px}.brand{text-align:center;position:relative;min-height:300px;display:grid;place-items:center;overflow:hidden}.ecg{position:absolute;left:0;right:0;top:40%;height:100px}.ecg svg{width:100%;height:100%}.ecg path{fill:none;stroke:#3d95e7;stroke-width:2.8;filter:drop-shadow(0 0 7px #4aa7ff)}.logo{position:relative;z-index:2;display:flex;justify-content:center;align-items:baseline;gap:14px}.axiom{font-size:70px;font-weight:950;letter-spacing:.1em}.pulse{font-size:62px;font-weight:850;font-style:italic;color:#59a6fb;text-shadow:0 0 20px #3488f077}.meaning{position:relative;z-index:2;margin-top:34px;color:#7cafdb;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:700}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive}.tag{position:relative;z-index:2;margin-top:8px;color:#cad4df}.card{background:linear-gradient(145deg,#12263d,#0d1c2d);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px #0007;margin:12px auto;max-width:700px}.muted{color:var(--muted)}.field{margin-top:11px}.field label{display:block;font-size:12px;color:#a8bad0}.input,select{width:100%;margin-top:6px;padding:13px;border-radius:13px;border:1px solid #315372;background:#081624;color:#fff}.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:#06111c;font-weight:850;width:100%;margin-top:9px}.btn.secondary{background:#152c44;color:#eef5ff;border:1px solid #385a79}.btn.danger{background:#52242e;color:#ffdce2}.hidden{display:none}.bar{margin:0 auto 12px;max-width:700px;padding:9px;border-radius:12px;border:1px solid #806b38;background:#3c301b;color:#ffe0a0;text-align:center;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.list div{border-bottom:1px solid #22394f;padding:12px 0}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#92a8c0;font-size:10px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:end}.sheet{width:min(100%,720px);background:#10243a;border-radius:24px 24px 0 0;padding:18px}@media(max-width:560px){.page{padding:10px}.brand{min-height:275px}.axiom{font-size:43px}.pulse{font-size:39px}.meaning{font-size:8px}.by{font-size:17px}.tag{font-size:13px}.grid{gap:7px}.stat{padding:10px}}
</style></head><body><div id="root"><main class="page"><div class="brand"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div><section class="card" id="login"><h2>Secure Sign In</h2><p class="muted">Authorized AXIOM PULSE access.</p><div id="msg" class="muted" style="margin-top:8px"></div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="password" class="input" type="password" autocomplete="current-password"></label></div><button class="btn" onclick="signin()">ENTER AXIOM PULSE</button><button class="btn secondary" onclick="joinPage()">JOIN WITH INVITATION</button></section></main></div><script>const URL='https://xjahoajimgdyuwxdjakw.supabase.co',KEY='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD',db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),root=document.getElementById('root');let P=null,T=null,mode='master',page='home',data=[],team=[];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const isMaster=()=>P?.role==='master';const test=()=>mode!=='master';const role=()=>test()?mode:P?.role;function toast(t){const n=document.createElement('div');n.className='bar';n.textContent=t;root.prepend(n);setTimeout(()=>n.remove(),3500)}async function signin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return document.getElementById('msg').textContent='Enter your email and password.';const r=await db.auth.signInWithPassword({email,password});if(r.error)return document.getElementById('msg').textContent=r.error.message;await auth(r.data.session)}async function auth(s){const r=await db.from('profiles').select('*').eq('id',s.user.id).maybeSingle();if(r.error||!r.data)return db.auth.signOut().then(()=>location.reload());if(!r.data.active)return db.auth.signOut().then(()=>location.reload());P=r.data;await live();app()}function joinPage(){document.getElementById('login').innerHTML='<h2>Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn" onclick="join()">CREATE ACCOUNT</button><button class="btn secondary" onclick="location.reload()">BACK TO SIGN IN</button><div id="jm" class="muted" style="margin-top:8px"></div>'}async function join(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim().toLowerCase(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6)return document.getElementById('jm').textContent='Complete every field. Password must be at least 6 characters.';const r=await db.functions.invoke('create-invited-user',{body:{full_name:n,email:e,password:p,invite_code:c}});if(r.error)return document.getElementById('jm').textContent=r.error.message;if(r.data?.error)return document.getElementById('jm').textContent=r.data.error;const s=await db.auth.signInWithPassword({email:e,password:p});if(s.error)return document.getElementById('jm').textContent='Account created. Sign in with your new credentials.';await auth(s.data.session)}async function live(){if(test()){demo();return}const q=role()==='salesperson'?db.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',P.id):db.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',P.dealership_id);const[r,t]=await Promise.all([q,sbReq()]);data=r.data||[];team=t||[]}async function sbReq(){if(!isMaster())return[];const r=await db.rpc('get_team_members');return r.data||[]}function demo(){data=[{id:'demo',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',status:'scheduled',delivery_at:new Date(Date.now()+86400000).toISOString(),delivery_requirements:[{id:'r1',label:'Void cheque',completed:false},{id:'r2',label:'Trade ownership',completed:true},{id:'r3',label:'Trade release form',completed:false},{id:'r4',label:'$500 due on delivery',completed:false}]}]}team=[]}function header(){return '<header class="head"><div class="headrow"><b>AXIOM</b> <i>Pulse</i></div><div class="meta">AI eXecutive Intelligence &amp; Operations Management</div><div class="headby">by Rahul Champaneri</div><div class="headtag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav>'}function app(){let h='<div class="app">'+header()+'<main class="page">'+(test()?'<div class="test">TEST '+mode.toUpperCase()+' MODE · Master session preserved</div>':'')+screen()+'</main>'+nav()+'</div>';root.innerHTML=h}function screen(){if(page==='deliveries')return deliveries();if(page==='account')return account();return home()}function home(){const a=data.filter(x=>x.status!=='delivered'),o=a.flatMap(x=>x.delivery_requirements||[]).filter(x=>!x.completed&&!x.exception_reason).length;let x='<div class="eyebrow">'+role().toUpperCase()+' ACCESS</div><h1>'+(isMaster()&&!test()?'Master Control Center':role()==='fsm'?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted">Welcome, '+esc(P.full_name)+'.</p><div class="grid"><div class="stat"><b>'+a.length+'</b>Active</div><div class="stat"><b>'+a.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b>Today</div><div class="stat"><b>'+o+'</b>Outstanding</div></div><div class="card"><h2>Delivery source of truth</h2><p class="muted">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>';if(isMaster()&&!test())x+='<div class="card"><h2>Master Control</h2><p class="muted">Your Master authority remains intact. Test each operational role without changing your real role.</p><button class="btn" onclick="enter(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enter(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn secondary" onclick="go(\'team\')">MANAGE USERS</button></div>';if(test())x+='<div class="card"><button class="btn secondary" onclick="exit()">RETURN TO MASTER</button></div>';return x}function deliveries(){return '<div class="eyebrow">DELIVERY WORKFLOW</div><h1>Deliveries</h1><div class="list">'+data.map(d=>'<div class="card" onclick="openD(\''+d.id+'\')"><div class="row"><div><b>'+esc(d.customer_name)+'</b><div class="muted">'+esc(d.vehicle)+'</div></div><span>'+esc(d.status)+'</span></div><div class="muted">'+new Date(d.delivery_at).toLocaleString()+'</div></div>').join('')+'</div>'}function openD(id){const d=data.find(x=>x.id===id);page='delivery';root.innerHTML='<div class="app">'+header()+'<main class="page"><button class="btn secondary" onclick="go(\'deliveries\')">← BACK</button><div class="card"><h1>'+esc(d.customer_name)+'</h1><div class="muted">'+esc(d.vehicle)+'</div></div><div class="card"><h2>Delivery Requirements</h2>'+d.delivery_requirements.map(r=>'<div class="listitem"><div class="row"><b>'+esc(r.label)+'</b><span>'+((r.completed||r.exception_reason)?'Resolved':'Outstanding')+'</span></div>'+(role()==='salesperson'&&!r.completed?'<button class="btn secondary" onclick="complete(\''+id+'\',\''+r.id+'\')">COMPLETE</button>':'')+'</div>').join('')+'</div></main>'+nav()+'</div>'}function complete(id,rid){const d=data.find(x=>x.id===id),r=d.delivery_requirements.find(x=>x.id===rid);if(role()==='salesperson'){r.completed=true;toast('Requirement completed — TEST MODE simulates the FSM live notification.')}openD(id)}function account(){return '<div class="eyebrow">ACCOUNT</div><h1>'+esc(P.full_name)+'</h1><div class="card"><b>'+esc(role())+'</b><div class="muted">'+(test()?'Master session preserved; simulated authority':'Authorized AXIOM PULSE account')+'</div></div>'+(test()?'<button class="btn secondary" onclick="exit()">RETURN TO MASTER</button>':'')+'<button class="btn danger" onclick="logout()">SIGN OUT</button>'}function enter(r){if(!isMaster()||test())return;mode=r;demo();page='home';app()}async function exit(){mode='master';await live();page='home';app()}function go(v){page=v;app()}async function logout(){await db.auth.signOut();S={};location.reload()}window.addEventListener('load',async()=>{const s=await db.auth.getSession();if(s.data.session)await auth(s.data.session)})</script></body></html>
