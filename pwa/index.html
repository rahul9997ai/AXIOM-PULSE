<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AXIOM Pulse</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
:root{--bg:#07101c;--panel:#101f32;--panel2:#172a40;--line:#29415d;--blue:#4b9cff;--text:#f3f6fb;--muted:#9eb0c7;--green:#3ddc97;--red:#ff6677}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100dvh;max-width:1240px;margin:auto;background:linear-gradient(180deg,#0a1523,#07101c)}.brand{padding:18px 22px;border-bottom:1px solid var(--line);background:#111f31;position:sticky;top:0;z-index:20}.brandline{display:flex;align-items:center;gap:14px}.axiom{font-size:28px;font-weight:900;letter-spacing:.24em}.pulse{font-size:25px;font-style:italic;color:#6eafff;font-weight:700}.heartbeat{height:1px;flex:1;background:linear-gradient(90deg,#315277,#5aa8ff,#315277);position:relative}.meaning{font-size:10px;letter-spacing:.18em;color:#77b3ff;margin:7px 0 2px;text-transform:uppercase}.by{font-family:cursive;font-size:18px;color:#d6deea}.tag{color:#b8c5d6;font-size:13px;margin-top:3px}.content{padding:20px 16px 90px}.nav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:1240px;height:70px;background:#101f32;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:30}.nav button{background:none;border:0;color:var(--muted);font-size:11px;min-width:72px}.nav button.active{color:#fff}.nav b{display:block;font-size:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 35px #0003}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}h1,h2,h3{margin:0 0 8px}h1{font-size:26px}h2{font-size:20px}.btn{background:var(--blue);color:#06111f;border:0;border-radius:14px;padding:14px 17px;font-weight:800;font-size:15px}.btn.secondary{background:#182b40;color:#eaf2ff;border:1px solid #315071}.btn.danger{background:#5a1f2a;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:16px;background:#0c1826;border:1px solid var(--line)}.stat b{font-size:25px;display:block}.input,select,textarea{width:100%;padding:14px;background:#0b1725;color:var(--text);border:1px solid #29415d;border-radius:14px;font-size:16px;margin:5px 0 12px}label{font-size:13px;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 13px;border:1px solid #315d91;background:#122842;border-radius:999px;color:#dbe9fa}.delivery{cursor:pointer}.badge{padding:5px 9px;border-radius:999px;font-size:12px;background:#163d31;color:#86f0bf}.badge.out{background:#48242b;color:#ffb3bd}.req{padding:13px 0;border-bottom:1px solid #21354c}.req:last-child{border:0}.req button{margin-left:6px}.login{min-height:100dvh;display:grid;place-items:center;padding:22px}.loginbox{width:min(100%,430px);text-align:center}.pulsehero{font-size:56px;font-weight:900;letter-spacing:.15em}.pulsehero span{color:#58a8ff;font-style:italic}.pulsegif{height:34px;margin:14px auto;background:linear-gradient(90deg,transparent,#55a8ff,transparent);position:relative;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scaleY(1.6);opacity:.5}}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:end center;z-index:50;padding:0}.sheet{width:min(100%,650px);max-height:90dvh;overflow:auto;background:#101f32;border-radius:26px 26px 0 0;padding:20px}.notice{position:fixed;top:86px;right:16px;left:16px;z-index:60;background:#163a58;border:1px solid #4a9fff;border-radius:16px;padding:14px;box-shadow:0 12px 35px #0008}@media(min-width:760px){.content{padding:28px 36px 90px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.nav{border-radius:18px 18px 0 0}}
</style></head><body><div id="root"></div>
<script>
const cfg=window.AXIOM_CONFIG||{};const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);let profile=null,deliveries=[],active='home';
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function brand(){return '<header class="brand"><div class="brandline"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span><span class="heartbeat"></span></div><div class="meaning">AI eXecutive Intelligence & Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></header>'}
function toast(title,body){const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(title)+'</b><div class="muted">'+esc(body)+'</div>';document.body.append(n);setTimeout(()=>n.remove(),5000)}
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();const r=await sb.from('profiles').select('*').eq('id',session.user.id).single();profile=r.data;if(!profile||!profile.active)return login('Your account is not active.');await getDeliveries();render();subscribe()}
async function getDeliveries(){if(!profile)return;let q=sb.from('deliveries').select('*,delivery_requirements(*)').order('delivery_at',{ascending:true});q=profile.role==='salesperson'?q.eq('salesperson_id',profile.id):q.eq('dealership_id',profile.dealership_id);const{data,error}=await q;if(error)toast('Data error',error.message);deliveries=data||[]}
function login(msg=''){root.innerHTML='<main class="login"><section class="loginbox"><div class="pulsehero">AXIOM <span>Pulse</span></div><div class="pulsegif"></div><div class="meaning">AI eXecutive Intelligence & Operations Management</div><div class="by">by Rahul Champaneri</div><p class="tag">The Pulse of Every Delivery</p><div class="card" style="text-align:left"><h2>Sign in</h2><p class="muted">FSM and Salesperson operational access.</p><div id="loginmsg" class="muted">'+esc(msg)+'</div><label>Email</label><input class="input" id="email" type="email"><label>Password</label><input class="input" id="password" type="password"><button class="btn" style="width:100%" onclick="signIn()">Sign in to AXIOM Pulse</button></div></section></main>'}
async function signIn(){const email=document.getElementById('email').value,password=document.getElementById('password').value;const{error}=await sb.auth.signInWithPassword({email,password});if(error)document.getElementById('loginmsg').textContent=error.message;else load()}
async function signOut(){await sb.auth.signOut();profile=null;deliveries=[];login()}
function nav(){return '<nav class="nav"><button class="'+(active==='home'?'active':'')+'" onclick="go(\'home\')"><b>⌂</b>Home</button><button class="'+(active==='deliveries'?'active':'')+'" onclick="go(\'deliveries\')"><b>◫</b>Deliveries</button><button class="'+(active==='notifications'?'active':'')+'" onclick="go(\'notifications\')"><b>◉</b>Alerts</button><button onclick="go(\'account\')"><b>◌</b>Account</button></nav>'}
function render(){if(!profile)return;root.innerHTML='<div class="app">'+brand()+'<main class="content">'+screen()+'</main>'+nav()+'</div>'}
function screen(){if(active==='deliveries')return deliveryList();if(active==='notifications')return notifications();if(active==='account')return account();if(active==='team')return team();return home()}
function home(){const open=deliveries.filter(d=>d.status!=='delivered').length;const out=deliveries.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<h1>Good day, '+esc(profile.full_name)+'</h1><p class="muted">'+esc(profile.role.toUpperCase())+' · Live dealership workspace</p><div class="grid grid3"><div class="stat"><b>'+deliveries.length+'</b><span class="muted">Deliveries</span></div><div class="stat"><b>'+open+'</b><span class="muted">Active</span></div><div class="stat"><b>'+out+'</b><span class="muted">Outstanding</span></div></div><div class="card"><div class="row"><div><h2>Delivery workflow</h2><div class="muted">The FSM’s instructions follow the deal all the way to delivery.</div></div><button class="btn" onclick="go(\'deliveries\')">Open</button></div></div>'+(profile.role==='master'?'<div class="card"><h2>Master control</h2><p class="muted">Manage dealership access and invitations.</p><button class="btn secondary" onclick="go(\'team\')">Manage team</button></div>':'')}
function deliveryList(){return '<div class="row"><div><h1>Deliveries</h1><div class="muted">Live delivery records</div></div>'+(profile.role==='fsm'||profile.role==='master'?'<button class="btn" onclick="createDelivery()">＋ Create</button>':'')+'</div>'+deliveries.map(d=>'<article class="card delivery" onclick="openDelivery(\''+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+' · '+new Date(d.delivery_at).toLocaleString()+'</div></div><span class="badge '+(d.status==='delivered'?'':'out')+'">'+esc(d.status)+'</span></div><div class="muted" style="margin-top:10px">'+(d.delivery_requirements||[]).filter(r=>r.completed).length+' / '+(d.delivery_requirements||[]).length+' requirements complete</div></article>').join('')||'<div class="card muted">No deliveries yet.</div>'}
function openDelivery(id){const d=deliveries.find(x=>x.id===id);if(!d)return;const req=(d.delivery_requirements||[]).map(r=>'<div class="req"><div class="row"><div><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.kind)+(r.amount?' · $'+r.amount:'')+'</div>'+ (r.exception_reason?'<div style="color:#ffb3bd">Exception: '+esc(r.exception_reason)+'</div>':'')+'</div><div>'+(r.completed?'<span class="badge">Completed</span>':profile.role==='salesperson'?'<button class="btn secondary" onclick="completeReq(\''+r.id+'\')">Complete</button><button class="btn danger" onclick="exceptionReq(\''+r.id+'\')">Exception</button>':'<span class="badge out">Outstanding</span>')+'</div></div></div>').join('');root.innerHTML='<div class="app">'+brand()+'<main class="content"><button class="btn secondary" onclick="go(\'deliveries\')">← Back</button><div class="card"><h1>'+esc(d.customer_name)+'</h1><p class="muted">'+esc(d.vehicle)+'</p><div class="grid"><div class="stat">Delivery<br><b style="font-size:17px">'+new Date(d.delivery_at).toLocaleString()+'</b></div><div class="stat">Status<br><b style="font-size:17px">'+esc(d.status)+'</b></div></div><p class="muted">Lender / Lessor: '+esc(d.lender_name||'—')+'</p></div><div class="card"><h2>Delivery Requirements</h2><p class="muted">Structured requirements attached to this specific delivery.</p>'+req+'</div>'+(profile.role==='fsm'?'<button class="btn" onclick="addReq(\''+d.id+'\')">＋ Add requirement</button>':'')+'</main>'+nav()+'</div>'}
async function completeReq(id){const{error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:profile.id}).eq('id',id);if(error)return toast('Unable to complete',error.message);toast('Requirement completed','The FSM receives this update in real time.');await refresh()}
async function exceptionReq(id){const reason=prompt('Why is this requirement an exception?');if(!reason)return;const{error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:profile.id}).eq('id',id);if(error)return toast('Unable to record exception',error.message);toast('Exception recorded','The delivery history now contains the reason.');await refresh()}
function addReq(deliveryId){sheet('<h2>Add delivery requirement</h2><label>Requirement label</label><input class="input" id="rlabel" placeholder="Example: Spare key required"><label>Type</label><select id="rkind"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select><button class="btn" onclick="saveReq(\''+deliveryId+'\')">Add to delivery</button>')}
async function saveReq(deliveryId){const label=document.getElementById('rlabel').value,kind=document.getElementById('rkind').value;if(!label)return;const{error}=await sb.from('delivery_requirements').insert({delivery_id:deliveryId,label,kind});if(error)return toast('Unable to add',error.message);closeSheet();toast('New instruction added','The assigned salesperson receives the update in real time.');await refresh()}
function createDelivery(){sheet('<h2>Create delivery</h2><label>Customer</label><input class="input" id="customer"><label>Vehicle</label><input class="input" id="vehicle"><label>Lender / Lessor</label><input class="input" id="lender"><label>Delivery date and time</label><input class="input" id="date" type="datetime-local"><label>Assign salesperson ID</label><input class="input" id="salesperson" placeholder="UUID from team profile"><label>FSM notes</label><textarea id="notes"></textarea><button class="btn" onclick="saveDelivery()">Create delivery</button><p class="muted">Production enhancement: salesperson selection will be populated from authorized dealership users.</p>')}
async function saveDelivery(){const delivery_at=document.getElementById('date').value;const row={dealership_id:profile.dealership_id,fsm_id:profile.id,salesperson_id:document.getElementById('salesperson').value,customer_name:document.getElementById('customer').value,vehicle:document.getElementById('vehicle').value,lender_name:document.getElementById('lender').value,delivery_at:new Date(delivery_at).toISOString(),fsm_notes:document.getElementById('notes').value};const{error}=await sb.from('deliveries').insert(row);if(error)return toast('Unable to create delivery',error.message);closeSheet();await refresh();toast('Delivery created','Add requirements to complete the FSM instruction record.')}
function notifications(){return '<h1>Notifications</h1><div class="card"><h2>Live notification center</h2><p class="muted">Delivery changes, completed requirements and new FSM instructions appear here in the live production workflow.</p><button class="btn" onclick="requestNotify()">Enable browser notifications</button></div>'}
async function requestNotify(){if(!('Notification'in window))return toast('Not supported','This browser does not support web notifications.');const p=await Notification.requestPermission();toast('Notification permission',p)}
function account(){return '<h1>Account</h1><div class="card"><h2>'+esc(profile.full_name)+'</h2><p class="muted">'+esc(profile.role)+' · '+esc(profile.active?'Active':'Inactive')+'</p><button class="btn danger" onclick="signOut()">Sign out</button></div>'}
async function team(){const{data,error}=await sb.from('profiles').select('id,full_name,role,active').eq('dealership_id',profile.dealership_id).order('role');const people=data||[];return '<h1>Team management</h1><p class="muted">Master control for FSM and Salesperson access.</p><div class="card">'+people.map(p=>'<div class="req row"><div><b>'+esc(p.full_name)+'</b><div class="muted">'+esc(p.role)+' · '+(p.active?'Active':'Inactive')+'</div></div><button class="btn secondary" onclick="toggleUser(\''+p.id+'\','+(p.active?'false':'true')+')">'+(p.active?'Deactivate':'Activate')+'</button></div>').join('')+'</div>'}
async function toggleUser(id,activeValue){const{error}=await sb.from('profiles').update({active:activeValue}).eq('id',id);if(error)return toast('Unable to update user',error.message);await refresh()}
function sheet(html){const m=document.createElement('div');m.id='sheet';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn secondary" onclick="closeSheet()">Close</button><div style="height:12px"></div>'+html+'</section>';document.body.append(m)}function closeSheet(){document.getElementById('sheet')?.remove()}function go(x){active=x;render()}async function refresh(){await getDeliveries();render()}function subscribe(){if(window.axiomChannel)return;window.axiomChannel=sb.channel('axiom-'+profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async p=>{await refresh();toast('Delivery updated','A delivery changed in real time.');}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async p=>{await refresh();toast('Delivery requirement update','An instruction changed in real time.');}).subscribe()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load();
</script></body></html>
