<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AXIOM Pulse</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--bg:#07101c;--bg2:#0b1726;--panel:#101f32;--panel2:#172a40;--line:#2a4664;--blue:#4b9cff;--blue2:#78b7ff;--text:#f3f6fb;--muted:#9eb0c7;--green:#3ddc97;--amber:#ffbf57;--red:#ff6677;--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:none;min-height:100dvh;max-width:1240px;margin:auto;background:linear-gradient(180deg,#0a1523 0%,#07101c 100%)}.app.ready{display:block}.content{padding:18px 15px 96px;max-width:1120px;margin:auto}.topbar{position:sticky;top:0;z-index:30;padding:13px 18px 12px;background:#111f31ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brandrow{display:flex;align-items:center;gap:12px}.axiom{font-size:28px;font-weight:900;letter-spacing:.22em;color:#f2f4f8}.pulse{font-size:27px;font-style:italic;color:#66abff;font-weight:800}.pulseline{height:1px;flex:1;min-width:40px;background:#34526f;position:relative;overflow:hidden}.pulseline:after{content:"";position:absolute;left:0;top:0;width:80px;height:1px;background:#6db5ff;box-shadow:0 0 14px #5aa8ff;animation:travel 1.7s linear infinite}.brandmeta{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#77a9db;margin-top:7px}.brandby{font-family:"Segoe Script","Brush Script MT",cursive;font-size:16px;font-style:italic;color:#e5e9f0;margin-top:2px}.brandtag{font-size:11px;color:#b7c5d7;margin-top:1px}@keyframes travel{to{transform:translateX(600px)}}h1,h2,h3,p{margin:0}h1{font-size:27px}h2{font-size:20px}h3{font-size:16px}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#76aef1;margin-bottom:6px}.card{background:linear-gradient(145deg,#122338,#0e1c2d);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 12px 35px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:18px;background:#0a1725}.stat b{font-size:25px;display:block}.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:#06111f;font-weight:850}.btn.secondary{background:#172b42;color:#edf4ff;border:1px solid #315171}.btn.ghost{background:transparent;color:#c8d9ed;border:1px solid #315171}.btn.danger{background:#51222b;color:#ffdce1;border:1px solid #7c3441}.btn.small{padding:9px 12px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.input,select,textarea{width:100%;padding:14px;background:#091624;color:var(--text);border:1px solid #2a4664;border-radius:14px;margin-top:5px}.input:focus,select:focus,textarea:focus{outline:2px solid #4389d755;border-color:#5fa9ff}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:#9eb4cd;display:block}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;background:#173b31;color:#93f3c2}.badge.out{background:#48242b;color:#ffc0c8}.badge.wait{background:#4a3a1d;color:#ffd98e}.listitem{padding:13px 0;border-bottom:1px solid #20364f}.listitem:last-child{border-bottom:0}.tap{cursor:pointer}.tap:active{transform:scale(.995)}.nav{position:fixed;z-index:40;bottom:0;left:0;right:0;max-width:1240px;margin:auto;height:76px;background:#101f32f4;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.nav button{min-width:66px;background:none;border:0;color:#91a5bc;font-size:10px}.nav button.active{color:#fff}.nav b{display:block;font-size:21px;margin-bottom:3px}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(100%,480px)}.identity{position:relative;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center}.identity-wave{position:absolute;left:-5%;right:-5%;top:41%;height:100px;z-index:0;opacity:.9;background:linear-gradient(90deg,transparent 0%,transparent 4%,#1d3f62 6%,#66b5ff 8%,#193b5e 10%,transparent 13%,transparent 57%,#1b3d60 60%,#65b5ff 63%,#1b3d60 66%,transparent 70%);filter:drop-shadow(0 0 10px #3e90e5);animation:wave 1.5s ease-in-out infinite}.identity-logo{position:relative;z-index:2;display:flex;align-items:baseline;gap:13px}.identity-axiom{font-size:53px;font-weight:900;letter-spacing:.11em}.identity-pulse{font-size:48px;font-weight:800;font-style:italic;color:#5fa7ff;text-shadow:0 0 18px #2c7ee388}.identity-meaning{position:relative;z-index:2;margin-top:38px;font-size:9px;letter-spacing:.16em;color:#77a9db;text-transform:uppercase}.identity-by{position:relative;z-index:2;margin-top:7px;font-family:"Segoe Script","Brush Script MT",cursive;font-size:21px;font-style:italic}.identity-tag{position:relative;z-index:2;margin-top:8px;color:#c7d1de;font-size:14px}@keyframes wave{50%{filter:drop-shadow(0 0 20px #5aa8ff);opacity:.6}}.notice{position:fixed;z-index:90;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#12324f;border:1px solid #4a9fff;border-radius:17px;padding:14px;box-shadow:0 18px 50px #0008}.modal{position:fixed;inset:0;z-index:70;background:#000a;display:grid;place-items:end center}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#101f32;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.chiprow{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border-radius:999px;border:1px solid #315f93;background:#102842;color:#dceafb}.chip.selected{background:#245b95;border-color:#6db2ff}.requirement{display:flex;gap:11px;align-items:flex-start}.check{width:24px;height:24px;border-radius:8px;border:1px solid #416383;background:#0b1827;color:#fff;display:grid;place-items:center;flex:0 0 auto}.check.done{background:#1d7a58;border-color:#3bd598}.check.exception{background:#7a303b;border-color:#ff7888}.requirement-main{flex:1}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}.seg button{flex:1;padding:10px;border:0;background:#0c1927;color:#aabbd0}.seg button.active{background:#21456d;color:#fff}.hidden{display:none!important}@media(min-width:760px){.content{padding:28px 34px 96px}.fieldrow{grid-template-columns:1fr 1fr}.nav{left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}.identity{min-height:330px}.identity-axiom{font-size:62px}.identity-pulse{font-size:56px}}@media(max-width:480px){.identity-axiom{font-size:42px}.identity-pulse{font-size:39px}.axiom{font-size:24px}.pulse{font-size:23px}.grid3{grid-template-columns:1fr 1fr 1fr}.stat{padding:11px}.fieldrow{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"></div>
<script>
const cfg=window.AXIOM_CONFIG||{};
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={profile:null,deliveries:[],templates:[],notifications:[],team:[],active:'home',channel:null,notificationChannel:null,testRole:null};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>n===null||n===undefined||n===''?'':new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n));
const fmtDate=v=>new Date(v).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const fmtTime=v=>new Date(v).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const effectiveRole=()=>state.testRole||state.profile?.role; const isMaster=()=>effectiveRole()==='master', isFSM=()=>effectiveRole()==='fsm', isSales=()=>effectiveRole()==='salesperson';
const canEditLibrary=()=>isMaster()||state.profile?.can_manage_requirement_library===true;
function brand(){return '<header class="topbar"><div class="brandrow"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span><span class="pulseline"></span></div><div class="brandmeta">AI eXecutive Intelligence & Operations Management</div><div class="brandby">by Rahul Champaneri</div><div class="brandtag">The Pulse of Every Delivery</div></header>'}
function toast(title,body){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(title)+'</b><div class="muted" style="margin-top:3px">'+esc(body||'')+'</div>';document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}
async function init(){const pending=localStorage.getItem('axiom_pending_invite');const {data:{session}}=await sb.auth.getSession();if(!session){renderLogin();return}const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error){toast('Profile error',error.message);return}if(!data){if(pending){renderInviteComplete();return}renderLogin('This account is not yet authorized for AXIOM PULSE.');return}if(!data.active){await sb.auth.signOut();renderLogin('This account is inactive.');return}state.profile=data;if(pending)await finishPendingInvite();await loadAll();subscribe();render()}
async function loadAll(){await Promise.all([loadDeliveries(),loadTemplates(),loadNotifications(),loadTeam()]);await loadFSMCapability()}
async function loadFSMCapability(){if(!isFSM()){state.profile.can_manage_requirement_library=false;return}const {data}=await sb.from('fsm_permissions').select('can_manage_requirement_library').eq('user_id',state.profile.id).maybeSingle();state.profile.can_manage_requirement_library=!!data?.can_manage_requirement_library}
async function loadDeliveries(){if(!state.profile)return;let q=sb.from('deliveries').select('*,delivery_requirements(*)').order('delivery_at',{ascending:true});q=isSales()?q.eq('salesperson_id',state.profile.id):q.eq('dealership_id',state.profile.dealership_id);const {data,error}=await q;if(error)toast('Delivery data error',error.message);state.deliveries=data||[]}
async function loadTemplates(){if(!state.profile)return;const {data,error}=await sb.from('requirement_templates').select('*').eq('dealership_id',state.profile.dealership_id).order('sort_order').order('label');state.templates=data||[];if(error&&error.code!=='42P01')toast('Requirement library error',error.message)}
async function loadNotifications(){if(!state.profile)return;const {data}=await sb.from('notification_history').select('*').eq('user_id',state.profile.id).order('sent_at',{ascending:false}).limit(50);state.notifications=data||[]}
async function loadTeam(){if(!isMaster())return;const {data,error}=await sb.rpc('get_team_members');if(!error)state.team=data||[]}
function renderLogin(msg=''){root.innerHTML='<main class="login"><section class="loginbox"><div class="identity"><div class="identity-wave"></div><div class="identity-logo"><span class="identity-axiom">AXIOM</span><span class="identity-pulse">Pulse</span></div><div class="identity-meaning">AI eXecutive Intelligence & Operations Management</div><div class="identity-by">by Rahul Champaneri</div><div class="identity-tag">The Pulse of Every Delivery</div></div><div class="card"><h2>Sign in</h2><p class="muted" style="margin:6px 0 14px">Secure dealership access for authorized AXIOM PULSE users.</p><div id="loginmsg" class="muted" style="margin-bottom:8px">'+esc(msg)+'</div><label>Email<input class="input" id="email" type="email" autocomplete="email"></label><label>Password<input class="input" id="password" type="password" autocomplete="current-password"></label><button class="btn" style="width:100%;margin-top:4px" onclick="signIn()">Sign in</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="showJoin()">Join with invitation</button></div></section></main>'}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return toast('Missing information','Enter your email and password.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('loginmsg').textContent=error.message;await init()}
function showJoin(){renderJoin()}
function renderJoin(){root.innerHTML='<main class="login"><section class="loginbox"><div class="identity" style="min-height:220px"><div class="identity-wave"></div><div class="identity-logo"><span class="identity-axiom">AXIOM</span><span class="identity-pulse">Pulse</span></div><div class="identity-tag">Join your authorized dealership team</div></div><div class="card"><button class="btn ghost small" onclick="renderLogin()">← Sign in</button><div style="height:12px"></div><h2>Join AXIOM PULSE</h2><p class="muted" style="margin:6px 0 14px">Your Master provides a single-use invitation code. You cannot choose an elevated role yourself.</p><label>Full name<input class="input" id="joinname"></label><label>Invitation code<input class="input" id="joincode" style="text-transform:uppercase"></label><label>Email<input class="input" id="joinemail" type="email"></label><label>Create password<input class="input" id="joinpass" type="password"></label><button class="btn" style="width:100%" onclick="startJoin()">Create account</button></div></section></main>'}
async function startJoin(){const full_name=document.getElementById('joinname').value.trim(),code=document.getElementById('joincode').value.trim().toUpperCase(),email=document.getElementById('joinemail').value.trim(),password=document.getElementById('joinpass').value;if(!full_name||!code||!email||password.length<6)return toast('Check your information','Enter your name, invitation code, email and a password of at least 6 characters.');localStorage.setItem('axiom_pending_invite',JSON.stringify({full_name,code}));const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name}}});if(error)return toast('Account not created',error.message);if(data.session){await finishPendingInvite();await init()}else renderLogin('Check your email to verify your account, then sign in to finish joining AXIOM PULSE.')}
function renderInviteComplete(){root.innerHTML='<main class="login"><section class="loginbox"><div class="card"><h2>Finish joining AXIOM PULSE</h2><p class="muted" style="margin:8px 0 16px">Your account is verified. Sign in to securely apply your invitation.</p><button class="btn" onclick="renderLogin()">Continue to sign in</button></div></section></main>'}
async function finishPendingInvite(){const raw=localStorage.getItem('axiom_pending_invite');if(!raw)return;const p=JSON.parse(raw);const {error}=await sb.rpc('accept_team_invite',{p_code:p.code,p_full_name:p.full_name});if(error){toast('Invitation issue',error.message);return}localStorage.removeItem('axiom_pending_invite')}
async function signOut(){if(state.channel)sb.removeChannel(state.channel);if(state.notificationChannel)sb.removeChannel(state.notificationChannel);state.channel=null;state.notificationChannel=null;await sb.auth.signOut();state.profile=null;state.deliveries=[];renderLogin()}
function nav(){return '<nav class="nav"><button class="'+(state.active==='home'?'active':'')+'" onclick="go(\'home\')"><b>⌂</b>Home</button><button class="'+(state.active==='deliveries'?'active':'')+'" onclick="go(\'deliveries\')"><b>◫</b>Deliveries</button><button class="'+(state.active==='notifications'?'active':'')+'" onclick="go(\'notifications\')"><b>◉</b>Alerts</button>'+(isMaster()?'<button class="'+(state.active==='team'?'active':'')+'" onclick="go(\'team\')"><b>♙</b>Team</button>':'')+'<button class="'+(state.active==='account'?'active':'')+'" onclick="go(\'account\')"><b>◌</b>Account</button></nav>'}
function render(){if(!state.profile)return;root.innerHTML='<div class="app ready">'+brand()+'<main class="content">'+screen()+'</main>'+nav()+'</div>'}
function screen(){if(state.active==='deliveries')return deliveryList();if(state.active==='notifications')return notificationScreen();if(state.active==='team')return teamScreen();if(state.active==='account')return accountScreen();if(state.active==='library')return libraryScreen();return homeScreen()}
function enterMasterTestRole(r){if(state.profile?.role!=='master')return;state.testRole=r;loadDemoData();state.active='home';render();}
function exitMasterTestRole(){state.testRole=null;state.active='home';loadData().then(render);}
function masterRoleTester(){return state.profile?.role==='master'&&!state.testRole?'<div class="card"><div class="eyebrow">MASTER CONTROL CENTER</div><h2>Test operational access</h2><p class="muted" style="margin:6px 0 12px">Your Master account remains fully authorized. Enter either operational workspace for testing without changing the real account role.</p><div style="display:grid;gap:9px"><button class="btn" onclick="enterMasterTestRole(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterMasterTestRole(\'salesperson\')">TEST AS SALESPERSON</button></div></div>':state.testRole?'<div class="card"><div class="eyebrow">TEST MODE</div><h2>'+state.testRole.toUpperCase()+' WORKSPACE</h2><p class="muted">Master session preserved. Changes in test mode are simulated locally.</p><button class="btn secondary" onclick="exitMasterTestRole()">RETURN TO MASTER</button></div>':'';}
function homeScreen(){const active=state.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled');const outstanding=active.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;const today=new Date().toDateString();const todayCount=active.filter(d=>new Date(d.delivery_at).toDateString()===today).length;const title=isMaster()?'Master Control':isFSM()?'FSM Workspace':'Salesperson Workspace'+masterRoleTester();return '<div class="eyebrow">'+esc(state.profile.role)+' access</div><h1>'+title+'</h1><p class="muted" style="margin-top:5px">Welcome, '+esc(state.profile.full_name)+'.</p><div class="grid3" style="margin-top:16px"><div class="stat"><b>'+active.length+'</b><span class="muted">Active</span></div><div class="stat"><b>'+todayCount+'</b><span class="muted">Today</span></div><div class="stat"><b>'+outstanding+'</b><span class="muted">Outstanding</span></div></div><div class="card"><div class="row"><div><h2>The delivery is the record</h2><p class="muted" style="margin-top:5px">The FSM’s instructions follow the deal all the way to delivery.</p></div><button class="btn" onclick="go(\'deliveries\')">Open</button></div></div>'+((isMaster()||isFSM())?'<div class="card"><h2>Requirement Library</h2><p class="muted" style="margin:5px 0 12px">Maintain reusable delivery requirements. '+(canEditLibrary()?'You have edit authority.':'Only designated editors can change the library.')+'</p><button class="btn secondary" onclick="go(\'library\')">Open library</button></div>':'')}
function deliveryList(){const canCreate=isFSM()||isMaster();const rows=state.deliveries.map(d=>{const rs=d.delivery_requirements||[],done=rs.filter(r=>r.completed||r.exception_reason).length;return '<article class="card tap" onclick="openDelivery(\''+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><p class="muted" style="margin-top:3px">'+esc(d.vehicle)+'</p></div><span class="badge '+(d.status==='delivered'?'':'out')+'">'+esc(d.status)+'</span></div><div class="row" style="margin-top:13px"><span class="muted">'+fmtDate(d.delivery_at)+' · '+fmtTime(d.delivery_at)+'</span><span class="muted">'+done+'/'+rs.length+' resolved</span></div></article>'}).join('');return '<div class="row"><div><div class="eyebrow">Delivery workflow</div><h1>Deliveries</h1></div>'+(canCreate?'<button class="btn" onclick="showCreateDelivery()">＋ Create</button>':'')+'</div>'+ (rows||'<div class="empty">No deliveries yet.</div>')}
function openDelivery(id){const d=state.deliveries.find(x=>x.id===id);if(!d)return;state.active='delivery:'+id;const reqs=(d.delivery_requirements||[]).map(r=>requirementRow(r,d)).join('')||'<div class="empty">No requirements have been added.</div>';root.innerHTML='<div class="app">'+brand()+'<main class="content"><button class="btn ghost small" onclick="go(\'deliveries\')">← All deliveries</button><div class="card"><div class="row"><div><div class="eyebrow">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><p class="muted" style="margin-top:4px">'+esc(d.vehicle)+'</p></div>'+(isSales()?'<span class="badge wait">Assigned to you</span>':'<span class="badge">FSM visibility</span>')+'</div><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted">Delivery</span><b style="font-size:15px">'+fmtDate(d.delivery_at)+'</b></div><div class="stat"><span class="muted">Time</span><b style="font-size:15px">'+fmtTime(d.delivery_at)+'</b></div></div><p class="muted" style="margin-top:12px">Lender / Lessor: '+esc(d.lender_name||'—')+' · '+esc(d.approval_status||'approved')+'</p>'+(d.fsm_notes?'<div class="card" style="margin:12px 0 0"><div class="eyebrow">FSM Notes</div>'+esc(d.fsm_notes)+'</div>':'')+'</div><div class="sectionhead"><div><h2>Delivery Requirements</h2><p class="muted" style="margin-top:4px">Every item must be completed or marked as an exception.</p></div>'+(canEditDelivery(d)?'<button class="btn secondary small" onclick="showAddRequirement(\''+d.id+'\')">＋ Add</button>':'')+'</div><div class="card">'+reqs+'</div>'+deliveryActionFooter(d)+'</main>'+nav()+'</div>'}
function canEditDelivery(d){return isMaster()||(isFSM()&&d.fsm_id===state.profile.id)}
function requirementRow(r,d){const resolved=r.completed||!!r.exception_reason;const cls=r.completed?'done':r.exception_reason?'exception':'';let actions='';if(isSales()&&!resolved){actions='<div style="margin-top:9px"><button class="btn secondary small" onclick="completeRequirement(\''+r.id+'\')">Complete</button><button class="btn danger small" onclick="showException(\''+r.id+'\')">Exception</button></div>'}return '<div class="listitem requirement"><span class="check '+cls+'">'+(r.completed?'✓':r.exception_reason?'!':'')+'</span><div class="requirement-main"><b>'+esc(r.label)+'</b><div class="muted" style="margin-top:3px">'+esc(r.kind)+(r.amount?' · '+money(r.amount):'')+'</div>'+(r.completed?'<div class="badge" style="margin-top:7px">Completed</div>':r.exception_reason?'<div class="badge out" style="margin-top:7px">Exception · '+esc(r.exception_reason)+'</div>':'<div class="badge wait" style="margin-top:7px">Outstanding</div>')+actions+'</div></div>'}
function deliveryActionFooter(d){if(!isSales()||d.status==='delivered')return '';const outstanding=(d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);return '<div class="card"><h2>Delivery completion</h2><p class="muted" style="margin:6px 0 12px">'+(outstanding.length?'⚠️ '+outstanding.length+' requirement'+(outstanding.length===1?' remains':'s remain')+' outstanding. Resolve each item before completing the delivery.':'All requirements are resolved.')+'</p><button class="btn" '+(outstanding.length?'disabled':'')+' onclick="completeDelivery(\''+d.id+'\')">Complete delivery</button></div>'}
async function completeRequirement(id){if(state.testRole){for(const d of state.deliveries){const r=(d.delivery_requirements||[]).find(x=>x.id===id);if(r){r.completed=true;r.exception_reason=null;break}}toast('Requirement completed','TEST MODE — simulated FSM notification.');render();return;}const {error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:state.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',id);if(error)return toast('Unable to complete requirement',error.message);await refresh(true)}
function showException(id){sheet('<h2>Mark as exception</h2><p class="muted" style="margin:6px 0 14px">Explain why this requirement was not completed. The reason becomes part of the delivery record.</p><label>Reason<textarea id="exceptionreason" placeholder="Example: Customer will provide electronically tomorrow."></textarea></label><button class="btn danger" onclick="saveException(\''+id+'\')">Record exception</button>')}
async function saveException(id){const reason=document.getElementById('exceptionreason').value.trim();if(!reason)return toast('Reason required','Explain the exception.');if(state.testRole){for(const d of state.deliveries){const r=(d.delivery_requirements||[]).find(x=>x.id===id);if(r){r.completed=false;r.exception_reason=reason;break}}closeSheet();toast('Exception recorded','TEST MODE — simulated FSM notification.');render();return;}const {error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:state.profile.id}).eq('id',id);if(error)return toast('Unable to record exception',error.message);closeSheet();await refresh(true)}
async function completeDelivery(id){if(state.testRole){const d=state.deliveries.find(x=>x.id===id);const bad=(d?.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);if(bad.length)return toast('Delivery not completed',bad.length+' requirement(s) remain unresolved.');d.status='delivered';render();return;}const {error}=await sb.rpc('complete_delivery',{p_delivery_id:id});if(error)return toast('Delivery not completed',error.message);toast('Delivery completed','The delivery record has been finalized.');await refresh();openDelivery(id)}
function showCreateDelivery(){const sales=state.team.filter(p=>p.role==='salesperson'&&p.active);if(isFSM()){loadFSMTeamAndOpen();return}openCreateSheet(sales)}
async function loadFSMTeamAndOpen(){const {data,error}=await sb.from('profiles').select('id,full_name,role,active').eq('dealership_id',state.profile.dealership_id).eq('role','salesperson').eq('active',true).order('full_name');if(error)return toast('Unable to load salespeople',error.message);openCreateSheet(data||[])}
function openCreateSheet(sales){if(!sales.length)return toast('No active salesperson','Ask the Master to activate or invite a salesperson first.');const opts=sales.map(p=>'<option value="'+p.id+'">'+esc(p.full_name)+'</option>').join('');sheet('<h2>Create Delivery</h2><p class="muted" style="margin:5px 0 15px">FSM instructions begin here and stay with the delivery.</p><label>Customer name<input class="input" id="dcustomer"></label><label>Vehicle<input class="input" id="dvehicle" placeholder="2026 Nissan Rogue"></label><label>Lender / Lessor<input class="input" id="dlender"></label><label>Approval status<select id="dapproval"><option value="approved">Approved</option><option value="pending">Pending</option><option value="conditional">Conditional</option></select></label><div class="fieldrow"><label>Delivery date<input class="input" id="ddate" type="date"></label><label>Delivery time<input class="input" id="dtime" type="time"></label></div><p class="muted" style="font-size:12px;margin-top:-5px">On iPhone and Android these controls open the device’s native date/time selector.</p><label>Assign salesperson<select id="dsales">'+opts+'</select></label><label>FSM notes<textarea id="dnotes" placeholder="Anything unique to this transaction"></textarea></label><div class="sectionhead"><h3>Delivery Requirements</h3><button class="btn secondary small" onclick="addDraftCustomRequirement()">＋ Custom</button></div><div id="draftRequirements" class="chiprow" style="margin-top:10px"></div><button class="btn" style="width:100%;margin-top:18px" onclick="saveDelivery()">Create delivery</button>');renderDraftRequirements()}
let draftRequirements=[];
function renderDraftRequirements(){const el=document.getElementById('draftRequirements');if(!el)return;const active=state.templates.filter(t=>t.active);el.innerHTML=active.map(t=>'<button class="chip '+(draftRequirements.some(r=>r.template_id===t.id)?'selected':'')+'" onclick="toggleTemplate(\''+t.id+'\')">'+(draftRequirements.some(r=>r.template_id===t.id)?'✓ ':'')+esc(t.label)+'</button>').join('')+(draftRequirements.filter(r=>r.custom).map((r,i)=>'<button class="chip selected" onclick="removeDraftCustom('+i+')">'+esc(r.label)+' ×</button>').join(''))}
function toggleTemplate(id){const t=state.templates.find(x=>x.id===id);const i=draftRequirements.findIndex(r=>r.template_id===id);if(i>=0)draftRequirements.splice(i,1);else draftRequirements.push({template_id:id,kind:t.kind,label:t.label,amount:null});renderDraftRequirements()}
function addDraftCustomRequirement(){const label=prompt('Custom requirement');if(!label?.trim())return;draftRequirements.push({custom:true,kind:'custom',label:label.trim(),amount:null});renderDraftRequirements()}
function removeDraftCustom(i){const customs=draftRequirements.filter(r=>r.custom);const target=customs[i];const idx=draftRequirements.indexOf(target);if(idx>=0)draftRequirements.splice(idx,1);renderDraftRequirements()}
async function saveDelivery(){const customer_name=document.getElementById('dcustomer').value.trim(),vehicle=document.getElementById('dvehicle').value.trim(),date=document.getElementById('ddate').value,time=document.getElementById('dtime').value,salesperson_id=document.getElementById('dsales').value;if(!customer_name||!vehicle||!date||!time||!salesperson_id)return toast('Missing information','Customer, vehicle, date, time and salesperson are required.');const delivery_at=new Date(date+'T'+time).toISOString();const payload={p_customer_name:customer_name,p_vehicle:vehicle,p_lender_name:document.getElementById('dlender').value.trim(),p_approval_status:document.getElementById('dapproval').value,p_delivery_at:delivery_at,p_salesperson_id:salesperson_id,p_fsm_notes:document.getElementById('dnotes').value.trim(),p_requirements:draftRequirements.map(({kind,label,amount})=>({kind,label,amount}))};const {error}=await sb.rpc('create_delivery_with_requirements',payload);if(error)return toast('Delivery not created',error.message);draftRequirements=[];closeSheet();await refresh();toast('Delivery created','The assigned salesperson now has a live delivery record.')}
function showAddRequirement(deliveryId){const options=state.templates.filter(t=>t.active).map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join('');sheet('<h2>Add Delivery Requirement</h2><label>Choose from library<select id="reqtemplate"><option value="">Custom requirement</option>'+options+'</select></label><label>Requirement label<input class="input" id="reqlabel"></label><label>Amount (optional)<input class="input" id="reqamount" type="number" min="0" step="0.01"></label><button class="btn" onclick="saveRequirement(\''+deliveryId+'\')">Add requirement</button>')}
async function saveRequirement(deliveryId){const template=state.templates.find(t=>t.id===document.getElementById('reqtemplate').value);const label=(document.getElementById('reqlabel').value.trim()||template?.label||'').trim();if(!label)return toast('Requirement needed','Choose or enter a requirement.');const kind=template?.kind||'custom';const amount=document.getElementById('reqamount').value||null;const {error}=await sb.from('delivery_requirements').insert({delivery_id:deliveryId,kind,label,amount});if(error)return toast('Unable to add requirement',error.message);closeSheet();await refresh();openDelivery(deliveryId)}
function libraryScreen(){const rows=state.templates.map(t=>'<div class="listitem row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category)+' · '+esc(t.kind)+' · '+(t.active?'Active':'Inactive')+'</div></div>'+(canEditLibrary()?'<button class="btn secondary small" onclick="editTemplate(\''+t.id+'\')">Edit</button>':'')+'</div>').join('');return '<button class="btn ghost small" onclick="go(\'home\')">← Back</button><div class="sectionhead"><div><div class="eyebrow">Reusable requirements</div><h1>Requirement Library</h1></div>'+(canEditLibrary()?'<button class="btn" onclick="newTemplate()">＋ Add</button>':'')+'</div><p class="muted" style="margin-top:6px">Master controls which FSM users can edit this library.</p><div class="card">'+(rows||'<div class="empty">No templates yet.</div>')+'</div>'}
function newTemplate(){templateSheet(null)}
function editTemplate(id){templateSheet(state.templates.find(t=>t.id===id))}
function templateSheet(t){sheet('<h2>'+ (t?'Edit':'Add') +' Requirement</h2><label>Label<input class="input" id="tpllabel" value="'+esc(t?.label||'')+'"></label><label>Category<select id="tplcategory"><option value="customer_documents" '+(t?.category==='customer_documents'?'selected':'')+'>Customer Documents</option><option value="financial" '+(t?.category==='financial'?'selected':'')+'>Financial</option><option value="custom" '+(t?.category==='custom'?'selected':'')+'>Custom</option></select></label><label>Type<select id="tplkind"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund</option></select></label><label>Active<select id="tplactive"><option value="true" '+(t?.active!==false?'selected':'')+'>Active</option><option value="false" '+(t?.active===false?'selected':'')+'>Inactive</option></select></label><button class="btn" onclick="saveTemplate('+JSON.stringify(t?.id||null)+')">Save requirement</button>');document.getElementById('tplkind').value=t?.kind||'custom'}
async function saveTemplate(id){const row={dealership_id:state.profile.dealership_id,label:document.getElementById('tpllabel').value.trim(),category:document.getElementById('tplcategory').value,kind:document.getElementById('tplkind').value,active:document.getElementById('tplactive').value==='true',updated_at:new Date().toISOString()};if(!row.label)return toast('Label required','Enter a requirement name.');const r=id?await sb.from('requirement_templates').update(row).eq('id',id):await sb.from('requirement_templates').insert({...row,created_by:state.profile.id});if(r.error)return toast('Unable to save requirement',r.error.message);closeSheet();await loadTemplates();render()}
function teamScreen(){if(!isMaster())return homeScreen();const rows=state.team.filter(p=>p.id!==state.profile.id).map(p=>'<div class="listitem"><div class="row"><div><b>'+esc(p.full_name||'Unnamed user')+'</b><div class="muted">'+esc(p.role)+' · '+(p.active?'Active':'Inactive')+'</div></div><button class="btn secondary small" onclick="toggleTeamUser(\''+p.id+'\','+(p.active?'false':'true')+')">'+(p.active?'Deactivate':'Activate')+'</button></div>'+(p.role==='fsm'?'<div class="row" style="margin-top:9px"><span class="muted">Can manage requirement library</span><button class="btn ghost small" onclick="toggleFSMPermission(\''+p.id+'\')">Set authority</button></div>':'')+'</div>').join('');return '<div class="sectionhead"><div><div class="eyebrow">Master authority</div><h1>Team Management</h1></div><button class="btn" onclick="showInvite()">＋ Invite</button></div><p class="muted" style="margin-top:6px">Create single-use FSM and Salesperson invitations and manage active access.</p><div class="card">'+(rows||'<div class="empty">No team members yet.</div>')+'</div><div class="card"><h2>Requirement authority</h2><p class="muted" style="margin-top:5px">Only the Master decides which FSM users can add, edit or update reusable delivery requirements.</p></div>'}
async function showInvite(){sheet('<h2>Create team invitation</h2><p class="muted" style="margin:6px 0 15px">The invitation assigns the role. Users cannot self-elevate.</p><label>Access level<select id="invrole"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn" onclick="createInvite()">Generate single-use code</button><div id="inviteResult"></div>')}
async function createInvite(){const role=document.getElementById('invrole').value;const {data,error}=await sb.rpc('create_team_invite',{p_role:role});if(error)return toast('Unable to create invite',error.message);document.getElementById('inviteResult').innerHTML='<div class="card"><div class="eyebrow">'+esc(role)+' invitation</div><h2 style="letter-spacing:.14em">'+esc(data)+'</h2><p class="muted" style="margin-top:7px">Give this single-use code to the intended team member.</p></div>'}
async function toggleTeamUser(id,val){const {error}=await sb.rpc('set_team_member_active',{p_user_id:id,p_active:val});if(error)return toast('Unable to update user',error.message);await loadTeam();render()}
async function toggleFSMPermission(id){const {data}=await sb.from('fsm_permissions').select('can_manage_requirement_library').eq('user_id',id).maybeSingle();const next=!data?.can_manage_requirement_library;const {error}=await sb.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:next});if(error)return toast('Unable to update FSM authority',error.message);toast('FSM authority updated',next?'Requirement library access granted.':'Requirement library access removed.')}
function notificationScreen(){const rows=state.notifications.map(n=>'<div class="listitem"><b>'+esc(n.title)+'</b><div class="muted" style="margin-top:4px">'+esc(n.body)+'</div><div class="muted" style="font-size:11px;margin-top:6px">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join('');return '<div class="sectionhead"><div><div class="eyebrow">Live updates</div><h1>Notifications</h1></div><button class="btn secondary small" onclick="requestNotifications()">Enable device alerts</button></div><div class="card">'+(rows||'<div class="empty">No notifications yet.</div>')+'</div><p class="muted" style="font-size:12px">In-app alerts update in real time. Browser notifications are used when supported and permitted by the device.</p>'}
async function requestNotifications(){if(!('Notification'in window))return toast('Not supported','This browser does not support web notifications.');const p=await Notification.requestPermission();toast('Notification permission',p==='granted'?'Enabled on this device.':p)}
function accountScreen(){return '<div class="eyebrow">Account</div><h1>'+esc(state.profile.full_name)+'</h1><div class="card"><div class="row"><div><h2>'+esc(state.profile.role)+'</h2><p class="muted">Active dealership access</p></div><span class="badge">Active</span></div></div><button class="btn danger" onclick="signOut()">Sign out</button>'}
function sheet(html){closeSheet();const m=document.createElement('div');m.id='sheet';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">Close</button><div style="height:12px"></div>'+html+'</section>';document.body.appendChild(m)}
function closeSheet(){document.getElementById('sheet')?.remove()}
function go(x){state.active=x;render()}
async function refresh(preserve=false){const current=state.active;await loadAll();state.active=current;if(current.startsWith('delivery:'))openDelivery(current.slice(9));else render()}
function subscribe(){if(state.channel)return;state.channel=sb.channel('axiom-deliveries-'+state.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await loadDeliveries();if(state.active.startsWith('delivery:'))openDelivery(state.active.slice(9));else if(state.active==='deliveries')render()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await loadDeliveries();if(state.active.startsWith('delivery:'))openDelivery(state.active.slice(9));else if(state.active==='deliveries')render()}).subscribe();state.notificationChannel=sb.channel('axiom-notifications-'+state.profile.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+state.profile.id},payload=>{const n=payload.new;state.notifications.unshift(n);toast(n.title,n.body);if('Notification'in window&&Notification.permission==='granted')new Notification(n.title,{body:n.body,icon:'./icon.svg'});if(state.active==='notifications')render()}).subscribe()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
init();
</script></body></html>
