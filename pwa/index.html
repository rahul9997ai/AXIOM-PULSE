<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c"><link rel="manifest" href="./manifest.webmanifest"><title>AXIOM Pulse</title><style>:root{--bg:#06101c;--panel:#102238;--line:#2e4968;--text:#f5f7fb;--muted:#9eb2ca;--blue:#4d9df7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#12304f 0,#081624 48%,#040b13 100%);color:var(--text);font-family:Inter,system-ui,sans-serif}.page{min-height:100dvh;display:grid;place-items:center;padding:18px}.wrap{width:min(920px,100%)}.brand{text-align:center;position:relative;min-height:310px;display:grid;place-items:center;overflow:hidden}.ecg{position:absolute;left:0;right:0;top:42%;height:100px}.ecg svg{width:100%;height:100%}.ecg path{fill:none;stroke:#3d95e7;stroke-width:2.8;filter:drop-shadow(0 0 7px #4aa7ff)}.logo{position:relative;z-index:2;display:flex;justify-content:center;align-items:baseline;gap:14px}.a{font-size:70px;font-weight:950;letter-spacing:.1em}.p{font-size:62px;font-style:italic;font-weight:850;color:#59a6fb;text-shadow:0 0 20px #3488f077}.meaning{position:relative;z-index:2;margin-top:34px;color:#7cafdb;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:700}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive}.tag{position:relative;z-index:2;margin-top:8px;color:#cad4df}.card{max-width:520px;margin:-5px auto 0;background:linear-gradient(145deg,#12263d,#0d1c2d);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px #0007}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#a8bad0}.input,select{width:100%;margin-top:6px;padding:13px;border-radius:13px;border:1px solid #315372;background:#081624;color:#fff}.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:#06111c;font-weight:850;width:100%;margin-top:10px}.btn.secondary{background:#152c44;color:#eef5ff;border:1px solid #385a79}.msg{min-height:20px;color:#9eb2ca;margin-top:9px}.app{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101c)}.head{position:sticky;top:0;z-index:4;background:#101f31f2;border-bottom:1px solid var(--line);padding:12px 16px}.headrow{display:flex;align-items:baseline;gap:8px}.headrow b{font-size:24px;letter-spacing:.18em}.headrow i{font-size:22px;color:#5fa9ff}.hmeta{font-size:8px;letter-spacing:.13em;color:#79aadb;text-transform:uppercase;margin-top:5px}.hby{font:italic 14px "Segoe Script","Brush Script MT",cursive}.htag{font-size:10px;color:#bdcad9}.main{max-width:1100px;margin:auto;padding:18px 16px 90px}.bar{padding:9px;border:1px solid #806b38;background:#3c301b;color:#ffe0a0;border-radius:12px;text-align:center;font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.panel{background:linear-gradient(145deg,#12263d,#0d1c2d);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:10px}.item{padding:13px;border-bottom:1px solid #22394f}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#92a8c0;font-size:10px}.hidden{display:none!important}@media(max-width:560px){.a{font-size:43px}.p{font-size:39px}.brand{min-height:275px}.meaning{font-size:8px}.by{font-size:17px}.tag{font-size:13px}.grid{gap:7px}.stat{padding:10px}}
</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://xjahoajimgdyuwxdjakw.supabase.co',KEY='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),R=document.getElementById('root');let S={profile:null,session:null,mode:'master',view:'home',deliveries:[],team:[]};const e=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const role=()=>S.mode==='master'?S.profile?.role:S.mode;const master=()=>S.profile?.role==='master';const demo=()=>[{id:'demo',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',status:'scheduled',delivery_at:new Date(Date.now()+86400000).toISOString(),delivery_requirements:[{id:'r1',label:'Void cheque',completed:false},{id:'r2',label:'Trade ownership',completed:true},{id:'r3',label:'Trade release form',completed:false},{id:'r4',label:'$500 due on delivery',completed:false}]}];function brand(){return '<div class="brand"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="a">AXIOM</span><span class="p">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}function login(msg=''){R.innerHTML='<main class="page"><section class="wrap">'+brand()+'<div class="card"><h2>Secure Sign In</h2><div class="msg" id="msg">'+e(msg)+'</div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="pass" class="input" type="password" autocomplete="current-password"></label></div><button class="btn" onclick="signin()">SIGN IN</button><button class="btn secondary" onclick="joinPage()">JOIN WITH INVITATION</button></div></section></main>'}async function signin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password)return document.getElementById('msg').textContent='Enter your email and password.';const{data,error}=await db.auth.signInWithPassword({email,password});if(error)return document.getElementById('msg').textContent=error.message;await authenticate(data.session)}async function authenticate(session){const{data,error}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!data)return db.auth.signOut().then(()=>login(error?.message||'This account is not authorized for AXIOM PULSE.'));if(!data.active)return db.auth.signOut().then(()=>login('This AXIOM PULSE account is inactive.'));S.profile=data;S.session=session;S.mode='master';await load();app()}function joinPage(){R.innerHTML='<main class="page"><section class="wrap">'+brand()+'<div class="card"><h2>Join AXIOM PULSE</h2><p class="msg">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn" onclick="join()">CREATE ACCOUNT</button><button class="btn secondary" onclick="login()">BACK TO SIGN IN</button><div id="jm" class="msg"></div></div></section></main>'}async function join(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),em=document.getElementById('je').value.trim().toLowerCase(),pw=document.getElementById('jp').value;if(!n||!c||!em||pw.length<6)return document.getElementById('jm').textContent='Complete every field. Password must be at least 6 characters.';const r=await db.functions.invoke('create-invited-user',{body:{full_name:n,email:em,password:pw,invite_code:c}});if(r.error)return document.getElementById('jm').textContent=r.error.message;if(r.data?.error)return document.getElementById('jm').textContent=r.data.error;const s=await db.auth.signInWithPassword({email:em,password:pw});if(s.error)return document.getElementById('jm').textContent='Account created. Sign in with your new credentials.';await authenticate(s.data.session)}async function load(){if(S.mode!=='master'){S.deliveries=demo();return}const q=S.profile.role==='salesperson'?db.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',S.profile.id):db.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',S.profile.dealership_id);const[r,t]=await Promise.all([q,master()?db.rpc('get_team_members'):Promise.resolve({data:[]})]);S.deliveries=r.data||[];S.team=t.data||[]}function app(){const active=S.deliveries.filter(d=>d.status!=='delivered'),out=active.flatMap(d=>d.delivery_requirements||[]).filter(x=>!x.completed&&!x.exception_reason).length;let body='<div class="app"><header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header><main class="main">'+(S.mode!=='master'?'<div class="bar">TEST '+S.mode.toUpperCase()+' MODE · Master session preserved</div>':'')+'<div class="row"><div><div class="eyebrow">'+e(role()).toUpperCase()+' ACCESS</div><h1>'+e(master()&&!S.mode.match(/fsm|salesperson/)?'Master Control Center':role()==='fsm'?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="msg">Welcome, '+e(S.profile.full_name)+'.</p></div></div><div class="grid"><div class="stat"><b>'+active.length+'</b>Active</div><div class="stat"><b>'+active.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b>Today</div><div class="stat"><b>'+out+'</b>Outstanding</div></div><div class="panel"><h2>Delivery source of truth</h2><p class="msg">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(master()&&S.mode==='master'?'<div class="panel"><h2>Master Control</h2><p class="msg">Your Master authority remains intact. Test each operational role without changing your real role.</p><button class="btn" onclick="enter(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enter(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn secondary" onclick="go(\'team\')">MANAGE USERS</button></div>':'')+(S.mode!=='master'?'<div class="panel"><h2>Return to Master</h2><button class="btn secondary" onclick="exitTest()">RETURN TO MASTER</button></div>':'')+'</main><nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav></div>';R.innerHTML=body}function deliveries(){R.innerHTML='<div class="app"><header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header><main class="main"><button class="btn secondary" onclick="go(\'home\')">← BACK</button>'+S.deliveries.map(d=>'<div class="panel"><div class="row"><div><h2>'+e(d.customer_name)+'</h2><div class="msg">'+e(d.vehicle)+'</div></div><span>'+e(d.status)+'</span></div><div class="msg">'+new Date(d.delivery_at).toLocaleString()+'</div><button class="btn" onclick="openD(\''+d.id+'\')">OPEN</button></div>').join('')+'</main><nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav></div>'}function openD(id){const d=S.deliveries.find(x=>x.id===id);if(!d)return;R.innerHTML='<div class="app"><header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header><main class="main"><button class="btn secondary" onclick="go(\'deliveries\')">← BACK</button><div class="panel"><h1>'+e(d.customer_name)+'</h1><div class="msg">'+e(d.vehicle)+'</div></div><div class="panel"><h2>Delivery Requirements</h2>'+(d.delivery_requirements||[]).map(r=>'<div class="item"><div class="row"><b>'+e(r.label)+'</b><span>'+((r.completed||r.exception_reason)?'Resolved':'Outstanding')+'</span></div>'+(role()==='salesperson'&&!r.completed?'<button class="btn secondary" onclick="completeReq(\''+d.id+'\',\''+r.id+'\')">COMPLETE</button>':'')+'</div>').join('')+'</div></main><nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav></div>'}function completeReq(did,rid){const d=S.deliveries.find(x=>x.id===did),r=d.delivery_requirements.find(x=>x.id===rid);if(S.mode==='salesperson'){r.completed=true;toast('Requirement completed — TEST MODE simulates the FSM live notification.')}else{}openD(did)}function toast(x){const n=document.createElement('div');n.className='bar';n.textContent=x;R.prepend(n);setTimeout(()=>n.remove(),3500)}function enter(r){if(!master()||S.mode!=='master')return;S.mode=r;demo();app()}function exitTest(){S.mode='master';load().then(app)}function go(v){S.view=v;if(v==='deliveries')deliveries();else if(v==='account')account();else if(v==='team')team();else app()}function account(){R.innerHTML='<div class="app"><header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header><main class="main"><h1>'+e(S.profile.full_name)+'</h1><div class="panel"><h2>'+e(role())+'</h2><p class="msg">'+(S.mode==='master'?'Master session':'Simulated authority test')+'</p></div><button class="btn" onclick="signOut()">SIGN OUT</button></main><nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav></div>'}function team(){if(!master()||S.mode!=='master')return toast('Return to Master to manage users.');R.innerHTML='<div class="app"><header class="head"><div class="headrow"><b>AXIOM</b><i>Pulse</i></div><div class="hmeta">AI eXecutive Intelligence &amp; Operations Management</div><div class="hby">by Rahul Champaneri</div><div class="htag">The Pulse of Every Delivery</div></header><main class="main"><button class="btn secondary" onclick="go(\'home\')">← BACK</button><h1>Master User Control</h1><div class="panel">'+(S.team.length?S.team.map(x=>'<div class="item"><div class="row"><div><b>'+e(x.full_name||'Unnamed')+'</b><div class="msg">'+e(x.role)+' · '+(x.active?'Active':'Inactive')+'</div></div></div></div>').join(''):'<div class="msg">No team members.</div>')+'</div></main><nav class="nav"><button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">◫<br>Deliveries</button><button onclick="go(\'account\')">◌<br>Account</button></nav></div>'}async function signOut(){await db.auth.signOut();S.profile=null;S.session=null;S.mode='master';S.deliveries=[];login()}async function boot(){const{data:{session}}=await db.auth.getSession();if(session)await authenticate(session);else login()}boot();</script></body></html>
