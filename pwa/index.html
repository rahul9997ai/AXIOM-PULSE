<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06101c;--panel:#102238;--panel2:#142a43;--line:#2e4968;--text:#f5f7fb;--muted:#9eb2ca;--blue:#4d9df7;--green:#30d58d;--amber:#f4b74a;--red:#f06473}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.splash,.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 28%,#123052 0,#081624 40%,#040b13 90%)}
.shell{width:min(980px,100%)}.brand-lockup{position:relative;text-align:center;min-height:340px;display:grid;place-items:center;overflow:hidden}.brand-wave{position:absolute;inset:25% 0 auto;height:115px;opacity:.95}.brand-wave svg{width:100%;height:100%}.brand-wave path{fill:none;stroke:#398edc;stroke-width:2.5;filter:drop-shadow(0 0 6px #4da5ff)}
.brand-row{display:flex;justify-content:center;align-items:baseline;gap:15px;position:relative;z-index:2}.axiom{font-size:69px;font-weight:950;letter-spacing:.1em}.pulse{font-size:61px;font-style:italic;font-weight:850;color:#59a5fb;text-shadow:0 0 18px #2f83ef66}
.meaning{position:relative;z-index:2;margin-top:34px;font-size:10px;letter-spacing:.15em;color:#78add9;text-transform:uppercase;font-weight:700}.by{position:relative;z-index:2;margin-top:7px;font:italic 22px "Segoe Script","Brush Script MT",cursive}.tag{position:relative;z-index:2;margin-top:9px;color:#cad4df;font-size:15px}
.card{background:linear-gradient(145deg,#12263d,#0d1c2d);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 20px 65px #0006;margin:12px 0}.auth-card{width:min(520px,100%);margin:-20px auto 0}.auth-card h1,.auth-card h2,.auth-card h3{margin:0}.muted{color:var(--muted)}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#a6b9cf}.input,select,textarea{width:100%;margin-top:6px;padding:13px;border-radius:13px;border:1px solid #315372;background:#081624;color:white}textarea{min-height:92px}.actions{display:grid;gap:9px;margin-top:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:17px;background:#0a1725}.stat b{display:block;font-size:24px}.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#06111d;font-weight:850}.btn.secondary{background:var(--panel2);color:#eaf3ff;border:1px solid #355575}.btn.ghost{background:transparent;color:#dce9f7;border:1px solid #355575}.btn.danger{background:#52232d;color:#ffdce2;border:1px solid #7b3744}.btn.small{padding:9px 12px;font-size:12px}.full{width:100%}
.app{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101c)}.app-head{position:sticky;top:0;z-index:30;background:#101f31f2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 17px}.app-brand{display:flex;align-items:baseline;gap:9px}.app-brand .a{font-size:25px;font-weight:950;letter-spacing:.18em}.app-brand .p{font-size:23px;font-style:italic;font-weight:850;color:#5fa9ff}.app-brand .line{height:1px;flex:1;background:#385674}.meta{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#79aadb;margin-top:5px}.appby{font:italic 14px "Segoe Script","Brush Script MT",cursive}.apptag{font-size:10px;color:#bdcad9}.main{max-width:1120px;margin:auto;padding:18px 15px 98px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#74aef2;margin-bottom:6px}.list{display:grid;gap:10px}.listitem{padding:13px 0;border-bottom:1px solid #21384f}.listitem:last-child{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;background:#193d33;color:#93f1bf}.out{background:#4a232a;color:#ffbdc7}.warn{background:#4b3a1d;color:#ffda8e}.tap{cursor:pointer}.req{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #21384f}.req:last-child{border-bottom:0}.check{width:24px;height:24px;border-radius:8px;background:#0a1726;border:1px solid #416383;display:grid;place-items:center;flex:0 0 auto}.done{background:#1b7b58;border-color:#37d596}.exc{background:#7a303b;border-color:#ff7888}.reqbody{flex:1}.reqactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:19px}.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#91a5bd;font-size:10px;min-width:65px}.nav button.active{color:white}.nav b{display:block;font-size:21px;margin-bottom:3px}.notice{position:fixed;z-index:90;left:12px;right:12px;top:12px;background:#143852;border:1px solid #4d9fff;border-radius:16px;padding:13px;box-shadow:0 15px 45px #0009}.modal{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:end center}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#102238;border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.testbar{margin:-6px 0 12px;padding:9px;border:1px solid #806a38;background:#3d311b;color:#ffe0a0;border-radius:12px;text-align:center;font-size:12px}
@media(max-width:560px){.axiom{font-size:43px}.pulse{font-size:39px}.brand-lockup{min-height:285px}.brand-wave{top:24%}.meaning{font-size:8px;letter-spacing:.08em}.by{font-size:17px}.tag{font-size:13px}.grid{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.app-brand .a{font-size:23px}.app-brand .p{font-size:21px}}
</style>
</head>
<body><div id="root"></div>
<script>
const SUPABASE_URL="https://xjahoajimgdyuwxdjakw.supabase.co";const SUPABASE_KEY="sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const root=document.getElementById('root');const state={profile:null,session:null,role:null,testRole:null,screen:'home',deliveries:[],templates:[],notifications:[],team:[],channel:null,notificationChannel:null};const role=()=>state.testRole||state.profile?.role;const isMaster=()=>role()==='master',isFSM=()=>role()==='fsm',isSales=()=>role()==='salesperson',isTest=()=>!!state.testRole;const esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n));function brand(){return '<div class="brand-lockup"><div class="brand-wave"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 76 113 48 124 108 136 26 148 76H240L256 76 270 55 284 99 298 76H620L634 76 648 56 662 112 678 31 694 76H728L742 55 757 99 772 68 787 87 802 76H900"/></svg></div><div><div class="brand-row"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}function renderLogin(msg=''){root.innerHTML='<main class="login"><section class="shell"><div class="auth-card"><div class="card">'+brand()+'<h2>Secure Sign In</h2><p class="muted" style="margin-top:5px">Authorized AXIOM PULSE access.</p><div id="authmsg" class="muted" style="margin-top:9px">'+esc(msg)+'</div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="password" class="input" type="password" autocomplete="current-password"></label></div><div class="actions"><button class="btn full" onclick="signIn()">SIGN IN</button><button class="btn secondary full" onclick="renderJoin()">JOIN WITH INVITATION</button></div><div class="muted" style="font-size:11px;text-align:center;margin-top:10px">Your role is assigned securely by AXIOM PULSE. It cannot be self-elevated.</div></div></div></section></main>'}async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return document.getElementById('authmsg').textContent='Enter your email and password.';const{data,error}=await db.auth.signInWithPassword({email:e,password:p});if(error)return document.getElementById('authmsg').textContent=error.message;await authenticate(data.session)}async function authenticate(session){state.session=session;const{data,error}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!data){await db.auth.signOut();return renderLogin(error?.message||'This account is not authorized for AXIOM PULSE.')}if(!data.active){await db.auth.signOut();return renderLogin('This AXIOM PULSE account is inactive.')}state.profile=data;state.role=data.role;await loadLive();subscribe();renderApp()}function renderJoin(){root.innerHTML='<main class="login"><section class="shell"><div class="auth-card"><div class="card">'+brand()+'<button class="btn ghost small" onclick="renderLogin()">← BACK TO SIGN IN</button><h2 style="margin-top:14px">Join AXIOM PULSE</h2><p class="muted" style="margin-top:5px">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn full" style="margin-top:14px" onclick="joinAccount()">CREATE ACCOUNT</button><div id="jm" class="muted" style="font-size:12px;text-align:center;margin-top:9px"></div></div></div></section></main>'}async function joinAccount(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6)return document.getElementById('jm').textContent='Please complete every field. Password must be at least 6 characters.';localStorage.setItem('axiom_pending_invite',JSON.stringify({full_name:n,code:c}));const{data,error}=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(error)return document.getElementById('jm').textContent=error.message;if(data.session){const r=await db.rpc('accept_team_invite',{p_code:c,p_full_name:n});if(r.error)return document.getElementById('jm').textContent=r.error.message;localStorage.removeItem('axiom_pending_invite');await authenticate(data.session)}else renderLogin('Check your email to verify your account, then sign in to complete authorized onboarding.')}async function loadLive(){if(isTest()){return demoData()}const q=isSales()?db.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',state.profile.id).order('delivery_at'):db.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',state.profile.dealership_id).order('delivery_at');const[d,t,n]=await Promise.all([q,db.from('requirement_templates').select('*').eq('dealership_id',state.profile.dealership_id).order('sort_order').order('label'),db.from('notification_history').select('*').eq('user_id',state.profile.id).order('sent_at',{ascending:false}).limit(50)]);state.deliveries=d.data||[];state.templates=t.data||[];state.notifications=n.data||[];if(isMaster()){const x=await db.rpc('get_team_members');state.team=x.data||[]}}function demoData(){state.deliveries=[{id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and signed trade release.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false,exception_reason:null},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true,exception_reason:null},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false,exception_reason:null},{id:'r4',label:'$500 due on delivery',kind:'money_collect',completed:false,exception_reason:null,amount:500}]}];state.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}]}function appBrand(){return '<header class="app-head"><div class="app-brand"><span class="a">AXIOM</span><span class="p">Pulse</span><span class="line"></span></div><div class="meta">AI eXecutive Intelligence &amp; Operations Management</div><div class="appby">by Rahul Champaneri</div><div class="apptag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button class="'+(state.screen==='home'?'active':'')+'" onclick="go(\'home\')"><b>⌂</b>Home</button><button class="'+(state.screen==='deliveries'?'active':'')+'" onclick="go(\'deliveries\')"><b>◫</b>Deliveries</button><button class="'+(state.screen==='notifications'?'active':'')+'" onclick="go(\'notifications\')"><b>◉</b>Alerts</button>'+(isMaster()&&!isTest()?'<button class="'+(state.screen==='team'?'active':'')+'" onclick="go(\'team\')"><b>♙</b>Team</button>':'')+'<button class="'+(state.screen==='account'?'active':'')+'" onclick="go(\'account\')"><b>◌</b>Account</button></nav>'}function renderApp(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main">'+(isTest()?'<div class="testbar">TEST '+state.testRole.toUpperCase()+' MODE · Master session preserved · changes are simulated locally</div>':'')+screenHtml()+'</main>'+nav()+'</div>'}function screenHtml(){if(state.screen==='deliveries')return deliveryList();if(state.screen==='notifications')return notificationScreen();if(state.screen==='team')return teamScreen();if(state.screen==='library')return libraryScreen();if(state.screen.startsWith('delivery:'))return deliveryDetail(state.screen.slice(9));if(state.screen==='account')return accountScreen();return homeScreen()}function homeScreen(){const active=state.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled'),out=active.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="eyebrow">'+esc(role().toUpperCase())+' ACCESS</div><h1>'+ (isMaster()&&!isTest()?'Master Control Center':isFSM()?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted" style="margin-top:5px">Welcome, '+esc(state.profile?.full_name||'Test User')+'.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>'+active.length+'</b><span class="muted">Active</span></div><div class="stat"><b>'+active.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b><span class="muted">Today</span></div><div class="stat"><b>'+out+'</b><span class="muted">Outstanding</span></div></div><div class="card"><h2>The delivery is the record</h2><p class="muted" style="margin-top:5px">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" style="margin-top:12px" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></div>'+(isMaster()&&!isTest()?'<div class="card"><h2>Authority Testing</h2><p class="muted" style="margin:5px 0 12px">Use your Master session to test the operational experience without changing the database role.</p><div class="actions"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn ghost" onclick="go(\'library\')">OPEN REQUIREMENT LIBRARY</button></div></div>':'')}'}function deliveryList(){return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div>'+((isFSM()||isMaster())?'<button class="btn" onclick="showCreate()">＋ CREATE</button>':'')+'</div><div class="list" style="margin-top:12px">'+state.deliveries.map(d=>{const rs=d.delivery_requirements||[],done=rs.filter(r=>r.completed||r.exception_reason).length;return '<article class="card tap" onclick="openDelivery(\''+d.id+'\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><p class="muted" style="margin-top:3px">'+esc(d.vehicle)+'</p></div><span class="badge '+(d.status==='delivered'?'':'out')+'">'+esc(d.status)+'</span></div><div class="row" style="margin-top:12px"><span class="muted">'+fmt(d.delivery_at)+'</span><span class="muted">'+done+'/'+rs.length+' resolved</span></div></article>'}).join('')||'<div class="card muted">No deliveries yet.</div></div>'}function fmt(v){return new Date(v).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function openDelivery(id){state.screen='delivery:'+id;renderApp()}function deliveryDetail(id){const d=state.deliveries.find(x=>x.id===id);if(!d)return '<div class="card">Delivery not found.</div>';const rs=d.delivery_requirements||[];const reqs=rs.map(r=>{const resolved=r.completed||r.exception_reason;return '<div class="req"><span class="check '+(r.completed?'done':r.exception_reason?'exc':'')+'">'+(r.completed?'✓':r.exception_reason?'!':'')+'</span><div class="reqbody"><b>'+esc(r.label)+'</b><div class="muted" style="margin-top:3px">'+esc(r.kind||'custom')+(r.amount?' · '+money(r.amount):'')+'</div>'+(r.completed?'<span class="badge" style="margin-top:7px">COMPLETED</span>':r.exception_reason?'<span class="badge out" style="margin-top:7px">EXCEPTION · '+esc(r.exception_reason)+'</span>':'<span class="badge warn" style="margin-top:7px">OUTSTANDING</span>')+(isSales()&&!resolved?'<div class="reqactions" style="margin-top:8px"><button class="btn secondary small" onclick="completeRequirement(\''+d.id+'\',\''+r.id+'\')">COMPLETE</button><button class="btn danger small" onclick="exceptionRequirement(\''+d.id+'\',\''+r.id+'\')">EXCEPTION</button></div>':'')+'</div></div>'}).join('');const out=rs.filter(r=>!r.completed&&!r.exception_reason);return '<button class="btn ghost small" onclick="go(\'deliveries\')">← ALL DELIVERIES</button><div class="card"><div class="eyebrow">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><p class="muted" style="margin-top:4px">'+esc(d.vehicle)+'</p><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted">DATE</span><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleDateString()+'</b></div><div class="stat"><span class="muted">TIME</span><b style="font-size:15px">'+new Date(d.delivery_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</b></div><div class="stat"><span class="muted">APPROVAL</span><b style="font-size:15px">'+esc(d.approval_status||'Approved')+'</b></div></div><p class="muted" style="margin-top:12px">Lender / Lessor: '+esc(d.lender_name||'—')+'</p>'+(d.fsm_notes?'<div class="card"><div class="eyebrow">FSM INSTRUCTION</div>'+esc(d.fsm_notes)+'</div>':'')+'</div><div class="sectionhead"><h2>Delivery Requirements</h2>'+((isFSM()||isMaster())?'<button class="btn secondary small" onclick="showAddRequirement(\''+d.id+'\')">＋ ADD</button>':'')+'</div><div class="card">'+reqs||'<div class="muted">No requirements yet.</div></div>'+ (isSales()?'<div class="card"><h2>Delivery Completion</h2><p class="muted" style="margin:6px 0 12px">'+(out.length?'⚠️ '+out.length+' requirement(s) outstanding.':'All requirements resolved.')+'</p><button class="btn full" '+(out.length?'disabled':'')+' onclick="completeDelivery(\''+d.id+'\')">COMPLETE DELIVERY</button></div>':'') }function exceptionRequirement(did,rid){sheet('<h2>Mark as exception</h2><p class="muted" style="margin:5px 0 12px">The reason becomes part of the delivery record.</p><textarea id="exReason" placeholder="Explain why the requirement could not be completed."></textarea><button class="btn danger full" style="margin-top:12px" onclick="saveException(\''+did+'\',\''+rid+'\')">RECORD EXCEPTION</button>')}async function saveException(did,rid){const reason=document.getElementById('exReason').value.trim();if(!reason)return toast('Reason required','Provide the exception reason.');if(isTest()){const r=state.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.completed=false;r.exception_reason=reason;closeSheet();toast('Exception recorded','TEST MODE — simulated FSM update.');return renderApp()}const{error}=await db.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:state.profile.id}).eq('id',rid);if(error)return toast('Unable to record',error.message);closeSheet();await loadLive();renderApp()}async function completeRequirement(did,rid){if(isTest()){const r=state.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.completed=true;r.exception_reason=null;toast('Requirement completed','TEST MODE — simulated FSM notification.');return renderApp()}const{error}=await db.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:state.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',rid);if(error)return toast('Unable to complete',error.message);await loadLive();toast('Requirement completed','The related FSM receives the real-time update.');renderApp()}function showCreate(){toast('Next step','Use the Master/FSM delivery workflow after role test selection.')}function showAddRequirement(id){sheet('<h2>Add Delivery Requirement</h2><div class="field"><label>Requirement<select id="ar" class="input"><option value="">Custom requirement</option>'+S.templates.map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join('')+'</select></label></div><div class="field"><label>Label<input id="al" class="input" placeholder="Requirement or instruction"></label></div><div class="field"><label>Amount (optional)<input id="aa" class="input" type="number" min="0" step="0.01"></label></div><button class="btn full" style="margin-top:14px" onclick="saveAdd(\''+id+'\')">ADD REQUIREMENT</button>')}async function saveAdd(id){const t=S.templates.find(x=>x.id===document.getElementById('ar').value),label=(document.getElementById('al').value.trim()||t?.label||'').trim(),amount=document.getElementById('aa').value||null;if(!label)return toast('Requirement needed','Choose or enter a requirement.');if(isTest()){state.deliveries.find(d=>d.id===id).delivery_requirements.push({id:'r'+Date.now(),label,kind:t?.kind||'custom',amount,completed:false});closeSheet();toast('New instruction added','TEST MODE — simulated salesperson update.');return renderApp()}const{error}=await db.from('delivery_requirements').insert({delivery_id:id,kind:t?.kind||'custom',label,amount});if(error)return toast('Unable to add',error.message);closeSheet();await loadLive();openDelivery(id)}function libraryScreen(){if(!isFSM()&&!isMaster())return '<div class="card">Requirement Library administration is restricted to Master and authorized FSM users.</div>';const can=isMaster()||state.profile?.can_manage_requirement_library||isTest();return '<button class="btn ghost small" onclick="go(\'home\')">← BACK</button><div class="sectionhead"><div><div class="eyebrow">Reusable Requirements</div><h1>Requirement Library</h1></div>'+(can?'<button class="btn" onclick="newTemplate()">＋ ADD</button>':'')+'</div><div class="card">'+state.templates.map(t=>'<div class="listitem row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category||'Custom')+' · '+esc(t.kind)+'</div></div>'+(can?'<button class="btn secondary small" onclick="editTemplate(\''+t.id+'\')">EDIT</button>':'')+'</div>').join('')+'</div>'}function newTemplate(){sheet('<h2>Add Requirement</h2><div class="field"><label>Name<input id="tn" class="input"></label></div><div class="field"><label>Category<select id="tc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Insurance</option><option>Other</option></select></label></div><div class="field"><label>Type<select id="tk" class="input"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select></label></div><button class="btn full" style="margin-top:14px" onclick="saveTemplate()">SAVE</button>')}function editTemplate(id){const t=S.templates.find(x=>x.id===id);sheet('<h2>Edit Requirement</h2><div class="field"><label>Name<input id="tn" class="input" value="'+esc(t.label)+'"></label></div><div class="field"><label>Category<select id="tc" class="input"><option '+(t.category==='Customer Documents'?'selected':'')+'>Customer Documents</option><option '+(t.category==='Financial'?'selected':'')+'>Financial</option><option '+(t.category==='Vehicle / Trade'?'selected':'')+'>Vehicle / Trade</option><option '+(t.category==='Insurance'?'selected':'')+'>Insurance</option><option '+(t.category==='Other'?'selected':'')+'>Other</option></select></label></div><button class="btn full" style="margin-top:14px" onclick="updateTemplate(\''+id+'\')">SAVE CHANGES</button>')}async function saveTemplate(){const label=document.getElementById('tn').value.trim();if(!label)return toast('Name required','Enter a requirement name.');const category=document.getElementById('tc').value,kind=document.getElementById('tk').value;if(isTest()){S.templates.push({id:'t'+Date.now(),label,category,kind,active:true});closeSheet();return renderApp()}const{error}=await db.from('requirement_templates').insert({dealership_id:state.profile.dealership_id,label,category,kind,active:true,created_by:state.profile.id});if(error)return toast('Unable to save',error.message);closeSheet();await loadLive();renderApp()}async function updateTemplate(id){const label=document.getElementById('tn').value.trim();if(!label)return toast('Name required','Enter a requirement name.');const category=document.getElementById('tc').value;if(isTest()){const t=state.templates.find(x=>x.id===id);Object.assign(t,{label,category});closeSheet();return renderApp()}const{error}=await db.from('requirement_templates').update({label,category,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Unable to update',error.message);closeSheet();await loadLive();renderApp()}function teamScreen(){if(!isMaster()||isTest())return '<div class="card">Team administration is available in Master mode. Exit test mode to return to Master.</div>';return '<div class="row"><div><div class="eyebrow">Master Authority</div><h1>Team Management</h1></div><button class="btn" onclick="invite()">＋ INVITE</button></div><div class="card">'+state.team.filter(x=>x.id!==state.profile.id).map(x=>'<div class="listitem row"><div><b>'+esc(x.full_name)+'</b><div class="muted">'+esc(x.role)+' · '+(x.active?'Active':'Inactive')+'</div></div><button class="btn secondary small" onclick="toggleActive(\''+x.id+'\','+(!x.active)+')">'+(x.active?'DEACTIVATE':'ACTIVATE')+'</button></div>').join('')+'</div>'}async function toggleActive(id,val){const{error}=await db.rpc('set_team_member_active',{p_user_id:id,p_active:val});if(error)return toast('Unable to update user',error.message);await loadLive();renderApp()}function invite(){sheet('<h2>Create Team Invitation</h2><p class="muted">The invitation determines the role.</p><div class="field"><label>Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label></div><button class="btn full" style="margin-top:14px" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="inviteResult"></div>')}async function createInvite(){const{data,error}=await db.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return toast('Unable to create invite',error.message);document.getElementById('inviteResult').innerHTML='<div class="card"><div class="eyebrow">Invitation Code</div><h2 style="letter-spacing:.15em">'+esc(data)+'</h2><div class="muted">Give this code to the intended team member.</div></div>'}function notificationScreen(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">'+state.notifications.map(n=>'<div class="listitem"><b>'+esc(n.title)+'</b><div class="muted" style="margin-top:4px">'+esc(n.body)+'</div><div class="muted" style="font-size:11px;margin-top:5px">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join('')||'<div class="muted">No notifications yet.</div></div><button class="btn secondary" onclick="enableNotifications()">ENABLE DEVICE ALERTS</button>'}async function enableNotifications(){if(!('Notification'in window))return toast('Not supported','This browser does not support web notifications.');toast('Permission',await Notification.requestPermission())}function accountScreen(){return '<div class="eyebrow">Account</div><h1>'+esc(state.profile?.full_name||'Rahul Champaneri')+'</h1><div class="card"><div class="row"><div><h2>'+esc(role())+'</h2><div class="muted">'+(isTest()?'Master session · simulated authority':'Authorized AXIOM PULSE account')+'</div></div><span class="badge">ACTIVE</span></div></div>'+(isTest()?'<button class="btn secondary full" onclick="exitTest()">RETURN TO MASTER</button><div style="height:9px"></div>':'')+'<button class="btn danger full" onclick="signOut()">SIGN OUT</button>'}function enterTest(r){if(!isMaster()||isTest())return;state.testRole=r;demoData();state.screen='home';renderApp()}async function exitTest(){state.testRole=null;await loadLive();state.screen='home';renderApp()}async function signOut(){if(state.channel)db.removeChannel(state.channel);if(state.notificationChannel)db.removeChannel(state.notificationChannel);state.channel=state.notificationChannel=null;state.profile=null;state.session=null;state.testRole=null;state.deliveries=[];await db.auth.signOut();renderLogin()}function go(s){state.screen=s;renderApp()}function sheet(html){closeSheet();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button><div style="height:10px"></div>'+html+'</section>';document.body.appendChild(m)}function closeSheet(){document.getElementById('modal')?.remove()}function subscribe(){if(isTest()||state.channel)return;state.channel=db.channel('axiom-dealership-'+state.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await loadLive();renderApp()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await loadLive();renderApp()}).subscribe();state.notificationChannel=db.channel('axiom-user-'+state.profile.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+state.profile.id},p=>{state.notifications.unshift(p.new);toast(p.new.title,p.new.body);if('Notification'in window&&Notification.permission==='granted')new Notification(p.new.title,{body:p.new.body,icon:'./icon.svg'})}).subscribe()}
boot();
</script></body></html>
