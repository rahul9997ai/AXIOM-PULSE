ion:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:end}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#102238;border-radius:25px 25px 0 0;border-top:1px solid var(--line);padding:18px}@media(max-width:560px){.a{font-size:43px}.p{font-size:39px}.identity{min-height:285px}.meaning{font-size:8px}.by{font-size:17px}.tag{font-size:13px}.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:760px){.a{font-size:72px}.p{font-size:63px}.identity{min-height:350px}}</style></head><body><div id="root"></div><script>const URL='https://xjahoajimgdyuwxdjakw.supabase.co',KEY='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const root=document.getElementById('root');const S={profile:null,screen:'home',mode:'master',session:null,notes:[],delivery:null,templates:[]};const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const master=()=>S.profile?.role==='master',test=()=>S.mode!=='master',role=()=>S.mode,notify=(t,b)=>{document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted">'+esc(b)+'</div>';document.body.append(n);setTimeout(()=>n.remove(),4500)};function brand(){return '<div class="identity"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H95L106 48 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H727L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="logo"><span class="a">AXIOM</span><span class="p">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}function login(msg=''){root.innerHTML='<main class="screen login"><section class="wrap"><div class="card">'+brand()+'<h2>Secure Sign In</h2><p class="muted" style="margin-top:5px">Authorized AXIOM PULSE access.</p><div id="msg" class="muted" style="margin-top:8px">'+esc(msg)+'</div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="password" class="input" type="password" autocomplete="current-password"></label></div><div class="stack" style="margin-top:14px"><button class="btn full" onclick="signin()">SIGN IN</button><button class="btn secondary full" onclick="joinPage()">JOIN WITH INVITATION</button></div></div></section></main>'}async function signin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return document.getElementById('msg').textContent='Enter your email and password.';const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return document.getElementById('msg').textContent=error.message;const q=await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();if(q.error||!q.data)return sb.auth.signOut().then(()=>login('This account is not authorized for AXIOM PULSE.'));if(!q.data.active)return sb.auth.signOut().then(()=>login('This AXIOM PULSE account is inactive.'));S.profile=q.data;S.session=data.session;await loadReal();renderApp()}function joinPage(){root.innerHTML='<main class="screen login"><section class="wrap"><div class="card">'+brand()+'<button class="btn ghost small" onclick="login()">← BACK TO SIGN IN</button><h2 style="margin-top:14px">Join AXIOM PULSE</h2><p class="muted" style="margin-top:5px">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn full" style="margin-top:14px" onclick="joinAccount()">CREATE ACCOUNT</button><div id="jm" class="muted" style="font-size:12px;text-align:center;margin-top:9px"></div></div></section></main>'}async function joinAccount(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6)return document.getElementById('jm').textContent='Please complete every field. Password must be at least 6 characters.';localStorage.setItem('axiom_invite',JSON.stringify({n,c}));const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(error)return document.getElementById('jm').textContent=error.message;if(data.session){const r=await sb.rpc('accept_team_invite',{p_code:c,p_full_name:n});if(r.error)return document.getElementById('jm').textContent=r.error.message;localStorage.removeItem('axiom_invite');await signin()}else login('Check your email to verify your account, then sign in to finish onboarding.')}async function loadReal(){if(!S.profile)return;const{data}=await sb.from('requirement_templates').select('*').eq('dealership_id',S.profile.dealership_id).order('sort_order').order('label');S.templates=data||[];if(master()){const t=await sb.rpc('get_team_members');S.notes=t.data||[]}}function demo(){S.delivery={id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',requirements:[{id:'r1',label:'Void cheque',kind:'Customer Document',completed:false},{id:'r2',label:'Trade ownership',kind:'Customer Document',completed:true},{id:'r3',label:'Trade release form',kind:'Customer Document',completed:false},{id:'r4',label:'$500 due on delivery',kind:'Financial',amount:500,completed:false}]};S.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}]}function appBrand(){return '<header class="head"><div class="headrow"><span class="a">AXIOM</span><span class="p">Pulse</span><span class="line"></span></div><div class="meta">AI eXecutive Intelligence &amp; Operations Management</div><div class="headby">by Rahul Champaneri</div><div class="headtag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button onclick="go(\'home\')"><b>⌂</b>Home</button><button onclick="go(\'deliveries\')"><b>◫</b>Deliveries</button><button onclick="go(\'notifications\')"><b>◉</b>Alerts</button><button onclick="go(\'account\')"><b>◌</b>Account</button></nav>'}function renderApp(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main">'+(test()?'<div class="badge warn" style="width:100%;justify-content:center;margin-bottom:10px">TEST '+S.mode.toUpperCase()+' MODE · Master session preserved</div>':'')+screenHtml()+'</main>'+nav()+'</div>'}function screenHtml(){if(S.screen==='deliveries')return deliveries();if(S.screen==='notifications')return notifications();if(S.screen==='account')return account();return home()}function home(){const d=S.delivery||{requirements:[]},out=(d.requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="eyebrow">'+S.mode.toUpperCase()+' ACCESS</div><h1>Master Control Center</h1><p class="muted" style="margin-top:5px">Welcome, '+esc(S.profile?.full_name||'Rahul Champaneri')+'.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>'+((d.requirements||[]).length)+'</b><span class="muted">Requirements</span></div><div class="stat"><b>'+((d.requirements||[]).filter(r=>r.completed).length)+'</b><span class="muted">Completed</span></div><div class="stat"><b>'+out+'</b><span class="muted">Outstanding</span></div></div><div class="card"><h2>Test operational access</h2><p class="muted" style="margin:6px 0 12px">Switch authority without changing your actual Master role.</p><div class="stack"><button class="btn" onclick="enterTest(\'fsm\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\'salesperson\')">TEST AS SALESPERSON</button><button class="btn ghost" onclick="go(\'deliveries\')">OPEN DELIVERY WORKFLOW</button><button class="btn ghost" onclick="go(\'notifications\')">OPEN NOTIFICATIONS</button></div></div>'}function deliveries(){if(!S.delivery)demo();const d=S.delivery,rs=d.requirements||[],done=rs.filter(r=>r.completed||r.exception_reason).length;return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div><button class="btn" onclick="go(\'delivery\')">OPEN</button></div><div class="card"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+'</div></div><span class="badge out">'+esc(d.status)+'</span></div><div class="row" style="margin-top:12px"><span class="muted">'+new Date(d.delivery_at).toLocaleString()+'</span><span class="muted">'+done+'/'+rs.length+' resolved</span></div></div><div class="card">'+rs.map(r=>'<div class="item"><div class="row"><div><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.kind)+'</div></div><span class="badge '+(r.completed?'':'out')+'">'+(r.completed?'COMPLETED':'OUTSTANDING')+'</span></div>'+(sales()&&!r.completed?'<button class="btn secondary small" style="margin-top:8px" onclick="completeRequirement(\''+r.id+'\')">COMPLETE</button>':'')+(r.exception_reason?'<div class="muted" style="margin-top:6px">Exception: '+esc(r.exception_reason)+'</div>':'')+'</div>').join('')+'</div>'+(test()?'<div class="card"><button class="btn ghost full" onclick="exitTest()">RETURN TO MASTER</button></div>':'')}function notifications(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card"><p class="muted">Test an operational event to see how the notification experience will behave.</p><button class="btn" style="margin-top:12px" onclick="notify(\'Requirement completed → FSM\',\'Void cheque was completed for John Smith.\')">SIMULATE COMPLETION ALERT</button><button class="btn secondary full" style="margin-top:9px" onclick="notify(\'New requirement → Salesperson\',\'Collect insurance binder for John Smith.\')">SIMULATE NEW REQUIREMENT</button></div></div>'}function account(){return '<div class="eyebrow">Account</div><h1>'+esc(S.profile?.full_name||'Rahul Champaneri')+'</h1><div class="card"><div class="row"><div><h2>'+esc(role())+'</h2><div class="muted">'+(test()?'Master session · simulated authority':'Real Supabase role')+'</div></div><span class="badge">ACTIVE</span></div></div><button class="btn danger full" onclick="signOut()">SIGN OUT</button>'}function completeRequirement(id){const r=S.delivery.requirements.find(x=>x.id===id);if(!r)return;r.completed=true;r.exception_reason=null;notify('Requirement completed → FSM','TEST MODE — live event would be sent to the FSM.');render()}function signOut(){sb.auth.signOut().finally(()=>location.reload())}function go(s){S.screen=s;if(s==='deliveries'&&!S.delivery)demo();render()}function enterTest(r){if(!master())return;S.mode=r;demo();S.screen='home';render()}function exitTest(){S.mode='master';S.screen='home';loadReal().then(render)}boot();</script></body></html>
