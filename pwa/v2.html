ing:13px 0;border-bottom:1px solid #21394f}.item:last-child{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;background:#193e33;color:#94f0be}.badge.out{background:#4b232a;color:#ffbdc6}.badge.warn{background:#4c3a1d;color:#ffda8d}.tap{cursor:pointer}.req{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #20384f}.req:last-child{border-bottom:0}.check{width:24px;height:24px;border-radius:8px;background:#091725;border:1px solid #416283;display:grid;place-items:center;flex:0 0 auto}.done{background:#1a7a57;border-color:#38d596}.exc{background:#79303a;border-color:#ff7888}.reqbody{flex:1}.reqactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#91a6be;font-size:10px;min-width:62px}.nav button.active{color:#fff}.nav b{display:block;font-size:20px;margin-bottom:3px}.notice{position:fixed;z-index:90;left:12px;right:12px;top:12px;background:#143953;border:1px solid #4fa4ff;border-radius:16px;padding:13px;box-shadow:0 15px 45px #0009}.modal{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:end}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#102238;border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.testbar{margin:-5px 0 12px;padding:9px;border:1px solid #806a38;background:#3c301b;color:#ffe0a0;border-radius:12px;text-align:center;font-size:12px}@media(max-width:560px){.A{font-size:43px}.P{font-size:39px}.brand{min-height:285px}.meaning{font-size:8px;letter-spacing:.08em}.by{font-size:17px}.tag{font-size:13px}.grid3{grid-template-columns:repeat(3,1fr)}.ha{ const sb=supabase.createClient('https://xjahoajimgdyuwxdjakw.supabase.co','sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const root=document.getElementById('root');const S={session:null,profile:null,testRole:null,screen:'home',deliveries:[],templates:[],notes:[],team:[]};const role=()=>S.testRole||S.profile?.role,isMaster=()=>role()==='master',isFSM=()=>role()==='fsm',isSales=()=>role()==='salesperson',isTest=()=>!!S.testRole,esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function toast(t,b){document.querySelectorAll('.notice').forEach(n=>n.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted" style="margin-top:3px">'+esc(b||'')+'</div>';document.body.append(n);setTimeout(()=>n.remove(),4800)}function brand(){return '<div class="brand"><div class="ecg"><svg viewBox="0 0 900 150" preserveAspectRatio="none"><path d="M0 76H90L102 49 119 108 133 25 147 76H240L254 76 269 54 284 101 299 76H620L635 76 650 55 665 112 680 31 696 76H728L743 55 758 99 772 68 787 87 801 76H900"/></svg></div><div><div class="brandrow"><span class="A">AXIOM</span><span class="P">Pulse</span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></div></div>'}function login(msg=''){root.innerHTML='<main class="screen center"><section class="loginwrap">'+brand()+'<div class="auth"><div class="card"><h2>Secure Sign In</h2><p class="muted" style="margin-top:5px">Authorized AXIOM PULSE access.</p><div id="authmsg" class="muted" style="margin-top:8px">'+esc(msg)+'</div><div class="field"><label>Email<input id="email" class="input" type="email" autocomplete="username" placeholder="you@dealership.ca"></label></div><div class="field"><label>Password<input id="password" class="input" type="password" autocomplete="current-password"></label></div><div class="stack"><button class="btn full" onclick="signIn()">SIGN IN</button><button class="btn secondary full" onclick="joinPage()">JOIN WITH INVITATION</button></div></div></div></section></main>'}async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return document.getElementById('authmsg').textContent='Enter your email and password.';const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('authmsg').textContent=error.message;await authenticate(data.session)}async function authenticate(session){const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!data){await sb.auth.signOut();return login(error?.message||'This account is not authorized for AXIOM PULSE.')}if(!data.active){await sb.auth.signOut();return login('This AXIOM PULSE account is inactive.')}S.session=session;S.profile=data;S.testRole=null;await loadLive();subscribe();renderApp()}function joinPage(){root.innerHTML='<main class="screen center"><section class="loginwrap">'+brand()+'<div class="auth"><div class="card"><button class="btn ghost small" onclick="login()">← BACK</button><h2 style="margin-top:14px">Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><div class="field"><label>Full name<input id="jn" class="input"></label></div><div class="field"><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label></div><div class="field"><label>Email<input id="je" class="input" type="email"></label></div><div class="field"><label>Create password<input id="jp" class="input" type="password"></label></div><button class="btn full" style="margin-top:14px" onclick="createJoin()">CREATE ACCOUNT</button><div id="jm" class="muted" style="font-size:12px;text-align:center;margin-top:9px"></div></div></div></section></main>'}async function createJoin(){const payload={full_name:document.getElementById('jn').value.trim(),invite_code:document.getElementById('jc').value.trim().toUpperCase(),email:document.getElementById('je').value.trim(),password:document.getElementById('jp').value};if(!payload.full_name||!payload.invite_code||!payload.email||payload.password.length<6)return document.getElementById('jm').textContent='Complete every field. Password must be at least 6 characters.';const{data,error}=await sb.functions.invoke('create-invited-user',{body:payload});if(error)return document.getElementById('jm').textContent=error.message||'Unable to create account.';if(data?.error)return document.getElementById('jm').textContent=data.error;const r=await sb.auth.signInWithPassword({email:payload.email,password:payload.password});if(r.error)return login('Account created. Sign in with your new credentials.');await authenticate(r.data.session)}async function loadLive(){if(isTest()){demo();return}const q=isSales()?sb.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',S.profile.id).order('delivery_at'):sb.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',S.profile.dealership_id).order('delivery_at');const[d,t,n]=await Promise.all([q,sb.from('requirement_templates').select('*').eq('dealership_id',S.profile.dealership_id).order('sort_order').order('label'),sb.from('notification_history').select('*').eq('user_id',S.profile.id).order('sent_at',{ascending:false}).limit(50)]);S.deliveries=d.data||[];S.templates=t.data||[];S.notes=n.data||[];if(isMaster()){const tm=await sb.rpc('get_team_members');S.team=tm.data||[]}}function demo(){S.deliveries=[{id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'Approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and signed trade release.',delivery_requirements:[{id:'r1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'r2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'r3',label:'Trade release form',kind:'trade_release',completed:false},{id:'r4',label:'$500 due on delivery',kind:'money_collect',amount:500,completed:false}]}];S.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}];S.notes=[]}function appBrand(){return '<header class="head"><div class="headrow"><span class="ha">AXIOM</span><span class="hp">Pulse</span><span class="hline"></span></div><div class="meta">AI eXecutive Intelligence &amp; Operations Management</div><div class="headby">by Rahul Champaneri</div><div class="headtag">The Pulse of Every Delivery</div></header>'}function nav(){return '<nav class="nav"><button class="'+(S.screen==='home'?'active':'')+'" onclick="go(\\'home\\')"><b>⌂</b>Home</button><button class="'+(S.screen==='deliveries'?'active':'')+'" onclick="go(\\'deliveries\\')"><b>◫</b>Deliveries</button><button class="'+(S.screen==='notifications'?'active':'')+'" onclick="go(\\'notifications\\')"><b>◉</b>Alerts</button>'+(isMaster()&&!isTest()?'<button onclick="go(\\'team\\')"><b>♙</b>Team</button>':'')+'<button onclick="go(\\'account\\')"><b>◌</b>Account</button></nav>'}function renderApp(){root.innerHTML='<div class="app">'+appBrand()+'<main class="main">'+(isTest()?'<div class="testbar">TEST '+S.testRole.toUpperCase()+' MODE · Master session preserved · changes are simulated locally</div>':'')+screenHtml()+'</main>'+nav()+'</div>'}function screenHtml(){if(S.screen==='deliveries')return deliveries();if(S.screen==='notifications')return notifications();if(S.screen==='team')return teamScreen();if(S.screen==='library')return library();if(S.screen.startsWith('delivery:'))return delivery(S.screen.slice(9));if(S.screen==='account')return account();return home()}function home(){const a=S.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled'),o=a.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;return '<div class="eyebrow">'+esc(role().toUpperCase())+' ACCESS</div><h1>'+ (isMaster()&&!isTest()?'Master Control Center':isFSM()?'FSM Workspace':'Salesperson Workspace')+'</h1><p class="muted" style="margin-top:5px">Welcome, '+esc(S.profile?.full_name||'Test User')+'.</p><div class="grid3" style="margin-top:16px"><div class="stat"><b>'+a.length+'</b><span class="muted">Active</span></div><div class="stat"><b>'+a.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length+'</b><span class="muted">Today</span></div><div class="stat"><b>'+o+'</b><span class="muted">Outstanding</span></div></div><div class="card"><h2>The delivery is the record</h2><p class="muted" style="margin-top:5px">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" style="margin-top:12px" onclick="go(\\'deliveries\\')">OPEN DELIVERIES</button></div>'+(isMaster()&&!isTest()?'<div class="card"><h2>Master Control &amp; Testing</h2><p class="muted" style="margin:5px 0 12px">Your Master account keeps full authority. Test both operational access levels without changing your real role.</p><div class="stack"><button class="btn" onclick="enterTest(\\'fsm\\')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest(\\'salesperson\\')">TEST AS SALESPERSON</button><button class="btn ghost" onclick="go(\\'team\\')">MANAGE TEAM</button><button class="btn ghost" onclick="go(\\'library\\')">REQUIREMENT LIBRARY</button></div></div>':'')}'}function deliveries(){return '<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div></div><div class="list" style="margin-top:12px">'+S.deliveries.map(d=>{const rs=d.delivery_requirements||[],done=rs.filter(r=>r.completed||r.exception_reason).length;return '<article class="card tap" onclick="openDelivery(\\''+d.id+'\\')"><div class="row"><div><h2>'+esc(d.customer_name)+'</h2><div class="muted">'+esc(d.vehicle)+'</div></div><span class="badge '+(d.status==='delivered'?'':'out')+'">'+esc(d.status)+'</span></div><div class="row" style="margin-top:12px"><span class="muted">'+new Date(d.delivery_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span><span class="muted">'+done+'/'+rs.length+' resolved</span></div></article>'}).join('')||'<div class="card muted">No deliveries yet.</div></div>'}function openDelivery(id){S.screen='delivery:'+id;renderApp()}function delivery(id){const d=S.deliveries.find(x=>x.id===id);if(!d)return '<div class="card">Delivery not found.</div>';const rs=d.delivery_requirements||[],rows=rs.map(r=>{const resolved=r.completed||r.exception_reason;return '<div class="req"><span class="check '+(r.completed?'done':r.exception_reason?'exc':'')+'">'+(r.completed?'✓':r.exception_reason?'!':'')+'</span><div class="reqbody"><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.kind||'custom')+(r.amount?' · $'+Number(r.amount).toFixed(2):'')+'</div>'+(r.completed?'<span class="badge" style="margin-top:6px">COMPLETED</span>':r.exception_reason?'<span class="badge out" style="margin-top:6px">EXCEPTION · '+esc(r.exception_reason)+'</span>':'<span class="badge warn" style="margin-top:6px">OUTSTANDING</span>')+(isSales()&&!resolved?'<div class="reqactions"><button class="btn secondary small" onclick="completeReq(\\''+d.id+'\\',\\''+r.id+'\\')">COMPLETE</button><button class="btn danger small" onclick="exceptionReq(\\''+d.id+'\\',\\''+r.id+'\\')">EXCEPTION</button></div>':'')+'</div></div>'}).join('');const out=rs.filter(r=>!r.completed&&!r.exception_reason);return '<button class="btn ghost small" onclick="go(\\'deliveries\\')">← BACK</button><div class="card"><div class="eyebrow">'+esc(d.status)+'</div><h1>'+esc(d.customer_name)+'</h1><p class="muted">'+esc(d.vehicle)+'</p><div class="grid3" style="margin-top:14px"><div class="stat"><span class="muted">DATE</span><b style="font-size:14px">'+new Date(d.delivery_at).toLocaleDateString()+'</b></div><div class="stat"><span class="muted">TIME</span><b style="font-size:14px">'+new Date(d.delivery_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</b></div><div class="stat"><span class="muted">APPROVAL</span><b style="font-size:14px">'+esc(d.approval_status||'Approved')+'</b></div></div><p class="muted" style="margin-top:10px">Lender / Lessor: '+esc(d.lender_name||'—')+'</p>'+(d.fsm_notes?'<div class="card"><div class="eyebrow">FSM INSTRUCTION</div>'+esc(d.fsm_notes)+'</div>':'')+'</div><div class="sectionhead"><h2>Delivery Requirements</h2>'+(isFSM()||isMaster()?'<button class="btn secondary small" onclick="showAddRequirement(\\''+d.id+'\\')">＋ ADD</button>':'')+'</div><div class="card">'+rows+'</div>'+(isSales()?'<div class="card"><h2>Delivery Completion</h2><p class="muted" style="margin:6px 0 12px">'+(out.length?'⚠️ '+out.length+' requirement(s) outstanding.':'All requirements resolved.')+'</p><button class="btn full" '+(out.length?'disabled':'')+' onclick="completeDelivery(\\''+d.id+'\\')">COMPLETE DELIVERY</button></div>':'')}function completeReq(did,rid){if(isTest()){const r=S.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.completed=true;r.exception_reason=null;toast('Requirement completed','TEST MODE — simulated FSM notification.');return renderApp()}sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:S.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',rid).then(async({error})=>{if(error)return toast('Unable to complete',error.message);await loadLive();renderApp()})}function exceptionReq(did,rid){sheet('<h2>Mark as exception</h2><p class="muted">The reason becomes part of the delivery record.</p><textarea id="ex" placeholder="Explain why the requirement could not be completed."></textarea><button class="btn danger full" style="margin-top:12px" onclick="saveEx(\\''+did+'\\',\\''+rid+'\\')">RECORD EXCEPTION</button>')}function saveEx(did,rid){const reason=document.getElementById('ex').value.trim();if(!reason)return; if(isTest()){const r=S.deliveries.find(d=>d.id===did).delivery_requirements.find(x=>x.id===rid);r.exception_reason=reason;r.completed=false;closeSheet();toast('Exception recorded','TEST MODE — simulated FSM notification.');return renderApp()}sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.profile.id}).eq('id',rid).then(async({error})=>{if(error)return toast('Unable to record',error.message);closeSheet();await loadLive();renderApp()})}function completeDelivery(id){if(isTest()){const d=S.deliveries.find(x=>x.id===id),out=(d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);if(out.length)return toast('Delivery blocked',out.length+' unresolved requirement(s).');d.status='delivered';return renderApp()}sb.rpc('complete_delivery',{p_delivery_id:id}).then(async({error})=>{if(error)return toast('Delivery not completed',error.message);await loadLive();renderApp()})}
function library(){if(!isFSM()&&!isMaster())return '<div class="card">Requirement Library administration is restricted.</div>';const can=isMaster()||S.profile?.can_manage_requirement_library||isTest();return '<div class="sectionhead"><div><div class="eyebrow">Reusable Requirements</div><h1>Requirement Library</h1></div>'+(can?'<button class="btn" onclick="newTemplate()">＋ ADD</button>':'')+'</div><div class="card">'+S.templates.map(t=>'<div class="item row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.category)+' · '+esc(t.kind)+'</div></div>'+(can?'<button class="btn secondary small" onclick="editTemplate(\\''+t.id+'\\')">EDIT</button>':'')+'</div>').join('')+'</div>'}function newTemplate(){sheet('<h2>Add Requirement</h2><label>Name<input id="tn" class="input"></label><label style="display:block;margin-top:10px">Category<select id="tc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Other</option></select></label><label style="display:block;margin-top:10px">Type<select id="tk" class="input"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select></label><button class="btn full" style="margin-top:14px" onclick="saveTemplate()">SAVE</button>')}async function saveTemplate(){const label=document.getElementById('tn').value.trim();if(!label)return toast('Name required','Enter a requirement name.');if(isTest()){S.templates.push({id:'t'+Date.now(),label,category:document.getElementById('tc').value,kind:document.getElementById('tk').value,active:true});closeSheet();return renderApp()}const{error}=await sb.from('requirement_templates').insert({dealership_id:S.profile.dealership_id,label,category:document.getElementById('tc').value,kind:document.getElementById('tk').value,active:true,created_by:S.profile.id});if(error)return toast('Unable to save',error.message);closeSheet();await loadLive();renderApp()}function editTemplate(id){const t=S.templates.find(x=>x.id===id);sheet('<h2>Edit Requirement</h2><label>Name<input id="tn" class="input" value="'+esc(t.label)+'"></label><label style="display:block;margin-top:10px">Category<select id="tc" class="input"><option '+(t.category==='Customer Documents'?'selected':'')+'>Customer Documents</option><option '+(t.category==='Financial'?'selected':'')+'>Financial</option><option '+(t.category==='Vehicle / Trade'?'selected':'')+'>Vehicle / Trade</option><option '+(t.category==='Other'?'selected':'')+'>Other</option></select></label><button class="btn full" style="margin-top:14px" onclick="updateTemplate(\\''+id+'\\')">SAVE CHANGES</button>')}async function updateTemplate(id){const label=document.getElementById('tn').value.trim();if(!label)return toast('Name required','Enter a requirement name.');if(isTest()){const t=S.templates.find(x=>x.id===id);t.label=label;t.category=document.getElementById('tc').value;closeSheet();return renderApp()}const{error}=await sb.from('requirement_templates').update({label,category:document.getElementById('tc').value,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Unable to update',error.message);closeSheet();await loadLive();renderApp()}
function teamScreen(){if(!isMaster()||isTest())return '<div class="card">Return to Master mode to manage users.</div>';return '<div class="row"><div><div class="eyebrow">Master Control</div><h1>Team Management</h1></div><button class="btn" onclick="inviteUser()">＋ INVITE</button></div><p class="muted" style="margin-top:6px">Add, edit, activate, deactivate or delete FSM and Salesperson access.</p><div class="card">'+S.team.filter(x=>x.id!==S.profile.id).map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.full_name)+'</b><div class="muted">'+esc(x.role)+' · '+(x.active?'Active':'Inactive')+'</div></div><div class="reqactions"><button class="btn secondary small" onclick="editUser(\\''+x.id+'\\')">EDIT</button><button class="btn danger small" onclick="removeUser(\\''+x.id+'\\')">DELETE</button></div></div></div>').join('')||'<div class="muted">No team members yet.</div>'+'</div>'}function inviteUser(){sheet('<h2>Create Team Invitation</h2><p class="muted">The invitation assigns the role. The recipient is confirmed immediately—no email verification step.</p><label style="display:block;margin-top:12px">Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn full" style="margin-top:14px" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="invite"></div>')}async function createInvite(){const{data,error}=await sb.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return toast('Unable to create invitation',error.message);document.getElementById('invite').innerHTML='<div class="card"><div class="eyebrow">INVITATION CODE</div><h2 style="letter-spacing:.16em">'+esc(data)+'</h2><div class="muted">Give this one-time code to the intended user.</div></div>'}function editUser(id){const u=S.team.find(x=>x.id===id);sheet('<h2>Edit Team Member</h2><div class="field"><label>Full name<input id="en" class="input" value="'+esc(u.full_name)+'"></label></div><div class="field"><label>Email (optional)<input id="ee" class="input" type="email"></label></div><div class="field"><label>New password (optional)<input id="ep" class="input" type="password" placeholder="Minimum 6 characters"></label></div><div class="field"><label>Access<select id="ea" class="input"><option value="true" '+(u.active?'selected':'')+'>Active</option><option value="false" '+(!u.active?'selected':'')+'>Inactive</option></select></label></div>'+(u.role==='fsm'?'<div class="field"><label>Requirement Library authority<select id="el" class="input"><option value="keep">No change</option><option value="true">Grant</option><option value="false">Remove</option></select></label></div>':'')+'<button class="btn full" style="margin-top:14px" onclick="saveUser(\\''+id+'\\')">SAVE CHANGES</button>')}async function saveUser(id){const body={op:'update',user_id:id,full_name:document.getElementById('en').value.trim(),email:document.getElementById('ee').value.trim(),password:document.getElementById('ep').value,active:document.getElementById('ea').value==='true'};const{data,error}=await sb.functions.invoke('manage-team-user',{body});if(error)return toast('Unable to update',error.message);if(data?.error)return toast('Unable to update',data.error);const lib=document.getElementById('el');if(lib&&lib.value!=='keep'){const r=await sb.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:lib.value==='true'});if(r.error)return toast('User updated; authority failed',r.error.message)}closeSheet();await loadLive();renderApp()}async function removeUser(id){if(!confirm('Delete this user’s AXIOM PULSE login access? Delivery history will be preserved.'))return;const{data,error}=await sb.functions.invoke('manage-team-user',{body:{op:'delete',user_id:id}});if(error)return toast('Unable to delete',error.message);if(data?.error)return toast('Unable to delete',data.error);toast('User deleted','Login access removed; delivery history preserved.');await loadLive();renderApp()}
function notifications(){return '<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">'+S.notes.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div><div class="muted" style="font-size:11px">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join('')||'<div class="muted">No notifications.</div>'+'</div><button class="btn secondary" onclick="enableNotifications()">ENABLE DEVICE ALERTS</button>'}async function enableNotifications(){if(!('Notification'in window))return toast('Not supported','This browser does not support device notifications.');toast('Notification permission',await Notification.requestPermission())}function account(){return '<div class="eyebrow">Account</div><h1>'+esc(S.profile?.full_name||'Rahul Champaneri')+'</h1><div class="card"><div class="row"><div><h2>'+esc(role())+'</h2><div class="muted">'+(isTest()?'Master session · simulated authority':'Authorized AXIOM PULSE account')+'</div></div><span class="badge">ACTIVE</span></div></div>'+(isTest()?'<button class="btn secondary full" onclick="exitTest()">RETURN TO MASTER</button><div style="height:9px"></div>':'')+'<button class="btn danger full" onclick="signOut()">SIGN OUT</button>'}function enterTest(r){if(!isMaster()||isTest())return;S.testRole=r;demo();S.screen='home';renderApp()}async function exitTest(){S.testRole=null;await loadLive();S.screen='home';renderApp()}async function signOut(){if(S.channel)sb.removeChannel(S.channel);if(S.notifChannel)sb.removeChannel(S.notifChannel);S.channel=S.notifChannel=null;S.profile=null;S.session=null;S.testRole=null;await sb.auth.signOut();login()}function go(x){S.screen=x;renderApp()}function sheet(h){closeSheet();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button><div style="height:10px"></div>'+h+'</section>';document.body.append(m)}function closeSheet(){document.getElementById('modal')?.remove()}function subscribe(){if(isTest()||S.channel)return;S.channel=sb.channel('axiom-'+S.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await loadLive();renderApp()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await loadLive();renderApp()}).subscribe();S.notifChannel=sb.channel('axiom-notify-'+S.profile.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+S.profile.id},p=>{S.notes.unshift(p.new);toast(p.new.title,p.new.body);if('Notification'in window&&Notification.permission==='granted')new Notification(p.new.title,{body:p.new.body,icon:'./icon.svg'})}).subscribe()}async function boot(){const{data:{session}}=await sb.auth.getSession();if(session)await authenticate(session);else login()}boot();
</script></body></html>
