<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>AXIOM Pulse</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--panel:#102238;--panel2:#142a43;--line:#2e4968;--text:#f5f7fb;--muted:#9eb2ca;--blue:#4d9df7;--green:#30d58d;--amber:#f4b74a;--red:#f06473}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{min-height:100dvh;background:linear-gradient(180deg,#091725,#06101c)}.brand{padding:14px 18px 12px;border-bottom:1px solid var(--line);background:#101f31f5;position:sticky;top:0;z-index:30}.brandline{display:flex;align-items:baseline;gap:10px}.axiom{font-size:30px;font-weight:950;letter-spacing:.18em}.pulse{font-size:28px;font-weight:800;font-style:italic;color:#63aaff}.pulsebar{height:1px;flex:1;background:#35516e;position:relative;overflow:hidden}.pulsebar:after{content:"";position:absolute;left:-80px;top:0;width:72px;height:1px;background:#70b8ff;box-shadow:0 0 14px #5baaff;animation:sweep 1.6s linear infinite}@keyframes sweep{to{transform:translateX(700px)}}.meaning{font-size:9px;letter-spacing:.12em;color:#77a9d5;text-transform:uppercase;margin-top:7px}.by{font:italic 16px "Segoe Script","Brush Script MT",cursive;margin-top:2px}.tag{font-size:11px;color:#c2ccda;margin-top:2px}.main{padding:18px 15px 100px;max-width:1100px;margin:auto}.card{background:linear-gradient(145deg,#12243a,#0d1b2c);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0a1725;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:24px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.14em;color:#73adf1;text-transform:uppercase;margin-bottom:6px}.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:#06111d;font-weight:850}.btn.secondary{background:#172b42;color:#edf4ff;border:1px solid #355575}.btn.danger{background:#51222b;color:#ffdce1;border:1px solid #7b3542}.btn.full{width:100%}.btn.small{padding:9px 12px;font-size:12px}.input,select,textarea{width:100%;margin-top:5px;background:#091624;color:#fff;border:1px solid #31506f;border-radius:13px;padding:13px}textarea{min-height:90px}label{display:block;color:#a0b6ce;font-size:12px;margin-top:12px}.listitem{padding:13px 0;border-bottom:1px solid #20374f}.listitem:last-child{border-bottom:0}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;background:#193d33;color:#95f2c2}.badge.out{background:#49232b;color:#ffbdc6}.badge.warn{background:#4b3a1e;color:#ffd98c}.req{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #20374f}.check{width:24px;height:24px;border:1px solid #416383;border-radius:8px;background:#0a1726;display:grid;place-items:center;flex:0 0 auto}.done{background:#1b7b58;border-color:#38d598}.exc{background:#79303b;border-color:#ff7888}.reqmain{flex:1}.reqactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#101f32f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#8fa4bb;font-size:10px;min-width:64px}.nav button.active{color:#fff}.nav b{display:block;font-size:21px;margin-bottom:3px}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(100%,480px)}.identity{position:relative;text-align:center;min-height:300px;display:grid;place-items:center}.wave{position:absolute;inset:30% 0 auto;height:80px;background:linear-gradient(90deg,transparent 0 6%,#2c83dc 8%,transparent 11% 39%,#63b1ff 42%,transparent 45% 72%,#2d83dd 74%,transparent 78%);filter:drop-shadow(0 0 10px #3c91e7)}.identlogo{position:relative;z-index:2;display:flex;align-items:baseline;gap:13px}.ia{font-size:55px;font-weight:950;letter-spacing:.11em}.ip{font-size:49px;font-style:italic;font-weight:800;color:#5ea8ff;text-shadow:0 0 17px #2f83ef66}.im{margin-top:34px;color:#77a9d5;letter-spacing:.14em;text-transform:uppercase;font-size:9px;font-weight:700}.iby{font:italic 21px "Segoe Script","Brush Script MT",cursive;margin-top:6px}.itag{font-size:14px;color:#cad3df;margin-top:8px}.auth{background:linear-gradient(145deg,#12243a,#0e1c2d);border:1px solid var(--line);border-radius:22px;padding:20px}.notice{position:fixed;z-index:100;left:12px;right:12px;top:12px;background:#143751;border:1px solid #4d9fff;border-radius:16px;padding:13px;box-shadow:0 15px 45px #0009}.modal{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:end center}.sheet{width:min(100%,720px);max-height:92dvh;overflow:auto;background:#102238;border-top:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.hidden{display:none!important}@media(max-width:560px){.ia{font-size:43px}.ip{font-size:39px}.grid{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.axiom{font-size:24px}.pulse{font-size:23px}}@media(min-width:760px){.main{padding:28px 34px 98px}.identity{min-height:340px}.ia{font-size:64px}.ip{font-size:56px}}</style></head><body><div id="root"></div><script>const SB_URL='https://xjahoajimgdyuwxdjakw.supabase.co',SB_KEY='sb_publishable_ive--VvFJA_P8YJBbyN0Gw_LV0YbCPD';const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const R=document.getElementById('root');const S={profile:null,session:null,screen:'home',testRole:null,deliveries:[],templates:[],team:[],notes:[],channel:null};const role=()=>S.testRole||S.profile?.role;const master=()=>role()==='master',fsm=()=>role()==='fsm',sales=()=>role()==='salesperson',test=()=>!!S.testRole;const esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const fmt=x=>new Date(x).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});function splashBrand(){return `<div class="identity"><div class="wave"></div><div><div class="identlogo"><span class="ia">AXIOM</span><span class="ip">Pulse</span></div><div class="im">AI eXecutive Intelligence &amp; Operations Management</div><div class="iby">by Rahul Champaneri</div><div class="itag">The Pulse of Every Delivery</div></div></div>`}function notify(t,b){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice';n.innerHTML='<b>'+esc(t)+'</b><div class="muted">'+esc(b||'')+'</div>';document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!data)return login(error?.message||'This account is not authorized.');if(!data.active){await sb.auth.signOut();return login('This account is inactive.');}S.profile=data;S.session=session;await liveData();subscribe();render()}function login(msg=''){R.innerHTML=`<main class="login"><section class="loginbox">${splashBrand()}<div class="auth"><h2>Secure Sign In</h2><p class="muted" style="margin-top:5px">Authorized AXIOM PULSE access.</p><div id="authmsg" class="muted" style="margin-top:8px">${esc(msg)}</div><label>Email<input id="em" class="input" type="email" placeholder="you@dealership.ca"></label><label>Password<input id="pw" class="input" type="password" placeholder="••••••••"></label><button class="btn full" style="margin-top:14px" onclick="signin()">SIGN IN</button><button class="btn secondary full" style="margin-top:9px" onclick="joinPage()">JOIN WITH INVITATION</button><div class="muted" style="font-size:11px;text-align:center;margin-top:10px">Master, FSM and Salesperson roles are assigned securely and cannot be self-elevated.</div></div></section></main>`}async function signin(){const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});if(error)return document.getElementById('authmsg').textContent=error.message;await boot()}function joinPage(){R.innerHTML=`<main class="login"><section class="loginbox">${splashBrand()}<div class="auth"><button class="btn ghost small" onclick="login()">← BACK TO SIGN IN</button><h2 style="margin-top:14px">Join AXIOM PULSE</h2><p class="muted">Your Finance Manager will provide a single-use invitation code for your authorized AXIOM PULSE access.</p><label>Full name<input id="jn" class="input"></label><label>Invitation code<input id="jc" class="input" style="text-transform:uppercase"></label><label>Email<input id="je" class="input" type="email"></label><label>Create password<input id="jp" class="input" type="password"></label><button class="btn full" style="margin-top:14px" onclick="join()">CREATE ACCOUNT</button><div id="jm" class="muted" style="font-size:12px;text-align:center;margin-top:10px"></div></div></section></main>`}async function join(){const n=document.getElementById('jn').value.trim(),c=document.getElementById('jc').value.trim().toUpperCase(),e=document.getElementById('je').value.trim(),p=document.getElementById('jp').value;if(!n||!c||!e||p.length<6)return document.getElementById('jm').textContent='Complete all fields; password must be at least 6 characters.';localStorage.setItem('axiom_pending_invite',JSON.stringify({n,c}));const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(error)return document.getElementById('jm').textContent=error.message;if(data.session){const r=await sb.rpc('accept_team_invite',{p_code:c,p_full_name:n});if(r.error)return document.getElementById('jm').textContent=r.error.message;localStorage.removeItem('axiom_pending_invite');await boot()}else login('Check your email to verify your account, then sign in to finish authorized onboarding.')}async function liveData(){if(test()){demo();return}const q=sales()?sb.from('deliveries').select('*,delivery_requirements(*)').eq('salesperson_id',S.profile.id).order('delivery_at'):sb.from('deliveries').select('*,delivery_requirements(*)').eq('dealership_id',S.profile.dealership_id).order('delivery_at');const[d,t,n]=await Promise.all([q,sb.from('requirement_templates').select('*').eq('dealership_id',S.profile.dealership_id).order('sort_order').order('label'),sb.from('notification_history').select('*').eq('user_id',S.profile.id).order('sent_at',{ascending:false}).limit(30)]);S.deliveries=d.data||[];S.templates=t.data||[];S.notes=n.data||[];if(master()){const x=await sb.rpc('get_team_members');S.team=x.data||[]}}function demo(){S.deliveries=[{id:'demo1',customer_name:'John Smith',vehicle:'2026 Nissan Rogue',lender_name:'TD Auto Finance',approval_status:'approved',delivery_at:new Date(Date.now()+86400000).toISOString(),status:'scheduled',fsm_notes:'Collect trade ownership and signed trade release.',delivery_requirements:[{id:'d1',label:'Void cheque',kind:'void_cheque',completed:false},{id:'d2',label:'Trade ownership',kind:'trade_ownership',completed:true},{id:'d3',label:'Trade release form',kind:'trade_release',completed:false},{id:'d4',label:'$500 due on delivery',kind:'money_collect',amount:500,completed:false}]}];S.templates=[{id:'t1',label:'Void cheque',kind:'void_cheque',category:'Customer Documents',active:true},{id:'t2',label:'Trade ownership',kind:'trade_ownership',category:'Vehicle / Trade',active:true},{id:'t3',label:'Trade release form',kind:'trade_release',category:'Customer Documents',active:true},{id:'t4',label:'Insurance / Binder',kind:'insurance',category:'Customer Documents',active:true},{id:'t5',label:'Money due on delivery',kind:'money_collect',category:'Financial',active:true},{id:'t6',label:'Refund due to customer',kind:'refund',category:'Financial',active:true}];S.notes=[]}function appBrand(){return `<header class="brand"><div class="brandline"><span class="axiom">AXIOM</span><span class="pulse">Pulse</span><span class="pulsebar"></span></div><div class="meaning">AI eXecutive Intelligence &amp; Operations Management</div><div class="by">by Rahul Champaneri</div><div class="tag">The Pulse of Every Delivery</div></header>`}function nav(){return `<nav class="nav"><button class="${S.screen==='home'?'active':''}" onclick="go('home')"><b>⌂</b>Home</button><button class="${S.screen==='deliveries'?'active':''}" onclick="go('deliveries')"><b>◫</b>Deliveries</button><button class="${S.screen==='notifications'?'active':''}" onclick="go('notifications')"><b>◉</b>Alerts</button>${master()&&!test()?`<button class="${S.screen==='team'?'active':''}" onclick="go('team')"><b>♙</b>Team</button>`:''}<button onclick="go('account')"><b>◌</b>Account</button></nav>`}function render(){R.innerHTML=`<div class="wrap">${appBrand()}<main class="main">${test()?`<div class="badge warn" style="width:100%;justify-content:center;margin-bottom:10px">TEST ${esc(S.testRole.toUpperCase())} MODE · Master account preserved</div>`:''}${screenHtml()}</main>${nav()}</div>`}function screenHtml(){if(S.screen==='deliveries')return list();if(S.screen==='notifications')return notifications();if(S.screen==='team')return team();if(S.screen==='library')return library();if(S.screen.startsWith('delivery:'))return detail(S.screen.slice(9));if(S.screen==='account')return account();return home()}function home(){const a=S.deliveries.filter(d=>d.status!=='delivered'&&d.status!=='cancelled'),o=a.flatMap(d=>d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason).length;let masterBox=master()&&!test()?`<div class="card"><div class="eyebrow">Master Control Center</div><h2>Full Master Access</h2><p class="muted" style="margin:6px 0 12px">Your Master account remains unrestricted. Use these test workspaces without changing the real role.</p><div style="display:grid;gap:9px"><button class="btn" onclick="enterTest('fsm')">TEST AS FSM</button><button class="btn secondary" onclick="enterTest('salesperson')">TEST AS SALESPERSON</button><button class="btn secondary" onclick="go('team')">MANAGE TEAM</button><button class="btn ghost" onclick="go('library')">REQUIREMENT LIBRARY</button></div></div>`:test()?`<div class="card"><h2>Return to Master</h2><p class="muted">This is a simulated operational workspace. No test-role action changes your Master role.</p><button class="btn secondary full" onclick="exitTest()">RETURN TO MASTER</button></div>`:'';return `<div class="eyebrow">${esc(role())} access</div><h1>Dealership Pulse</h1><p class="muted">Welcome, ${esc(S.profile?.full_name||'Rahul Champaneri')}.</p><div class="grid" style="margin-top:16px"><div class="stat"><b>${a.length}</b><span class="muted">Active</span></div><div class="stat"><b>${a.filter(d=>new Date(d.delivery_at).toDateString()===new Date().toDateString()).length}</b><span class="muted">Today</span></div><div class="stat"><b>${o}</b><span class="muted">Outstanding</span></div></div><div class="card"><h2>The delivery is the record</h2><p class="muted" style="margin-top:5px">The FSM’s instructions follow the deal all the way to delivery.</p><button class="btn" style="margin-top:12px" onclick="go('deliveries')">OPEN DELIVERIES</button></div>${masterBox}`}
function list(){return `<div class="row"><div><div class="eyebrow">Delivery Workflow</div><h1>Deliveries</h1></div>${fsm()||master()?`<button class="btn" onclick="showCreate()">＋ CREATE</button>`:''}</div><div class="list">${S.deliveries.map(d=>{const r=d.delivery_requirements||[],x=r.filter(q=>q.completed||q.exception_reason).length;return `<article class="card tap" onclick="openDelivery('${d.id}')"><div class="row"><div><h2>${esc(d.customer_name)}</h2><div class="muted">${esc(d.vehicle)}</div></div><span class="badge ${d.status==='delivered'?'':'out'}">${esc(d.status)}</span></div><div class="row" style="margin-top:10px"><span class="muted">${fmt(d.delivery_at)}</span><span class="muted">${x}/${r.length} resolved</span></div></article>`}).join('')||'<div class="card muted">No deliveries yet.</div>'}</div>`}function openDelivery(id){S.screen='delivery:'+id;render()}function detail(id){const d=S.deliveries.find(x=>x.id===id),rs=d?.delivery_requirements||[];if(!d)return '<div class="card">Delivery not found.</div>';const rows=rs.map(r=>{const resolved=r.completed||r.exception_reason;return `<div class="req"><span class="check ${r.completed?'done':r.exception_reason?'exc':''}">${r.completed?'✓':r.exception_reason?'!':''}</span><div class="reqmain"><b>${esc(r.label)}</b><div class="muted">${esc(r.kind||'custom')}${r.amount?' · $'+r.amount:''}</div>${r.completed?'<span class="badge" style="margin-top:7px">COMPLETED</span>':r.exception_reason?`<span class="badge out" style="margin-top:7px">EXCEPTION · ${esc(r.exception_reason)}</span>`:'<span class="badge warn" style="margin-top:7px">OUTSTANDING</span>'}${sales()&&!resolved?`<div class="reqactions" style="margin-top:8px"><button class="btn secondary small" onclick="completeReq('${d.id}','${r.id}')">COMPLETE</button><button class="btn danger small" onclick="exception('${d.id}','${r.id}')">EXCEPTION</button></div>`:''}</div></div>`}).join('');const out=rs.filter(r=>!r.completed&&!r.exception_reason);return `<button class="btn ghost small" onclick="go('deliveries')">← ALL DELIVERIES</button><div class="card"><div class="eyebrow">${esc(d.status)}</div><h1>${esc(d.customer_name)}</h1><div class="muted">${esc(d.vehicle)}</div><div class="grid" style="margin-top:14px"><div class="stat"><span class="muted">DATE</span><b style="font-size:15px">${new Date(d.delivery_at).toLocaleDateString()}</b></div><div class="stat"><span class="muted">TIME</span><b style="font-size:15px">${new Date(d.delivery_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b></div><div class="stat"><span class="muted">APPROVAL</span><b style="font-size:15px">${esc(d.approval_status||'approved')}</b></div></div><div class="muted" style="margin-top:12px">Lender / Lessor: ${esc(d.lender_name||'—')}</div>${d.fsm_notes?`<div class="card"><div class="eyebrow">FSM INSTRUCTION</div>${esc(d.fsm_notes)}</div>`:''}</div><div class="sectionhead"><h2>Delivery Requirements</h2>${fsm()||master()?`<button class="btn secondary small" onclick="addReq('${d.id}')">＋ ADD</button>`:''}</div><div class="card">${rows||'<div class="muted">No requirements.</div>'}</div>${sales()?`<div class="card"><h2>Delivery Completion</h2><p class="muted" style="margin:6px 0 12px">${out.length?'⚠️ '+out.length+' requirement(s) outstanding.':'All requirements resolved.'}</p><button class="btn full" ${out.length?'disabled':''} onclick="finishDelivery('${d.id}')">COMPLETE DELIVERY</button></div>`:''}`}
async function completeReq(did,rid){if(test()){const d=S.deliveries.find(x=>x.id===did),r=d.delivery_requirements.find(x=>x.id===rid);r.completed=true;r.exception_reason=null;notify('Requirement completed','TEST MODE — simulated FSM notification.');return render()}const{error}=await sb.from('delivery_requirements').update({completed:true,completed_at:new Date().toISOString(),completed_by:S.profile.id,exception_reason:null,exception_at:null,exception_by:null}).eq('id',rid);if(error)return notify('Unable to complete',error.message);await liveData();render();notify('Requirement completed','The related FSM receives the update in real time.')}function exception(did,rid){sheet(`<h2>Mark as exception</h2><p class="muted">Provide the reason. It becomes part of the delivery record.</p><textarea id="ex"></textarea><button class="btn danger full" style="margin-top:12px" onclick="saveException('${did}','${rid}')">RECORD EXCEPTION</button>`)}async function saveException(did,rid){const reason=document.getElementById('ex').value.trim();if(!reason)return notify('Reason required','Enter the exception reason.');if(test()){const d=S.deliveries.find(x=>x.id===did),r=d.delivery_requirements.find(x=>x.id===rid);r.completed=false;r.exception_reason=reason;closeSheet();notify('Exception recorded','TEST MODE — simulated FSM notification.');return render()}const{error}=await sb.from('delivery_requirements').update({exception_reason:reason,exception_at:new Date().toISOString(),exception_by:S.profile.id}).eq('id',rid);if(error)return notify('Unable to record',error.message);closeSheet();await liveData();render()}async function finishDelivery(id){if(test()){const d=S.deliveries.find(x=>x.id===id),bad=(d.delivery_requirements||[]).filter(r=>!r.completed&&!r.exception_reason);if(bad.length)return notify('Delivery blocked',bad.length+' requirement(s) remain unresolved.');d.status='delivered';return render()}const{error}=await sb.rpc('complete_delivery',{p_delivery_id:id});if(error)return notify('Delivery blocked',error.message);await liveData();openDelivery(id)}function showCreate(){if(test()){sheet(`<h2>Create test delivery</h2><label>Customer<input id="cc" class="input"></label><label>Vehicle<input id="cv" class="input"></label><label>Date<input id="cd" class="input" type="date"></label><label>Time<input id="ct" class="input" type="time"></label><button class="btn full" style="margin-top:14px" onclick="saveDemo()">CREATE TEST DELIVERY</button>`);return}const q=sb.from('profiles').select('id,full_name').eq('dealership_id',S.profile.dealership_id).eq('role','salesperson').eq('active',true).order('full_name');q.then(({data,error})=>{if(error||!data?.length)return notify('No active salesperson','Ask the Master to activate or invite a salesperson.');sheet(`<h2>Create Delivery</h2><label>Customer<input id="cc" class="input"></label><label>Vehicle<input id="cv" class="input"></label><label>Lender / Lessor<input id="cl" class="input"></label><label>Approval<select id="ca" class="input"><option value="approved">Approved</option><option value="pending">Pending</option><option value="conditional">Conditional</option></select></label><label>Date<input id="cd" class="input" type="date"></label><label>Time<input id="ct" class="input" type="time"></label><label>Salesperson<select id="cs" class="input">${data.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></label><label>FSM notes<textarea id="cn"></textarea></label><button class="btn full" style="margin-top:14px" onclick="saveLiveDelivery()">CREATE DELIVERY</button>`)});}async function saveLiveDelivery(){const payload={p_customer_name:document.getElementById('cc').value.trim(),p_vehicle:document.getElementById('cv').value.trim(),p_lender_name:document.getElementById('cl').value.trim(),p_approval_status:document.getElementById('ca').value,p_delivery_at:new Date(document.getElementById('cd').value+'T'+document.getElementById('ct').value).toISOString(),p_salesperson_id:document.getElementById('cs').value,p_fsm_notes:document.getElementById('cn').value.trim(),p_requirements:[]};if(!payload.p_customer_name||!payload.p_vehicle)return notify('Missing information','Customer and vehicle are required.');const{error}=await sb.rpc('create_delivery_with_requirements',payload);if(error)return notify('Unable to create',error.message);closeSheet();await liveData();go('deliveries')}function saveDemo(){const d={id:'demo'+Date.now(),customer_name:document.getElementById('cc').value||'Demo Customer',vehicle:document.getElementById('cv').value||'Demo Vehicle',delivery_at:new Date((document.getElementById('cd').value||new Date().toISOString().slice(0,10))+'T'+(document.getElementById('ct').value||'15:00')).toISOString(),status:'scheduled',delivery_requirements:[]};S.deliveries.unshift(d);closeSheet();go('deliveries')}function addReq(id){sheet(`<h2>Add Delivery Requirement</h2><label>Requirement<select id="at" class="input"><option value="">Custom</option>${S.templates.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('')}</select></label><label>Label<input id="al" class="input"></label><label>Amount<input id="aa" class="input" type="number" min="0" step="0.01"></label><button class="btn full" style="margin-top:14px" onclick="saveReq('${id}')">ADD REQUIREMENT</button>`)}async function saveReq(id){const t=S.templates.find(x=>x.id===document.getElementById('at').value),label=(document.getElementById('al').value.trim()||t?.label||'').trim();if(!label)return notify('Requirement needed','Choose or enter a requirement.');const kind=t?.kind||'custom',amount=document.getElementById('aa').value||null;if(test()){const d=S.deliveries.find(x=>x.id===id);d.delivery_requirements.push({id:'r'+Date.now(),label,kind,amount,completed:false});closeSheet();notify('New instruction added','TEST MODE — simulated salesperson notification.');return render()}const{error}=await sb.from('delivery_requirements').insert({delivery_id:id,kind,label,amount});if(error)return notify('Unable to add',error.message);closeSheet();await liveData();openDelivery(id)}function library(){go('library')}function libraryScreen(){const can=master()||S.profile?.can_manage_requirement_library;return `<button class="btn ghost small" onclick="go('home')">← BACK</button><div class="row" style="margin-top:15px"><div><div class="eyebrow">Reusable Requirements</div><h1>Requirement Library</h1></div>${can?`<button class="btn" onclick="newTemplate()">＋ ADD</button>`:''}</div><div class="card">${S.templates.map(t=>`<div class="listitem row"><div><b>${esc(t.label)}</b><div class="muted">${esc(t.category||'Custom')} · ${esc(t.kind)}</div></div>${can?`<button class="btn secondary small" onclick="editTemplate('${t.id}')">EDIT</button>`:''}</div>`).join('')||'<div class="muted">No requirements yet.</div>'}</div>`}function newTemplate(){sheet(`<h2>Add Requirement</h2><label>Name<input id="tn" class="input"></label><label>Category<select id="tc" class="input"><option>Customer Documents</option><option>Financial</option><option>Vehicle / Trade</option><option>Insurance</option><option>Other</option></select></label><label>Type<select id="tk" class="input"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund due</option></select></label><button class="btn full" style="margin-top:14px" onclick="saveTemplate()">SAVE</button>`)}async function saveTemplate(){const label=document.getElementById('tn').value.trim();if(!label)return notify('Name required','Enter a requirement name.');const row={label,category:document.getElementById('tc').value,kind:document.getElementById('tk').value,active:true};if(test()){state.templates.push({...row,id:'t'+Date.now()});closeSheet();return render()}const{error}=await sb.from('requirement_templates').insert({...row,dealership_id:S.profile.dealership_id,created_by:S.profile.id});if(error)return notify('Unable to save',error.message);closeSheet();await liveData();render()}function editTemplate(id){const t=S.templates.find(x=>x.id===id);sheet(`<h2>Edit Requirement</h2><label>Name<input id="tn" class="input" value="${esc(t.label)}"></label><label>Category<select id="tc" class="input"><option ${t.category==='Customer Documents'?'selected':''}>Customer Documents</option><option ${t.category==='Financial'?'selected':''}>Financial</option><option ${t.category==='Vehicle / Trade'?'selected':''}>Vehicle / Trade</option><option ${t.category==='Insurance'?'selected':''}>Insurance</option><option ${t.category==='Other'?'selected':''}>Other</option></select></label><button class="btn full" style="margin-top:14px" onclick="updateTemplate('${id}')">SAVE CHANGES</button>`)}async function updateTemplate(id){const label=document.getElementById('tn').value.trim(),category=document.getElementById('tc').value;if(!label)return;if(test()){const t=S.templates.find(x=>x.id===id);Object.assign(t,{label,category});closeSheet();return render()}const{error}=await sb.from('requirement_templates').update({label,category,updated_at:new Date().toISOString()}).eq('id',id);if(error)return notify('Unable to update',error.message);closeSheet();await liveData();render()}function teamScreen(){if(!master()||test())return '<div class="card">Team Management is available in Master mode.</div>';const rows=S.team.filter(x=>x.id!==S.profile.id).map(x=>`<div class="listitem"><div class="row"><div><b>${esc(x.full_name)}</b><div class="muted">${esc(x.role)} · ${x.active?'Active':'Inactive'}</div></div><button class="btn secondary small" onclick="toggleActive('${x.id}',${!x.active})">${x.active?'DEACTIVATE':'ACTIVATE'}</button></div>${x.role==='fsm'?`<div class="row" style="margin-top:8px"><span class="muted">Requirement Library Authority</span><button class="btn ghost small" onclick="toggleFsm('${x.id}')">CHANGE</button></div>`:''}</div>`).join('');return `<div class="row"><div><div class="eyebrow">Master Authority</div><h1>Team Management</h1></div><button class="btn" onclick="invite()">＋ INVITE</button></div><div class="card">${rows||'<div class="muted">No team members yet.</div>'}</div>`}async function toggleActive(id,val){const{error}=await sb.rpc('set_team_member_active',{p_user_id:id,p_active:val});if(error)return notify('Unable to update',error.message);await liveData();render()}async function toggleFsm(id){const{data}=await sb.from('fsm_permissions').select('can_manage_requirement_library').eq('user_id',id).maybeSingle();const{error}=await sb.rpc('set_fsm_requirement_library_permission',{p_user_id:id,p_allowed:!data?.can_manage_requirement_library});if(error)return notify('Unable to update',error.message);await liveData();render()}function invite(){sheet(`<h2>Create Team Invitation</h2><label>Role<select id="ir" class="input"><option value="fsm">FSM</option><option value="salesperson">Salesperson</option></select></label><button class="btn full" style="margin-top:14px" onclick="createInvite()">GENERATE SINGLE-USE CODE</button><div id="inv"></div>`)}async function createInvite(){const{data,error}=await sb.rpc('create_team_invite',{p_role:document.getElementById('ir').value});if(error)return notify('Unable to create invite',error.message);document.getElementById('inv').innerHTML=`<div class="card"><div class="eyebrow">Invitation Code</div><h2 style="letter-spacing:.16em">${esc(data)}</h2><div class="muted">Give this code to the intended team member.</div></div>`}function notifications(){return `<div class="eyebrow">Live Updates</div><h1>Notifications</h1><div class="card">${S.notes.map(n=>`<div class="listitem"><b>${esc(n.title)}</b><div class="muted">${esc(n.body)}</div><div class="muted" style="font-size:11px">${new Date(n.sent_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No notifications yet.</div>'}</div>`}function account(){return `<div class="eyebrow">Account</div><h1>${esc(S.profile?.full_name||'Rahul Champaneri')}</h1><div class="card"><div class="row"><div><h2>${esc(role())}</h2><div class="muted">${test()?'Master session · simulated authority':'Authorized account'}</div></div><span class="badge">ACTIVE</span></div></div>${test()?`<button class="btn secondary full" onclick="exitTest()">RETURN TO MASTER</button><div style="height:8px"></div>`:''}<button class="btn danger full" onclick="signout()">SIGN OUT</button>`}function go(s){S.screen=s;render()}function enterTest(r){if(!master()||test())return;S.testRole=r;demo();S.screen='home';render()}async function exitTest(){S.testRole=null;await liveData();S.screen='home';render()}async function signout(){await sb.auth.signOut();if(S.channel)sb.removeChannel(S.channel);Object.assign(S,{profile:null,session:null,testRole:null,deliveries:[],templates:[],team:[],notes:[]});login()}function sheet(h){closeSheet();const m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<section class="sheet"><button class="btn ghost small" onclick="closeSheet()">CLOSE</button><div style="height:10px"></div>${h}</section>`;document.body.appendChild(m)}function closeSheet(){document.getElementById('modal')?.remove()}function subscribeRealtime(){if(test()||S.channel)return;S.channel=sb.channel('axiom-live-'+S.profile.dealership_id).on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},async()=>{await liveData();if(S.screen==='home'||S.screen==='deliveries'||S.screen.startsWith('delivery:'))render()}).on('postgres_changes',{event:'*',schema:'public',table:'delivery_requirements'},async()=>{await liveData();if(S.screen==='home'||S.screen==='deliveries'||S.screen.startsWith('delivery:'))render()}).subscribe();sb.channel('axiom-note-'+S.profile.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notification_history',filter:'user_id=eq.'+S.profile.id},p=>{S.notes.unshift(p.new);notify(p.new.title,p.new.body)}).subscribe()}function subscribe(){subscribeRealtime()}window.addEventListener('load',boot)</script></body></html>
