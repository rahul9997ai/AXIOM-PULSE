<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>AXIOM Pulse — Role Control Proof</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#06101b}iframe{display:block;width:100%;height:100%;border:0;background:#06101b}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#06101b;color:#dbe8f7;font:600 14px system-ui;z-index:9999}.boot.hide{display:none}
</style></head><body>
<div id="boot" class="boot">Loading AXIOM PULSE…</div>
<iframe id="app" src="./proof-v2.html?v=rolecontrol3" title="AXIOM Pulse"></iframe>
<script>
const frame=document.getElementById('app'), boot=document.getElementById('boot');
function patch(){
  const w=frame.contentWindow;
  if(!w||!w.S||!w.R||!w.rest||!w.load)return false;
  const esc=w.esc,E=w.E,C=w.C,S=w.S,R=w.R;

  const canLists=()=>S.p?.role==="master" || (S.p?.role==="fsm" && !!S.p?.can_manage_requirement_library);
  const isMaster=()=>S.p?.role==="master";
  const isFSM=()=>S.p?.role==="fsm";

  w.modal=function(html){
    w.close();
    const m=w.document.createElement("div");
    m.className="modal";m.id="modal";
    const sheet=w.document.createElement("section");
    sheet.className="sheet";sheet.innerHTML=html;m.appendChild(sheet);
    const dismiss=e=>{if(e.target===m)w.close()};
    m.addEventListener("click",dismiss);
    m.addEventListener("pointerdown",dismiss);
    sheet.addEventListener("click",e=>e.stopPropagation());
    sheet.addEventListener("pointerdown",e=>e.stopPropagation());
    w.document.body.appendChild(m);
  };
  w.close=function(){w.document.getElementById("modal")?.remove()};

  w.load=async function(uid){
    let p=await w.rest("/profiles?id=eq."+E(uid)+"&select=*");
    S.p=p[0]; if(!S.p?.active)throw Error("Account inactive");
    let did=E(S.p.dealership_id), dq=S.p.role==="salesperson"?"/deliveries?salesperson_id=eq."+E(S.p.id):"/deliveries?dealership_id=eq."+did;
    [S.d,S.team,S.lenders,S.n,S.templates]=await Promise.all([
      w.rest(dq+"&select=*,delivery_requirements(*)&order=delivery_at.asc"),
      w.rest("/profiles?dealership_id=eq."+did+"&select=id,full_name,role,active,created_at,can_manage_requirement_library"),
      w.rest("/lenders_lessors?dealership_id=eq."+did+"&select=*&order=name.asc"),
      w.rest("/notification_history?user_id=eq."+E(S.p.id)+"&select=*&order=sent_at.desc"),
      w.rest("/requirement_templates?dealership_id=eq."+did+"&select=*&order=sort_order.asc,label.asc")
    ]);
  };

  w.app=function(){
    const nav = isMaster()
      ? '<button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'admin\')">⚙<br>Control</button><button onclick="go(\'lenders\')">▤<br>Lenders</button><button onclick="go(\'requirements\')">☑<br>Requirements</button><button onclick="go(\'account\')">◌<br>Account</button>'
      : isFSM()
      ? '<button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">▣<br>Deliveries</button>'+(canLists()?'<button onclick="go(\'lenders\')">▤<br>Lenders</button><button onclick="go(\'requirements\')">☑<br>Requirements</button>':'')+'<button onclick="go(\'alerts\')">◉<br>Alerts</button><button onclick="go(\'account\')">◌<br>Account</button>'
      : '<button onclick="go(\'home\')">⌂<br>Home</button><button onclick="go(\'deliveries\')">▣<br>Deliveries</button><button onclick="go(\'alerts\')">◉<br>Alerts</button><button onclick="go(\'account\')">◌<br>Account</button>';
    R.innerHTML='<div class="head"><b>AXIOM</b> <i>Pulse</i><div class="mini">AI Executive Intelligence &amp; Operations Management • by Rahul Champaneri</div></div><main id="main" class="main"></main><nav class="nav">'+nav+'</nav>';
    w.go(S.screen||"home");
  };

  w.go=function(x){
    S.screen=x; const m=w.document.getElementById("main"); if(!m)return;
    if(x==="home"){
      if(isMaster()){
        m.innerHTML='<h1>Master Control</h1><p class="muted">User administration only.</p><section class="card"><h2>Manage Users</h2><p class="muted">Create, edit, activate, deactivate and remove FSM and Salesperson accounts.</p><button class="btn" onclick="go(\'admin\')">MANAGE USERS</button></section><section class="card"><h2>Shared Master Lists</h2><p class="muted">Lender / Lessor Directory and Requirement Library are maintained separately by Master and designated FSM users.</p></section>';
      }else if(isFSM()){
        m.innerHTML='<h1>FSM Workspace</h1><p class="muted">Manage delivery workflow and assigned operational work.</p><section class="card"><button class="btn" onclick="go(\'deliveries\')">OPEN DELIVERIES</button></section>'+(canLists()?'<section class="card"><div class="grid"><button class="btn secondary" onclick="go(\'lenders\')">LENDER / LESSOR DIRECTORY</button><button class="btn secondary" onclick="go(\'requirements\')">REQUIREMENT LIBRARY</button></div></section>':'');
      }else{
        m.innerHTML='<h1>Salesperson Workspace</h1><p class="muted">Your assigned deliveries and requirements.</p><section class="card">'+w.list(S.d.slice(0,6))+'</section>';
      }
      return;
    }
    if(x==="admin"){w.admin(m);return}
    if(x==="deliveries"){
      if(isMaster()){m.innerHTML='<h1>Deliveries</h1><section class="card muted">Master Control is reserved for user administration. Use an FSM account for delivery operations.</section>';return}
      m.innerHTML='<div class="row"><h1>Deliveries</h1>'+(isFSM()?'<button class="btn small" onclick="newDelivery()">+ CREATE</button>':'')+'</div><section class="card">'+w.list(S.d)+'</section>';return;
    }
    if(x==="lenders"){if(!canLists()){m.innerHTML='<section class="card"><h2>Access restricted</h2><p class="muted">Only Master and designated FSM users can manage this directory.</p></section>';return} lenderScreen(m);return}
    if(x==="requirements"){if(!canLists()){m.innerHTML='<section class="card"><h2>Access restricted</h2><p class="muted">Only Master and designated FSM users can manage the Requirement Library.</p></section>';return} requirementScreen(m);return}
    if(x==="alerts"){m.innerHTML='<h1>Alerts</h1><section class="card">'+(S.n.map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div><div class="mini">'+new Date(n.sent_at).toLocaleString()+'</div></div>').join("")||'<div class="muted">No alerts.</div>')+'</section>';return}
    if(x==="account"){m.innerHTML='<h1>Account</h1><section class="card"><h2>'+esc(S.p.full_name)+'</h2><p class="muted">'+esc(S.p.role.toUpperCase())+' access</p><button class="btn danger" onclick="logout()">SIGN OUT</button></section>';return}
  };

  w.admin=function(m){
    m.innerHTML='<div class="row"><div><h1>Manage Users</h1><p class="muted">Master Control: FSM and Salesperson accounts only.</p></div><button class="btn small" onclick="users()">+ INVITE</button></div><section class="card">'+S.team.filter(x=>x.id!==S.p.id).map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.full_name)+'</b><div class="mini">'+esc(x.role)+' • '+(x.active?"Active":"Inactive")+(x.role==="fsm"?(x.can_manage_requirement_library?" • List Manager":""):"")+'</div></div><button class="btn small secondary" onclick="editUser(\''+x.id+'\')">EDIT</button></div></div>').join("")+'</section>';
  };

  w.users=function(){
    w.modal('<div class="row"><h2>Manage Users</h2><button class="btn small" onclick="invite()">+ INVITE</button></div>'+S.team.filter(x=>x.id!==S.p.id).map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.full_name)+'</b><div class="mini">'+esc(x.role)+' • '+(x.active?"Active":"Inactive")+'</div></div><button class="btn small secondary" onclick="editUser(\''+x.id+'\')">EDIT</button></div></div>').join(""));
  };

  w.editUser=function(id){
    const u=S.team.find(x=>x.id===id);
    w.modal('<h2>Edit User</h2><label>Name<input id="un" class="input" value="'+esc(u.full_name||"")+'"></label><label>Role<select id="ur"><option value="fsm" '+(u.role==="fsm"?"selected":"")+'>FSM</option><option value="salesperson" '+(u.role==="salesperson"?"selected":"")+'>Salesperson</option></select></label><label>Status<select id="ua"><option value="true" '+(u.active?"selected":"")+'>Active</option><option value="false" '+(!u.active?"selected":"")+'>Inactive</option></select></label>' +(u.role==="fsm"?'<label class="req" style="display:flex;align-items:center;gap:10px;margin-top:14px"><input id="ulp" type="checkbox" '+(u.can_manage_requirement_library?"checked":"")+'> Designated FSM: manage Lender / Lessor and Requirement Library</label>':'')+'<label>New password<input id="up" class="input" type="password"></label><div id="msg"></div><button class="btn" onclick="saveUserV3(\''+id+'\')">SAVE</button><button class="btn danger" onclick="removeUser(\''+id+'\')">REMOVE USER</button>');
  };

  w.saveUserV3=async function(id){
    try{
      const u=S.team.find(x=>x.id===id), nextRole=w.document.getElementById("ur").value;
      await w.teamCall({op:"update",user_id:id,full_name:w.document.getElementById("un").value.trim(),role:nextRole,active:w.document.getElementById("ua").value==="true",password:w.document.getElementById("up").value||undefined});
      if(nextRole==="fsm"){
        const allowed=!!w.document.getElementById("ulp")?.checked;
        await w.q("/rpc/set_fsm_requirement_library_permission",{method:"POST",body:JSON.stringify({p_user_id:id,p_allowed:allowed})});
      }
      await w.load(S.p.id);w.close();w.app();w.note("User updated","Role and permissions are active.");
    }catch(e){w.document.getElementById("msg").textContent=e.message}
  };

  w.newDelivery=function(){
    const sales=S.team.filter(x=>x.role==="salesperson"&&x.active), ls=S.lenders.filter(x=>x.active), ts=S.templates.filter(x=>x.active);
    w.modal('<div class="row"><h2>Create Delivery</h2><button class="btn small secondary" onclick="close()">CLOSE</button></div><div id="msg"></div><div class="field"><label>Customer<input id="dc" class="input"></label></div><div class="field"><label>Vehicle<input id="dv" class="input"></label></div><div class="field"><label>Lender / Lessor<select id="dl"><option value="">Select saved lender / lessor</option>'+ls.map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.city?" • "+esc(x.city):"")+'</option>').join("")+'</select></label></div><div class="grid"><div class="field"><label>Date<input id="dd" class="input" type="date"></label></div><div class="field"><label>Time<input id="dt" class="input" type="time"></label></div></div><div class="field"><label>Salesperson<select id="ds"><option value="">Select active salesperson</option>'+sales.map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+'</option>').join("")+'</select></label></div><div class="field"><label>FSM Notes<textarea id="dn" class="input"></textarea></label></div><div class="field"><label>Requirements</label><div class="mini">Select one or more requirements for this delivery.</div><div id="reqpick">'+ts.map(x=>'<label class="req" style="display:flex;align-items:center;gap:10px"><input type="checkbox" value="'+x.id+'" onchange="toggleReq(this)"> <span>'+esc(x.label)+'</span></label>').join("")+'</div></div><div class="field"><label>Add requirement on the fly<input id="rqcustom" class="input" placeholder="Type a custom requirement"></label><button class="btn small secondary" onclick="addReq()">+ ADD REQUIREMENT</button></div><div id="reqs"></div><button class="btn" onclick="createD()">CREATE DELIVERY</button>');
    w.DR=[];
  };

  function lenderScreen(m){
    m.innerHTML='<div class="row"><div><h1>Lender / Lessor Directory</h1><p class="muted">Shared master list maintained by Master and designated FSM users.</p></div><button class="btn small" onclick="editL()">+ ADD</button></div><section class="card">'+(S.lenders.length?S.lenders.map(x=>'<div class="item"><div class="row"><div><b>'+esc(x.name)+'</b><div class="mini">'+esc([x.address_line1,x.city,x.province,x.postal_code].filter(Boolean).join(", "))+' • '+(x.active?"Active":"Inactive")+'</div></div><button class="btn small secondary" onclick="editL(\''+x.id+'\')">EDIT</button></div></div>').join(""):'<div class="muted">No lenders saved.</div>')+'</section>';
  }
  w.editL=function(id){
    const x=id?S.lenders.find(z=>z.id===id):{};
    w.modal('<h2>'+ (id?"Edit":"Add") +' Lender / Lessor</h2><label>Name<input id="ln" class="input" value="'+esc(x?.name||"")+'"></label><label>Address<input id="la" class="input" value="'+esc(x?.address_line1||"")+'"></label><label>Address line 2<input id="la2" class="input" value="'+esc(x?.address_line2||"")+'"></label><div class="grid"><label>City<input id="lc" class="input" value="'+esc(x?.city||"")+'"></label><label>Province<input id="lp" class="input" value="'+esc(x?.province||"")+'"></label></div><div class="grid"><label>Postal Code<input id="lz" class="input" value="'+esc(x?.postal_code||"")+'"></label><label>Country<input id="lco" class="input" value="'+esc(x?.country||"Canada")+'"></label></div><label>Status<select id="lx"><option value="true" '+(x?.active!==false?"selected":"")+'>Active</option><option value="false" '+(x?.active===false?"selected":"")+'>Inactive</option></select></label><div id="msg"></div><button class="btn" onclick="saveLV3('+JSON.stringify(id)+')">SAVE LENDER / LESSOR</button>');
  };
  w.saveLV3=async function(id){
    try{
      const b={dealership_id:S.p.dealership_id,name:w.document.getElementById("ln").value.trim(),address_line1:w.document.getElementById("la").value.trim()||null,address_line2:w.document.getElementById("la2").value.trim()||null,city:w.document.getElementById("lc").value.trim()||null,province:w.document.getElementById("lp").value.trim()||null,postal_code:w.document.getElementById("lz").value.trim()||null,country:w.document.getElementById("lco").value.trim()||"Canada",active:w.document.getElementById("lx").value==="true",created_by:S.p.id,updated_at:new Date().toISOString()};
      if(!b.name)throw Error("Name is required");
      await w.rest(id?"/lenders_lessors?id=eq."+E(id):"/lenders_lessors",{method:id?"PATCH":"POST",body:JSON.stringify(b)});
      await w.load(S.p.id);w.close();w.go("lenders");w.note("Directory updated","Saved details are available in delivery dropdowns.");
    }catch(e){w.document.getElementById("msg").textContent=e.message}
  };

  function requirementScreen(m){
    m.innerHTML='<div class="row"><div><h1>Requirement Library</h1><p class="muted">Shared master list maintained by Master and designated FSM users.</p></div><button class="btn small" onclick="newReqV3()">+ ADD</button></div><section class="card">'+(S.templates.length?S.templates.map(t=>'<div class="item"><div class="row"><div><b>'+esc(t.label)+'</b><div class="mini">'+esc(t.category||"Other")+' • '+esc(t.kind||"custom")+' • '+(t.active?"Active":"Inactive")+'</div></div><button class="btn small secondary" onclick="editReqV3(\''+t.id+'\')">EDIT</button></div></div>').join(""):'<div class="muted">No requirements saved.</div>')+'</section>';
  }
  w.newReqV3=function(){w.modal('<h2>Add Requirement</h2><label>Name<input id="rn" class="input"></label><label>Category<input id="rc" class="input" value="Other"></label><label>Type<select id="rk"><option value="custom">Custom</option><option value="void_cheque">Void cheque</option><option value="trade_ownership">Trade ownership</option><option value="trade_release">Trade release</option><option value="insurance">Insurance / Binder</option><option value="money_collect">Money due</option><option value="refund">Refund</option></select></label><button class="btn" onclick="saveReqV3()">SAVE REQUIREMENT</button>')};
  w.editReqV3=function(id){const t=S.templates.find(x=>x.id===id);w.modal('<h2>Edit Requirement</h2><label>Name<input id="rn" class="input" value="'+esc(t.label)+'"></label><label>Category<input id="rc" class="input" value="'+esc(t.category||"Other")+'"></label><label>Status<select id="ra"><option value="true" '+(t.active?"selected":"")+'>Active</option><option value="false" '+(!t.active?"selected":"")+'>Inactive</option></select></label><div id="msg"></div><button class="btn" onclick="saveReqV3(\''+id+'\')">SAVE CHANGES</button><button class="btn danger" onclick="deleteReqV3(\''+id+'\')">DELETE REQUIREMENT</button>')};
  w.saveReqV3=async function(id){
    try{
      const label=w.document.getElementById("rn").value.trim(),category=w.document.getElementById("rc").value.trim()||"Other";
      if(!label)throw Error("Requirement name is required");
      const body=id?{label,category,active:w.document.getElementById("ra").value==="true",updated_at:new Date().toISOString()}:{dealership_id:S.p.dealership_id,label,category,kind:w.document.getElementById("rk").value,active:true,created_by:S.p.id};
      await w.rest(id?"/requirement_templates?id=eq."+E(id):"/requirement_templates",{method:id?"PATCH":"POST",body:JSON.stringify(body)});
      await w.load(S.p.id);w.close();w.go("requirements");w.note("Requirement saved","The library is updated.");
    }catch(e){w.document.getElementById("msg")?.textContent=e.message}
  };
  w.deleteReqV3=async function(id){if(!w.confirm("Delete this requirement from the master list?"))return;try{await w.rest("/requirement_templates?id=eq."+E(id),{method:"DELETE"});await w.load(S.p.id);w.close();w.go("requirements");w.note("Requirement deleted","Removed from the master list.")}catch(e){w.document.getElementById("msg")?.textContent=e.message}};

  w.logout=function(){w.close();w.localStorage.removeItem("axp");S.a=null;S.p=null;S.d=[];S.team=[];S.lenders=[];S.n=[];S.templates=[];S.screen="home";w.login()};

  (async()=>{try{if(S.p){await w.load(S.p.id);w.app()}boot.classList.add("hide")}catch(e){boot.textContent="Unable to prepare proof: "+e.message}})();
  return true;
}
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{if(patch()||++tries>80)clearInterval(timer)},50)});
</script></body></html>
